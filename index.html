 {t:`recall`,k:`k_cga`,q:`What is the Capability Gap Assessment, and what statute does it support?`,a:`The process for reviewing, assessing and prioritizing CCMD requirements, fed by CCDR IPLs. It is the primary method supporting the CJCS’s 10 U.S.C. §153 Annual Report on Combatant Command Requirements, and it feeds JOPs, CPM and JFDD.`},
 {t:`type`,k:`k_cga`,q:`IPL stands for Integrated ___ List.`,accept:[`Priority`]},
 {t:`mc`,k:`k_jicr`,q:`The JICR replaced which two legacy processes?`,o:[`ICD and CDD`,`JUON and JEON`,`POM and BES`,`CGA and IPL`],a:1,why:`Joint Urgent and Joint Emergent Operational Needs.`}
]},
{id:`L74`,title:`Following the money`,sub:`CPM = CPMR + IAPR + TMTR, and the RRAB, MEIA and JAR`,mins:9,slides:`Slides 14, 27, 38`,steps:[
 {t:`teach`,h:`From programs to portfolios`,slide:`Slide 38`,b:`<p>The old way managed one program at a time. <b>Capability Portfolio Management (CPM)</b> looks at whole portfolios of capabilities against the same problem, so leaders can see the trade space: cut here, add there, accept risk somewhere else.</p><p>Governing documents: DoDD 7045.20, Capability Portfolio Management (September 2023), and a July 2024 MOA among USW(R&E), USW(A&S) and the JROC Chair. The 20 Aug 2025 memo tasked USW(A&S) to lead a revised DoDD 7045.20 and a new DoD Instruction.</p>`},
 {t:`teach`,h:`CPM = three reviews, plus the money`,fig:`cpmparts`,b:`<p>Each review belongs to the owner of one of the decision support systems from Unit 2: requirements (Joint Staff), acquisition (A&S) and technology (R&E). The PBR brings in CAPE’s budget view.</p>`},
 {t:`match`,k:`k_cpm`,q:`Match each review to its full name.`,pairs:[[`CPMR`,`Capability Portfolio Management Review`],[`IAPR`,`Integrated Acquisition Portfolio Review`],[`TMTR`,`Technology Modernization Transition Review`]],why:`CPM = CPMR + IAPR + TMTR, with PBR input.`},
 {t:`teach`,h:`What CPM shares across portfolios`,b:`<ul><li><b>Common mission thread:</b> JOPs derived from the NDS, JWC, KOPs, CRCs and CCMD gaps</li><li><b>Common analytic scope:</b> a framework for analytic alignment</li><li><b>Common SAP portfolio:</b> fully informed, driving to integrate Title 50 capabilities</li><li><b>Independent analysis:</b> CPMR, IAPR, TMTR… PBR</li><li><b>Outcome:</b> integrated analysis that articulates <b>risks, options, trade space and recommendations</b> to decision-makers</li></ul>`},
 {t:`teach`,h:`The cycle`,fig:`cpm`,b:``},
 {t:`order`,k:`k_cpm`,q:`Put the CPM-to-resourcing cycle in order.`,items:[`JROC (JFRC) identifies and prioritizes JOPs`,`CPM efforts align to the JOPs`,`RRAB selects 1–2 JOPs per PBR cycle`,`Integrated CPM analysis is presented to the RRAB`,`RRAB makes the resourcing decision`],why:`Then it repeats each PBR cycle. Not all CPM efforts are forwarded to the RRAB.`},
 {t:`type`,k:`k_cpm`,q:`How many JOPs does the RRAB select per PBR cycle? (Answer as a range, e.g. 3–4.)`,accept:[`1-2`,`1–2`,`1 to 2`,`one to two`,`1 or 2`,`one or two`,`1 2`]},
 {t:`explore`,h:`The three new organizations`,spots:[[`RRAB`,`Requirements and Resourcing Alignment Board. Co-chaired by the VCJCS and the Deputy Secretary of War, with the Director of CAPE and the Joint Staff J-8 as executive co-secretaries. The single forum for aligning money to the top problems, synchronized with the PBR: it issues programming guidance, recommends JAR allocations, and can by exception flag a Service requirement for modification or termination.`],[`MEIA`,`Mission Engineering and Integration Activity. Established by USW(R&E), with integration support from USW(A&S). It runs mission engineering on the top problems, engages industry, integrates capabilities and runs experimentation campaigns, then recommends solutions for JAR funding.`],[`JAR`,`Joint Acceleration Reserve. Starting with the FY2027 budget, CAPE and the Comptroller withhold a slice of top-line fiscal guidance to create it. It’s allocated during the PBR on RRAB decisions to fund solutions to top problems and bridge the “valley of death” between prototype and program. Slide 27 frames it as an incentive for Services to help resolve JOPs.`]]},
 {t:`match`,k:`k_rrab k_cpm`,q:`Match the organization to its role.`,pairs:[[`RRAB`,`Decides resourcing for top JOPs; programming guidance`],[`MEIA`,`Mission engineering, experiments, industry`],[`JAR`,`Withheld money pool allocated at the PBR`],[`CPM`,`Portfolio analysis: risks, options, trade space`]]},
 {t:`mc`,k:`k_rrab`,q:`Who co-chairs the RRAB?`,o:[`USW(A&S) and USW(R&E)`,`The VCJCS and the Deputy Secretary of War`,`The CJCS and the President`,`Director CAPE and the Comptroller`],a:1,why:`CAPE and J-8 are the executive co-secretaries who prepare its recommendations.`},
 {t:`key`,h:`Capability Portfolio Management (Slide 38)`,k:`k_cpm k_rrab`,b:`<ul><li><b>CPM = CPMR</b> (Capability Portfolio Management Review) <b>+ IAPR</b> (Integrated Acquisition Portfolio Review) <b>+ TMTR</b> (Technology Modernization Transition Review), with PBR input.</li><li>Cycle: JFRC identifies and prioritizes JOPs → CPM aligned → <b>RRAB selects 1–2 JOPs per PBR cycle</b> → integrated analysis to RRAB → RRAB resourcing decision → repeat. Not all CPM efforts go to the RRAB.</li><li>DoDD 7045.20 (Sep 2023); MOA USW(R&E)/USW(A&S)/JROC Chair (Jul 2024); 20 Aug 2025 memo: USW(A&S) to revise DoDD 7045.20 and publish a new DoDI.</li><li>Outcome: risks, options, trade space, recommendations.</li></ul>`}
],review:[
 {t:`recall`,k:`k_cpm`,q:`What three reviews make up CPM?`,a:`CPMR (Capability Portfolio Management Review) + IAPR (Integrated Acquisition Portfolio Review) + TMTR (Technology Modernization Transition Review), with PBR input.`},
 {t:`recall`,k:`k_cpm`,q:`Describe the CPM-to-RRAB cycle.`,a:`The JROC identifies and prioritizes JOPs; CPM efforts align to them; the RRAB selects 1–2 JOPs per PBR cycle; integrated CPM analysis is presented to the RRAB; the RRAB makes the resourcing decision. It repeats each PBR cycle, and not all CPM efforts go to the RRAB.`},
 {t:`recall`,k:`k_rrab`,q:`What are the RRAB, MEIA and JAR?`,a:`RRAB: Requirements and Resourcing Alignment Board, co-chaired by the VCJCS and Deputy Secretary of War; aligns money to top JOPs at the PBR. MEIA: Mission Engineering and Integration Activity under USW(R&E); mission engineering, experimentation, industry engagement, recommendations. JAR: Joint Acceleration Reserve; withheld top-line money allocated at the PBR on RRAB decisions (from FY2027).`},
 {t:`mc`,k:`k_cpm`,q:`Which directive governs Capability Portfolio Management?`,o:[`DoDD 7045.14`,`DoDD 7045.20`,`DoDI 5000.02`,`CJCSI 5123.01J`],a:1,why:`7045.20 = CPM. 7045.14 = PPBE. They’re easy to swap.`}
]}
]},

{id:`U8`,title:`Draw the 7.2B from memory`,sub:`AEGIS Baseline 7.2B destroyer combat system, built layer by layer`,lessons:[
{id:`L81`,title:`The frame and the colors`,sub:`Title, three zones, and what red, yellow and blue mean`,mins:5,slides:`Slide 2`,steps:[
 {t:`chartshow`,h:`Start with the frame`,b:`Every time you draw the chart, start here: the title, the dashed border, the three zone headings, and the legend.`,o:{show:[]}},
 {t:`teach`,h:`Why three columns`,b:`<p>Remember Meyer’s three functional cornerstones from Lesson 1.1? <b>Detect, Control, Engage.</b> The chart follows them left to right: sensors on the left, the decision and network core in the middle, weapons on the right.</p><p>Top left in red: <b>BL 7.2B</b>. The title: <b>(U) Aegis Destroyer Combat System</b>. UNCLASSIFIED at the top right and the bottom center.</p>`},
 {t:`explore`,h:`The three colors`,fig:chartFig({show:'all',lines:true}),spots:[[`Red`,`<b>Aegis Weapon System element.</b> The AWS is the original Aegis core: SPY radar, Command and Decision, the display system, weapon and fire control, the readiness test system, the trainer, and the launcher. Red is the <b>heart</b>.`],[`Yellow`,`<b>Aegis Combat System element.</b> Everything else integrated into the combat system: other sensors, Tomahawk, the gun, EW, the helicopter, undersea warfare. Yellow is the <b>body</b>.`],[`Blue`,`<b>Outside ACS “Lifeline.”</b> Connections to the world outside the ship’s combat system: external comms, data links, CEC, gridlock, the common operational picture. Blue is the <b>lifeline</b>.`]]},
 {t:`memo`,h:`Hook`,big:`Red heart. Yellow body. Blue lifeline.`,b:`Of the 33 named elements: <b>9 red, 18 yellow, 6 blue</b>.`},
 {t:`mc`,k:`k_72frame`,q:`On the 7.2B chart, red means…`,o:[`Aegis Weapon System element`,`Aegis Combat System element`,`Outside ACS “Lifeline”`,`Classified`],a:0,why:`Red = AWS, yellow = ACS, blue = outside-ACS lifeline.`},
 {t:`order`,k:`k_72frame`,q:`Left to right, the three zone headings are:`,items:[`DETECT`,`CONTROL`,`ENGAGE`],why:`Meyer’s cornerstones, in order.`},
 {t:`key`,h:`The frame (Slide 2)`,k:`k_72frame`,b:`<ul><li>Title: (U) Aegis Destroyer Combat System · BL 7.2B (top left, red) · UNCLASSIFIED (top right and bottom center).</li><li>Zones left → right: DETECT · CONTROL · ENGAGE.</li><li>Legend: red = Aegis Weapon System element · yellow = Aegis Combat System element · blue = Outside ACS “Lifeline.”</li></ul>`}
],review:[
 {t:`mc`,k:`k_72frame`,q:`On the 7.2B chart, blue means…`,o:[`Aegis Weapon System element`,`Aegis Combat System element`,`Outside ACS “Lifeline”`,`Training system`],a:2,why:`Blue = lifeline to the outside world.`},
 {t:`mc`,k:`k_72frame`,q:`On the 7.2B chart, yellow means…`,o:[`Aegis Combat System element`,`Aegis Weapon System element`,`Outside ACS “Lifeline”`,`Undersea only`],a:0,why:`Yellow = ACS element.`}
]},
{id:`L8B`,title:`Build the shape`,sub:`The bare frame as counts and shapes: 10 and 8, the hub, the Big Three and the rest`,mins:6,slides:`Slide 2`,steps:[
 {t:`teach`,h:`Shape first, names second`,fig:CH.shapeFig([`left`,`right`,`hub`,`big3`,`low3`,`up6`,`loners`],[],false),b:`<p>Before you fill in a single name, learn the <b>skeleton</b>. If you can sketch these shapes in the right places in under a minute, every name has a spot waiting for it. The next lessons fill them in with mnemonics.</p><p>Everything in this lesson is counts and shapes: boxes, tall ovals and flat ovals.</p>`},
 {t:`teach`,h:`Two columns: 10 and 8`,fig:CH.shapeFig([],[`left`,`right`]),b:`<p>Down the left, under DETECT: <b>10 boxes</b>. Down the right, under ENGAGE: <b>8 boxes</b>, a little wider.</p><p>Easy way to hold it: a ship has more ways to see than to shoot. <b>10 in, 8 out.</b></p>`},
 {t:`type`,k:`k_72shape`,q:`How many boxes run down the left (DETECT) column?`,accept:[`10`,`ten`],fig:CH.shapeFig([],[],false),why:`10 boxes on the left. 10 in, 8 out.`},
 {t:`type`,k:`k_72shape`,q:`And down the right (ENGAGE) column?`,accept:[`8`,`eight`],fig:CH.shapeFig([`left`],[],false),why:`8 boxes on the right.`},
 {t:`teach`,h:`One hub and the Big Three`,fig:CH.shapeFig([`left`,`right`],[`hub`,`big3`]),b:`<p>Dead center: <b>one hub</b>, a rounded box. Everything in the middle connects through it.</p><p>Around it, <b>the Big Three</b>: three tall ovals in a triangle. One on the <b>left</b>, leaning toward the sensors. One on <b>top</b>. One at the <b>lower right</b>, leaning toward the weapons.</p>`},
 {t:`teach`,h:`Bottom three and the upper six`,fig:CH.shapeFig([`left`,`right`,`hub`,`big3`],[`low3`,`up6`]),b:`<p>Along the bottom of the middle: <b>three flat ovals</b> in a shallow smile. The left one sits highest, the middle one lowest.</p><p>In the top-left corner of the middle: <b>the upper six, 3 flat ovals and 3 small boxes</b>. The ovals stack in a zigzag down the corner. One small box sits at the stack’s top left, and two small boxes sit side by side underneath it.</p>`},
 {t:`teach`,h:`Two loners`,fig:CH.shapeFig([`left`,`right`,`hub`,`big3`,`low3`,`up6`],[`loners`]),b:`<p>Two pieces don’t belong to a group: a <b>flat oval up top on the right</b>, between the top tall oval and the right column, and a <b>small box hanging under the left tall oval</b>.</p><p>Count it up: 10 + 8 + 1 + 3 + 3 + 6 + 2 = <b>33</b>. That’s every element on the chart.</p>`},
 {t:`memo`,h:`The shape in one breath`,big:`10 in, 8 out. One hub, the Big Three, bottom three, upper six, two loners.`,b:`Say the numbers as a rhythm: <b>ten, eight · one, three, three, six, two</b>. They add up to 33. The upper six is <b>3 and 3</b>: three flat ovals, three small boxes.`},
 {t:`fill`,k:`k_72shape`,q:`Left ___ boxes · Right ___ boxes · Middle: ___ hub, Big ___, bottom ___, upper ___, ___ loners.`,blanks:[`10`,`8`,`1`,`3`,`3`,`6`,`2`],bank:[`10`,`8`,`1`,`3`,`3`,`6`,`2`,`4`,`12`],why:`10 + 8 + 1 + 3 + 3 + 6 + 2 = 33.`},
 {t:`mc`,k:`k_72shape`,q:`Where do the Big Three tall ovals sit around the hub?`,o:[`Left, top and lower right`,`Left, right and bottom`,`All three in a row above it`,`Top, bottom and right`],a:0,fig:CH.shapeFig([`left`,`right`,`hub`],[],false),why:`A triangle: the left one leans toward DETECT, one sits on top, and the lower-right one leans toward ENGAGE.`},
 {t:`mc`,k:`k_72shape`,q:`The upper six in the top-left corner of the middle are…`,o:[`3 flat ovals and 3 small boxes`,`6 flat ovals`,`6 small boxes`,`4 flat ovals and 2 small boxes`],a:0,fig:CH.shapeFig([`left`,`right`,`hub`,`big3`,`low3`,`loners`],[],false),why:`A zigzag stack of 3 flat ovals, with 1 small box at its top left and 2 small boxes side by side underneath.`},
 {t:`chartbuild`,k:`k_72shape`,h:`Build the frame from nothing`},
 {t:`key`,h:`The shape of the 7.2B (Slide 2)`,k:`k_72shape`,b:`<ul><li><b>Left (DETECT):</b> 10 boxes.</li><li><b>Right (ENGAGE):</b> 8 boxes, a little wider.</li><li><b>Middle (CONTROL):</b> 1 hub (rounded box, dead center) · the Big Three tall ovals (left, top, lower right) · 3 flat ovals along the bottom · the upper six in the top-left corner (a zigzag stack of 3 flat ovals, 1 small box at its top left, 2 underneath) · 2 loners (a flat oval top right, a small box under the left tall oval).</li><li>10 + 8 + 1 + 3 + 3 + 6 + 2 = 33.</li></ul><p>Sketch this shape first every time you draw the chart. Then fill it in. The left column’s mnemonic is next: <b>Every Captain Scans Every Night, In Silence He Locates Contacts.</b></p>`}
],review:[
 {t:`recall`,k:`k_72shape`,q:`Describe the bare shape of the 7.2B chart, piece by piece, with counts.`,a:`Left column: 10 boxes. Right column: 8 boxes. Middle: 1 hub (rounded box, dead center); the Big Three tall ovals (left, top, lower right); 3 flat ovals along the bottom; the upper six in the top-left corner (3 flat ovals and 3 small boxes); 2 loners (a flat oval top right, a small box under the left tall oval). 33 in all.`},
 {t:`type`,k:`k_72shape`,q:`How many elements are on the 7.2B chart in all?`,accept:[`33`,`thirty three`,`thirty-three`],why:`10 + 8 + 1 + 3 + 3 + 6 + 2 = 33.`},
 {t:`mc`,k:`k_72shape`,q:`What are the two loners?`,o:[`A flat oval top right, and a small box under the left tall oval`,`Two tall ovals under the hub`,`Two small boxes beside the right column`,`A flat oval under the hub and a box above it`],a:0,fig:CH.shapeFig([`left`,`right`,`hub`,`big3`,`low3`,`up6`],[],false),why:`They’re the only two pieces outside a group.`}
]},
{id:`L82`,title:`The DETECT column`,sub:`Ten boxes, top to bottom, with a reason for every position`,mins:8,slides:`Slide 2`,steps:[
 {t:`chartshow`,h:`Ten boxes, top to bottom`,b:`Here’s the DETECT column. Don’t memorize it yet. First see the logic.`,o:{show:Z.DETECT}},
 {t:`teach`,h:`The logic of the order`,b:`<p>Read it as a ship sensing the world from the outside in, then from the sky down into the sea:</p><ol><li><b>EXCOM</b>: hear from the outside world (blue)</li><li><b>Combat DF</b>: listen for enemy emitters</li><li><b>Surface Search</b>: see ships on the surface</li><li><b>ESS</b>: sense electronic emissions</li><li><b>Navigation (Gyro)</b>: know your own heading and position</li><li><b>IFF</b>: ask, “Friend?”</li><li><b>SPY Radar</b>: see the air (red: the AWS heart)</li><li><b>Hull Sonar</b>: hear under the sea</li><li><b>LAMPS Helo</b>: extend your ears with sonobuoys</li><li><b>CEC</b>: share tracks with the fleet (blue)</li></ol>`},

const TIPS=[`Initial → Development → Production follows Milestones A → B → C. DCR is the odd one out: it changes DOTmLPF-P instead of buying anything.`,`JCIDS is the old system. JFRP is the new process. JCI and JFD are two of the JROC’s four activities inside it. JFDD is the broader development-and-design effort.`,`JOP is the JFRP’s problem statement; KOP is the NDS/JWC/memo term for the same idea. CRCs are what a concept needs. JCAs are the capability taxonomy.`,`Urgent = ongoing operations. Emergent = imminent operations. Both were replaced by the Immediate requirement (JICR). The CGA is the annual, non-urgent channel.`,`CPM is the whole approach. Its three reviews belong to three owners: CPMR (requirements, Joint Staff), IAPR (acquisition, A&S), TMTR (technology, R&E).`,`The JROC is the real council. The JRC (House, SPEED) and JRPB (Senate, FoRGED) were proposed replacements. The RRAB is the new money board.`,`DOT&E is an office (testing). DOTmLPF-P is a checklist. A Directive sets policy; an Instruction says how to carry it out.`,`C&D is Aegis’s Command and Decision. C2 is command and control in general. C2P and CDLMS run the data links.`,`Both Tomahawk systems end in WCS. Advanced came before Tactical. Plain WCS lives inside the AAW network.`,`Reviews on the left side of the V, in order: System Design → Preliminary Design → Critical Design. MEIT is a test level on the right.`];

const STOP=new Set(['of','and','the','for','in','to','a','an','on','at','by']);
const ALLA={};SETS.forEach(st=>st.list.forEach(r=>{const full=Array.isArray(r[1])?r[1]:[r[1]];ALLA[r[0]]={a:r[0],full,canon:full[0],def:r[2],hook:r[3]||'',alt:r[4]||[],set:st.id}}));
const words=s=>String(s).toLowerCase().replace(/&/g,' and ').replace(/[‘’']/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(' ').filter(Boolean);
const content=s=>words(s).filter(w=>!STOP.has(w));
const sing=w=>w.length>4&&w.endsWith('ies')?w.slice(0,-3)+'y':w.length>3&&w.endsWith('s')?w.slice(0,-1):w;
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const weq=(a,b)=>a===b||sing(a)===sing(b)||lev(a,b)<=(b.length>=8?2:b.length>=5?1:0);
function compare(input,variant){const T=content(variant),I=content(input);let j=0,hit=0,used=0;const marks=T.map(t=>{for(let k=j;k<I.length;k++){if(weq(I[k],t)){j=k+1;hit++;used++;return true}if(k+1<I.length&&weq(I[k]+I[k+1],t)){j=k+2;hit++;used+=2;return true}}return false});const extra=I.length-used;return{ok:hit===T.length&&extra<=1,score:T.length?hit/T.length:0,marks,extra}}
function gradeWrite(input,A){let best=null;A.full.forEach((v,i)=>{const r=compare(input,v);r.v=i;if(!best||r.ok&&!best.ok||(r.ok===best.ok&&r.score>best.score))best=r});return best}
const abbrNorm=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const gradeAbbr=(input,A)=>[A.a].concat(A.alt).some(x=>abbrNorm(x)===abbrNorm(input))&&abbrNorm(input).length>0;
function hl(full){return full.split(/(\s+)/).map(w=>{if(!w.trim())return w;const core=w.toLowerCase().replace(/[^a-z]/g,'');if(STOP.has(core))return `<span class="ast">${esc(w)}</span>`;const m=w.match(/^([^A-Za-z0-9]*)([A-Za-z0-9])([\s\S]*)$/);return m?esc(m[1])+'<b>'+esc(m[2])+'</b>'+esc(m[3]):esc(w)}).join('')}
function markedCanon(A,input,ok){if(ok)return `<span class="aw-ok">${esc(A.canon)}</span>`;const r=compare(input,A.canon);let ci=0;return A.canon.split(/(\s+)/).map(w=>{if(!w.trim())return w;const cs=content(w);if(!cs.length)return `<span class="ast">${esc(w)}</span>`;let good=true;cs.forEach(()=>{good=good&&!!r.marks[ci];ci++});return `<span class="${good?'aw-ok':'aw-miss'}">${esc(w)}</span>`}).join('')}

const sameStart=(w,r)=>r[0].toLowerCase()===w[0];
function mutate(full){const toks=full.split(' ');const keyOf=i=>toks[i].toLowerCase().replace(/[^a-z]/g,'');const idx=shuffle(toks.map((t,i)=>i)).find(i=>(MUT[keyOf(i)]||[]).some(r=>sameStart(keyOf(i),r)));if(idx==null)return null;const key=keyOf(idx);const reps=MUT[key].filter(r=>sameStart(key,r));const rep=reps[Math.floor(Math.random()*reps.length)];const out=toks.slice();out[idx]=toks[idx].replace(/[A-Za-z]+/,rep);return out.join(' ')}

function modeFor(s){if(s.mode&&s.mode!=='auto')return s.mode;const r=window.APP&&window.APP.S.srs[s._id];const lv=r?r.lv:0;if(lv>=4&&Math.random()<.25)return 'abbr';return lv>=3?'write':lv===2?'build':'mc'}
STEPS.acro={
  render(s,ctx){const A=ALLA[s.id];ctx.mode=ctx.mode||modeFor(s);const m=ctx.mode;
    if(m==='mc'){const st=setOf(s.id);const others=shuffle(st.list.map(r=>r[0]).filter(x=>x!==s.id)).map(x=>ALLA[x].canon);const mu=mutate(A.canon);let o=[A.canon];if(mu&&!A.full.some(f=>abbrNorm(f)===abbrNorm(mu)))o.push(mu);others.forEach(x=>{if(o.length<4&&!o.includes(x))o.push(x)});ctx.opts=shuffle(o.map((t,i)=>({t,i})));
      return `${KH('What does it stand for?')}<p class="q">What does <span class="abig">${esc(A.a)}</span> stand for?</p><div class="opts">${ctx.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>`}
    if(m==='rev'){const st=setOf(s.id);const o=[s.id].concat(shuffle(st.list.map(r=>r[0]).filter(x=>x!==s.id)).slice(0,3));ctx.opts=shuffle(o.map((t,i)=>({t,i})));
      return `${KH('Which acronym?')}<p class="q">Which acronym stands for <i>${esc(A.canon)}</i>?</p><div class="opts">${ctx.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="k">${'ABCD'[k]}</span><span class="mono" style="font-size:1rem">${esc(o.t)}</span></button>`).join('')}</div>`}
    if(m==='build'){const toks=A.canon.split(' ');if(!ctx.pool){const tset=new Set(toks.map(t=>t.toLowerCase().replace(/[^a-z0-9]/g,'')));const mut=[],oth=[];toks.forEach(t=>{const k=t.toLowerCase().replace(/[^a-z]/g,'');(MUT[k]||[]).forEach(r=>{if(!tset.has(r.toLowerCase())&&k&&sameStart(k,r))mut.push(r)})});const st=setOf(s.id);st.list.forEach(r=>{(Array.isArray(r[1])?r[1][0]:r[1]).split(' ').forEach(w=>{const n=w.toLowerCase().replace(/[^a-z0-9]/g,'');if(n&&!tset.has(n)&&!STOP.has(n))oth.push(w.replace(/[,]/g,''))})});const d=[...new Set(shuffle(mut).concat(shuffle(oth)))].slice(0,Math.min(4,Math.max(2,8-toks.length)));ctx.pool=shuffle(toks.map((t,i)=>({t,i,real:true})).concat(d.map(t=>({t,real:false}))));ctx.ans=[]}
      return `${KH('Build it')}<p class="q">Build the full name of <span class="abig">${esc(A.a)}</span></p><div class="aletters">${esc(A.a).split('').map(c=>/[A-Za-z0-9]/.test(c)?`<span>${c}</span>`:'').join('')}</div><div class="olist tray answer" id="bans" style="flex-direction:row;flex-wrap:wrap"></div><div class="tray" id="bpool" style="margin-top:10px"></div><p class="hint">Some tiles are decoys. Tap a placed word to send it back.</p>`}
    if(m==='write')return `${KH('Write it out')}<p class="q">Write out <span class="abig">${esc(A.a)}</span> in full.</p><input class="tin" id="aw" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Every word, like you would on the exam"><p class="hint">Small words like “of” and “and” don’t count against you. Spelling slips of a letter or two are forgiven.</p>`;
    if(m==='abbr')return `${KH('Name the acronym')}<p class="q">What’s the acronym for <i>${esc(A.canon)}</i>?</p><input class="tin" id="aw" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Acronym">`;
  },
  mount(s,ctx,el){const m=ctx.mode;
    if(m==='mc'||m==='rev'){$$('.opt',el).forEach(b=>b.onclick=()=>{if(ctx.locked)return;ctx.pick=+b.dataset.k;$$('.opt',el).forEach(x=>x.classList.toggle('sel',x===b));ctx.ready(true)});ctx.ready(false)}
    else if(m==='build'){const paint=()=>{$('#bans',el).innerHTML=ctx.ans.map(k=>`<button class="tok" data-k="${k}">${esc(ctx.pool[k].t)}</button>`).join('')||`<span class="muted small">Tap words below, in order.</span>`;$('#bpool',el).innerHTML=ctx.pool.map((p,k)=>ctx.ans.includes(k)?'':`<button class="tok" data-k="${k}">${esc(p.t)}</button>`).join('');
        $$('#bans .tok',el).forEach(t=>t.onclick=()=>{if(ctx.locked)return;ctx.ans=ctx.ans.filter(x=>x!==+t.dataset.k);paint()});$$('#bpool .tok',el).forEach(t=>t.onclick=()=>{if(ctx.locked)return;ctx.ans.push(+t.dataset.k);paint()});ctx.ready(ctx.ans.length>0)};paint()}
    else{const i=$('#aw',el);i.oninput=()=>ctx.ready(i.value.trim().length>0);i.onkeydown=e=>{if(e.key==='Enter'&&i.value.trim()){e.preventDefault();ctx.primary()}};ctx.ready(false);setTimeout(()=>{if(!('ontouchstart' in window))i.focus()},50)}},
  check(s,ctx,el){const A=ALLA[s.id];const m=ctx.mode;const info=`<span class="small"><b>${esc(A.a)}</b> = ${esc(A.canon)}. ${esc(A.def)}${A.hook?` <i>${esc(A.hook)}</i>`:''}</span>`;let ok,q,title,msg;
    if(m==='mc'||m==='rev'){const right=m==='mc'?ctx.opts.findIndex(o=>o.t===A.canon):ctx.opts.findIndex(o=>o.t===s.id);ok=ctx.pick===right;$$('.opt',el).forEach(b=>{const k=+b.dataset.k;b.disabled=true;if(k===right)b.classList.add('right');else if(k===ctx.pick)b.classList.add('wrong')});q=ok?2:0;msg=info}
    else if(m==='build'){const got=ctx.ans.map(k=>ctx.pool[k].t).join(' ');ok=words(got).join(' ')===words(A.canon).join(' ');$$('#bans .tok',el).forEach((t,n)=>{const p=ctx.pool[+t.dataset.k];t.classList.add(p.real&&p.i===n?'right':'wrong')});q=ok?2:0;msg=(ok?'':`<b>Correct:</b> ${hl(A.canon)}<br>`)+info}
    else if(m==='write'){const i=$('#aw',el);i.disabled=true;const r=gradeWrite(i.value,A);ok=r.ok;q=ok?2:r.score>=.6?1:0;title=ok?(r.score===1&&r.extra===0?'Exactly':'Correct'):r.score>=.6?'Almost':'Not quite';msg=`<b>Correct:</b> ${markedCanon(A,i.value,ok)}<br>`+(ok?'':`<span class="small">Red words are the ones you missed or misspelled.</span><br>`)+info;
      const R=window.APP.run();if(R&&R.mode==='lesson'){R.acroRes=R.acroRes||{};if(!(s.id in R.acroRes))R.acroRes[s.id]=ok}}
    else{const i=$('#aw',el);i.disabled=true;ok=gradeAbbr(i.value,A);q=ok?2:0;msg=(ok?'':`<b>Answer:</b> ${esc(A.a)}<br>`)+info}
    return{ok,q,title,msg}}
};

/* ---------- build set lessons ---------- */
const sets=SETS.map((st,si)=>{const ids=st.list.map(r=>r[0]);const steps=[];
  for(let i=0;i<ids.length;i+=4){const ch=ids.slice(i,i+4);steps.push({t:'acrointro',ids:ch,h:i===0?st.title:'A few more'});ch.forEach(id=>steps.push({t:'acro',id,mode:'build',nosrs:true}));if(ch.length>1&&ids.length<10)steps.push({t:'acro',id:shuffle(ch)[0],mode:'rev',nosrs:true})}
  shuffle(ids).forEach(id=>steps.push({t:'acro',id,mode:'write',nosrs:true}));
  const k='ka_'+st.id;
  return{id:st.id,title:st.title,sub:`${ids.length} acronyms · ${st.slides}`,mins:Math.max(4,Math.round(ids.length*0.6)),slides:st.slides,isAcro:true,steps,ids,
    review:ids.map(id=>({t:'acro',id,mode:'auto',k:k+' k_acro',q:`Write out ${id}`})),
    after(R){const S=window.APP.S;const res=R.acroRes||{};this.review.forEach(it=>{const r=S.srs[it._id];if(!r||r.n)return;const good=res[it.id];r.lv=good?2:1;if(!good){r.miss=1;r.streak=0;r.lastQ=0}r.due=Date.now()+(good?20:5)*60e3})}}});
const conf={id:'A15',title:'Easily confused',sub:`${CONFUSE.length} look-alike groups · all slides`,mins:7,slides:'All slides',isAcro:true,ids:[],steps:[],review:[]};
CONFUSE.forEach((g,gi)=>{conf.steps.push({t:'teach',kind:'Don’t mix these up',h:g.join(' · '),b:`<div class="stack">${g.map(id=>`<div class="acmp"><span class="mono"><b>${esc(id)}</b></span><span>${hl(ALLA[id].canon)}</span></div>`).join('')}</div><div class="prof" style="margin-top:12px"><b class="lab">How to tell them apart</b>${esc(TIPS[gi])}</div>`});
  conf.steps.push({t:'match',k:'ka_A15 k_acro',q:'Match each acronym to its full name.',pairs:g.map(id=>[id,ALLA[id].canon]),why:TIPS[gi]})});

/* exam-map keys */
if(window.COURSE&&window.COURSE.keys){sets.forEach(st=>window.COURSE.keys.push({id:'ka_'+st.id,group:'Acronyms · define and write out',slide:st.slides,text:`Acronyms: ${st.title}`}))}

/* ---------- view ---------- */
let TAB='sets',Q='';
function acroItems(){const I=window.APP.ITEMS;return Object.keys(I).filter(k=>I[k].t==='acro')}
function view(){const A=window.APP,S=A.S;const items=acroItems();const learned=items.filter(k=>S.srs[k]);const mastered=items.filter(k=>S.srs[k]&&S.srs[k].lv>=3);const due=learned.filter(k=>A.isMissed(S.srs[k]));const nxt=A.nextIn(sets,S.lastAcro);
  let body='';
  if(TAB==='sets')body=`<div class="lessons">${sets.map((st,i)=>{const d=S.lessons[st.id];const k=!d&&S.known&&S.known[st.id];const its=st.review.map(r=>r._id).filter(Boolean);const m=Math.round(100*A.mastery(its));return `<div class="lrow2"><button class="lrow ${d?'done':''} ${k?'known':''} ${nxt&&nxt.id===st.id?'next':''}" data-open="${st.id}"><span class="dot">${d||k?'✓':st.id==='A15'?'≈':i+1}</span><span class="lt"><b>${esc(st.title)}</b><span>${k?'<em class="kn">Marked known</em> · ':''}${esc(st.sub)}</span>${its.length&&d?`<div class="meterbar"><i style="width:${m}%"></i></div>`:''}</span><span class="go">${d?'Redo':'Start'}</span></button><label class="sw mini" title="I already know this"><input type="checkbox" data-know="${st.id}" ${S.known&&S.known[st.id]?'checked':''} aria-label="I already know ${esc(st.title)}"><i aria-hidden="true"></i><em>Know it</em></label></div>`}).join('')}</div>`;
  else body=`<input class="tin" id="acrosearch" placeholder="Search acronyms or words, e.g. RRAB or portfolio" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(Q)}"><div id="glist" style="margin-top:12px">${glossary()}</div>`;
  return `<span class="eyebrow">Define it · Build it · Write it out</span><h1 class="h-display" style="margin:6px 0 10px">Acronyms</h1><p class="muted">Every acronym in slides 1–39 and on the 7.2B chart: ${items.length} in all. Each set teaches them letter by letter, has you build the full name from word tiles, then write it out from memory. Cards get harder as you improve: pick it, then build it, then write it out cold. Misses go to Review; Test Prep covers all of them.</p>
  <div class="card duebox" style="margin-top:14px"><span class="n" style="color:var(--good)">${mastered.length}</span><span class="t"><b>of ${items.length} you can write out from memory</b><span>${learned.length} learned · ${due.length} missed</span></span></div>
  <div class="stack" style="margin-top:12px">${nxt?`<button class="btn primary block" data-open="${nxt.id}">${learned.length?'Next set':'Start'}: ${esc(nxt.title)}</button>`:''}${due.length?`<button class="btn block ${nxt?'':'primary'}" data-acro="due">Review ${Math.min(due.length,25)} missed acronym${due.length===1?'':'s'}</button>`:''}<button class="btn block" data-acro="test">Test prep: write out 20, no hints</button></div>
  <div class="seg" style="margin:20px 0 12px"><button class="${TAB==='sets'?'on':''}" data-acrotab="sets">Sets</button><button class="${TAB==='gloss'?'on':''}" data-acrotab="gloss">Glossary</button></div>${body}`}
function glossary(){const S=window.APP.S;const q=Q.trim().toLowerCase();const I=window.APP.ITEMS;const lvOf={};Object.keys(I).forEach(k=>{if(I[k].t==='acro'&&S.srs[k])lvOf[I[k].id]=S.srs[k].lv});
  return SETS.map(st=>{const rows=st.list.filter(r=>{if(!q)return true;const A=ALLA[r[0]];return A.a.toLowerCase().includes(q)||A.full.join(' ').toLowerCase().includes(q)||A.def.toLowerCase().includes(q)});if(!rows.length)return '';return `<div class="eyebrow" style="margin:16px 0 6px">${esc(st.title)}</div><div class="card">${rows.map(r=>{const A=ALLA[r[0]];const lv=lvOf[A.a];return `<div class="arow"><span class="mono ab">${esc(A.a)}</span><span class="ag"><span class="afull" style="font-size:.95rem">${hl(A.canon)}</span><small>${esc(A.def)}</small>${A.hook?`<small class="ah">${esc(A.hook)}</small>`:''}</span><span class="mdot ${lv==null?'':lv>=3?'g':lv>=2?'y':'r'}" title="${lv==null?'Not studied':lv>=3?'Can write it out':lv>=2?'Getting there':'Weak'}"></span></div>`}).join('')}</div>`}).join('')||`<p class="muted">No acronym matches “${esc(Q)}”.</p>`}
function mount(m){const s=$('#acrosearch',m);if(s){s.oninput=()=>{Q=s.value;$('#glist',m).innerHTML=glossary()}}}
function click(e){const b=e.target.closest('button');if(!b)return false;const A=window.APP,S=A.S;
  if(b.dataset.acrotab){TAB=b.dataset.acrotab;A.render();return true}
  if(b.dataset.acro==='due'){const ids=shuffle(acroItems().filter(k=>A.isMissed(S.srs[k]))).slice(0,25);A.startReview(ids,'Review: missed acronyms');return true}
  if(b.dataset.acro==='test'){const all=acroItems();const learned=all.filter(k=>S.srs[k]);const ids=A.prepPick(all,20,false);A.startRun({mode:'review',title:'Acronym write-out test',queue:ids.map(k=>Object.assign({},A.ITEMS[k],{mode:'write'})),doneTitle:'Write-out test done',summaryHTML:R=>{const r=R.results;const ks=Object.keys(r);const bad=ks.filter(k=>!r[k]);return `<div class="card" style="padding:14px;margin-top:16px;text-align:center"><span class="eyebrow">Written out correctly</span><div class="score" style="margin-top:4px">${ks.length-bad.length} / ${ks.length}</div></div>${bad.length?`<div class="card" style="padding:14px;margin-top:12px"><b>Study these</b><div class="stack" style="margin-top:8px;gap:6px">${bad.map(k=>{const X=ALLA[A.ITEMS[k].id];return `<div class="small"><span class="mono"><b>${esc(X.a)}</b></span> · ${esc(X.canon)}</div>`}).join('')}</div></div>`:''}`}});return true}
  return false}
window.ACRO={sets,view,mount,click,ALLA,hl,gradeWrite,nextSet:(S,after)=>window.APP.nextIn(sets,after===undefined?S.lastAcro:after)};
window.ACRO_STEPS=STEPS;
})();

</script>
<script>
/* ===================== Acronym coach: teach each acronym the first time a lesson uses it ===================== */
(function(){
'use strict';
if(!window.ACRO||!window.COURSE)return;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const A=window.ACRO.ALLA, hl=window.ACRO.hl;

/* Lesson numbers (5.3) and order, for "You'll learn more in lesson X.Y" */
const NUM={},ORD={},TITLE={};let ord=0;
window.COURSE.units.forEach((u,ui)=>u.lessons.forEach((l,li)=>{NUM[l.id]=(ui+1)+'.'+(li+1);ORD[l.id]=ord++;TITLE[l.id]=l.title}));

/* The lesson that covers each acronym in depth. Shown only when that lesson comes later. */
const DEEP={JFRP:'L44',JCIDS:'L41',PPBE:'L33',WAS:'L21',DAS:'L21',ICD:'L23',CDD:'L23',CPD:'L23',DCR:'L23','DOTmLPF-P':'L23',
 VCJCS:'L51','USD(C)':'L33',CAPE:'L33',NDAA:'L31',MPN:'L32','O&M,N':'L32','RDT&E,N':'L32',WPN:'L32',OPN:'L32',APN:'L32',SCN:'L32',
 POM:'L33',FYDP:'L33',PBR:'L33',NSS:'L22',NDS:'L22',NMS:'L22',UCP:'L22',OPLAN:'L22',CCDR:'L73',CCMD:'L73',IPL:'L73',JWC:'L61',NGB:'L51',
 EO:'L43',JRWG:'L43',COA:'L43',SASC:'L43',HASC:'L43',FoRGED:'L43',SPEED:'L43',JRPB:'L43',JRC:'L43',RAPID:'L43',
 RRAB:'L74',MEIA:'L74',JAR:'L74',CPM:'L74',CPMR:'L74',IAPR:'L74',TMTR:'L74',KOP:'L61',
 CJCSI:'L44',CJCSM:'L44',JROC:'L51',JROCM:'L44',JCB:'L51',FCB:'L51',DDRCD:'L44','J-8':'L61','J-7':'L61',OPR:'L61',DAU:'L44',
 JOP:'L61',JFD:'L62',JCI:'L71',CRC:'L62',IAMD:'L61',CGA:'L73',JUON:'L73',JEON:'L73',JICR:'L73',JRAC:'L73','DASW(AI2)':'L73',
 SE:'L12',SDR:'L12',PDR:'L12',CDR:'L12',MEIT:'L12','PEO IWS':'L12',
 BL:'L81',AWS:'L81',ACS:'L81',EXCOM:'L82',TACINTEL:'L82',DF:'L82',ESS:'L82',IFF:'L82',LAMPS:'L82',CEC:'L82',
 EW:'L83',GWS:'L83',VLS:'L83',VLA:'L83',ASROC:'L83','SM-2':'L83',ESSM:'L83',
 'C&D':'L84',ADS:'L84',ALIS:'L84',AAW:'L84',WCS:'L84',FCS:'L84',ORTS:'L84',
 LAN:'L85',UWS:'L85',ATWCS:'L85',TTWCS:'L85',BFTT:'L85',STOW:'L85',ACTS:'L85',C2P:'L85',JMCIS:'L85',CDLMS:'L85',SGS:'L85'};

/* Spotting acronyms in a card. Case-sensitive whole tokens; plurals and possessives count (JOPs, JROC’s).
   No lookbehind, so older iPhones can run it. */
const rxEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const forms=a=>[a.a].concat(a.alt.filter(x=>!/\s/.test(x)&&/[(&]/.test(x)));
const RX=Object.keys(A).map(k=>[k,new RegExp('(^|[^A-Za-z0-9&])(?:'+forms(A[k]).map(rxEsc).join('|')+')(?:s|’s)?'+(k==='FY'?'(?=\\d|[^A-Za-z0-9&]|$)':'(?=[^A-Za-z0-9&]|$)'))]);
const TEACH=new Set(['teach','story','key','memo','explore']);
const strip=h=>String(h||'').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ');
const textOf=s=>[s.h,s.b,s.big,s.prof].concat((s.spots||[]).flat()).map(strip).join(' \n ');
function acrsIn(s){
  if(s._acr)return s._acr;const t=textOf(s);const hits=[];
  RX.forEach(([k,rx])=>{const m=rx.exec(t);if(m)hits.push([m.index+m[1].length,k])});
  hits.sort((a,b)=>a[0]-b[0]);return (s._acr=hits.map(h=>h[1]));
}
let LESSON_ACRS=null;
function lessonAcrs(){if(!LESSON_ACRS){const set=new Set();window.APP.LESSONS.forEach(l=>l.steps.forEach(s=>{if(TEACH.has(s.t))acrsIn(s).forEach(k=>set.add(k))}));LESSON_ACRS=set}return LESSON_ACRS}

/* State lives in progress (S.coach) so it syncs and backs up with everything else.
   a[ACR] = {t: trained, n: how many lesson cards it has appeared on} */
const st=()=>{const S=window.APP.S;if(!S.coach||typeof S.coach!=='object')S.coach={on:true,a:{}};if(!S.coach.a)S.coach.a={};return S.coach};
const isOn=()=>st().on!==false;
let TAB=null;/* acronyms already learned in the Acronyms tab count as trained */
function tabLearned(k){
  if(!TAB){TAB={};const I=window.APP.ITEMS;for(const id in I){const s=I[id];if(s.t==='acro')(TAB[s.id]=TAB[s.id]||[]).push(id)}}
  const S=window.APP.S;return (TAB[k]||[]).some(id=>S.srs[id]);
}
const trained=k=>{const r=st().a[k];return !!(r&&r.t)||tabLearned(k)};
const REVIEW_AT=[2,3,5];/* appearance 1 = training; review on the next two appearances and the fifth */

/* Called when a lesson card is finished. Returns the cards to slot in right after it. */
function after(s,R){
  if(!isOn()||!R||R.mode!=='lesson'||!R.lesson||R.lesson.isAcro||!TEACH.has(s.t)||s._again)return [];
  const ks=acrsIn(s);if(!ks.length)return [];
  const c=st();const nw=[],due=[];
  ks.forEach(k=>{if(!trained(k)){nw.push(k);return}const r=c.a[k]||(c.a[k]={t:1,n:0});r.t=1;r.n=(r.n||0)+1;if(REVIEW_AT.includes(r.n))due.push(k)});
  window.APP.save();
  if(!nw.length&&!due.length)return [];
  const out=nw.map((k,i)=>({t:'coachlearn',k,i:i+1,of:nw.length,lid:R.lesson.id}));
  out.push({t:'coachreview',nw:nw.slice(),due:due.slice()});
  if(nw.length)out.push(Object.assign({},s,{_again:true,_hl:nw.slice()}));
  return out;
}

/* Back on the original card: say so, and highlight the acronyms just learned. */
function highlight(root,rx){
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('svg,.fig,.againnote,button.spot,mark')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{const t=n.nodeValue;rx.lastIndex=0;if(!rx.test(t))return;rx.lastIndex=0;
    const frag=document.createDocumentFragment();let last=0,m;

  return `<section class="card hero"><span class="eyebrow">PC 4022 · Exam III · Slides 1–39</span><h1 class="h-display">Learn it, then lock it in.</h1><p>Short lessons teach each idea from the ground up and build to the exact points on the slides. Every lesson drops cards into a spaced-review deck so the facts are still there on exam day.</p>
  <div class="row">${nxt?`<button class="btn primary" data-open="${nxt.id}">${doneN?'Continue':'Start'}: ${esc(nxt.title)}</button>`:`<span class="chip"><i class="sq green"></i>Every lesson is done or marked known</span>`}<span class="chip">${doneN}/${LESSONS.length} done${knownN?` · ${knownN} known`:''}</span></div></section>
  ${due?`<button class="card duebox" style="width:100%;text-align:left;margin-top:12px" data-go="review"><span class="n" style="color:var(--red)">${due}</span><span class="t"><b>Missed card${due===1?'':'s'} to review</b><span>Get each one right twice in a row and it leaves the pile. Test Prep covers everything else.</span></span><span class="go eyebrow" style="color:var(--primary)">Review</span></button>`:''}
  ${window.ACRO?(()=>{const ai=Object.keys(ITEMS).filter(k=>ITEMS[k].t==='acro');const mm=ai.filter(k=>S.srs[k]&&S.srs[k].lv>=3).length;return `<button class="card duebox" style="width:100%;text-align:left;margin-top:12px" data-go="acro"><span class="n" style="color:var(--good)">${mm}</span><span class="t"><b>of ${ai.length} acronyms you can write out</b><span>Taught letter by letter, then written from memory.</span></span><span class="go eyebrow" style="color:var(--primary)">Open</span></button>`})():''}
  ${window.COACH?window.COACH.homeRow():''}
  ${C.units.map((u,ui)=>`<section class="unit"><div class="unit-head"><span class="unit-num">${String(ui+1).padStart(2,'0')}</span><div><h3>${esc(u.title)}</h3><p>${esc(u.sub)}</p></div></div><div class="lessons">${u.lessons.map((l,li)=>lessonRow(l,(ui+1)+'.'+(li+1),nxt)).join('')}</div></section>`).join('')}
  <p class="hint" style="margin-top:22px">Lessons follow the order of the exam slides, but every one is open. Your progress is saved on this device${remote.ref?' and synced to your account':''}.</p>`;
}
function lessonRow(l,num,nxt){const d=S.lessons[l.id];const k=!d&&S.known&&S.known[l.id];const isNext=nxt&&nxt.id===l.id;return `<div class="lrow2"><button class="lrow ${d?'done':''} ${k?'known':''} ${isNext?'next':''}" data-open="${l.id}"><span class="dot">${d||k?'✓':num}</span><span class="lt"><b>${esc(l.title)}</b><span>${k?'<em class="kn">Marked known</em> · ':''}${esc(l.sub)} · ${l.mins||6} min${l.slides?' · '+esc(l.slides):''}</span></span><span class="go">${d?'Redo':isNext?'Start':'Open'}</span></button><label class="sw mini" title="I already know this"><input type="checkbox" data-know="${l.id}" ${S.known&&S.known[l.id]?'checked':''} aria-label="I already know ${esc(l.title)}"><i aria-hidden="true"></i><em>Know it</em></label></div>`}
window.APP_lessonRow=lessonRow;
function unitItems(ui){return C.units[ui].lessons.flatMap(l=>S.lessons[l.id]?l._items:[])}
function unitAll(ui){return C.units[ui].lessons.flatMap(l=>l._items)}
function acroAll(){return Object.keys(ITEMS).filter(id=>ITEMS[id].t==='acro'||ITEMS[id]._lesson==='A15')}
function viewReview(){
  const missed=missedIds();const all=Object.keys(ITEMS);const P=prepState();const covered=all.filter(id=>P.seen[id]).length;const left=all.length-covered;
  const row=(key,dot,title,ids)=>{const m=Math.round(100*mastery(ids));const mi=ids.filter(id=>isMissed(S.srs[id])).length;return `<button class="lrow" data-prepunit="${key}"><span class="dot">${dot}</span><span class="lt"><b>${esc(title)}</b><span>${ids.length} cards · ${m}% mastered${mi?` · <em class="kn" style="color:var(--bad)">${mi} missed</em>`:''}</span><div class="meterbar"><i style="width:${m}%"></i></div></span><span class="go">Go</span></button>`};
  return `<span class="eyebrow">Two ways to review</span><h1 class="h-display" style="margin:6px 0 14px">Review</h1>
  <section class="card rvcard"><div class="rvhead"><i class="sq red"></i><span class="eyebrow" style="color:var(--ink)">Review · missed cards</span></div>
    <div class="duebox" style="padding:6px 0 0"><span class="n" style="color:${missed.length?'var(--red)':'var(--good)'}">${missed.length}</span><span class="t"><b>${missed.length?`card${missed.length===1?'':'s'} you’ve missed`:'Nothing missed right now'}</b><span>Anything you get wrong in a lesson, Test Prep or a practice exam lands here. Get a card right twice in a row and it leaves the pile.</span></span></div>
    ${missed.length?`<button class="btn primary block" data-review="missed" style="margin-top:12px">Review ${Math.min(missed.length,20)} missed card${missed.length===1?'':'s'}</button>`:''}
  </section>
  <section class="card rvcard" style="margin-top:12px"><div class="rvhead"><i class="sq navy"></i><span class="eyebrow" style="color:var(--ink)">Test prep · everything</span></div>
    <div class="duebox" style="padding:6px 0 0"><span class="n">${covered}</span><span class="t"><b>of ${all.length} cards covered${P.pass>1?` in pass ${P.pass}`:''}</b><span>Every card in the course: all lessons (even ones you haven’t opened or marked known), the 7.2B chart, and every acronym. Rounds of 25, weakest first.</span></span></div>
    <div class="meterbar" style="margin-top:10px;height:8px"><i style="width:${Math.round(100*covered/all.length)}%"></i></div>
    <div class="stack" style="margin-top:12px">${left?`<button class="btn primary block" data-review="prep">${covered?'Continue':'Start'} test prep · next ${Math.min(25,left)}</button>`:`<p class="small"><b>Pass ${P.pass} complete.</b> You’ve seen every card in the course.</p><button class="btn primary block" data-review="newpass">Start pass ${P.pass+1}</button>`}${covered&&left?`<button class="btn block" data-review="newpass">Restart from a fresh pass</button>`:''}</div>
  </section>
  <div class="divider"></div><h2 class="h2">Test prep by unit</h2><p class="muted small" style="margin:4px 0 12px">Every card in one unit, weakest first, whether or not you’ve studied it yet.</p>
  <div class="lessons">${C.units.map((u,ui)=>row(String(ui),String(ui+1).padStart(2,'0'),u.title,unitAll(ui))).join('')}${row('acro','Aa','Acronyms',acroAll())}</div>`;
}
function fmtWhen(ms){if(ms<HOUR)return `in ${Math.max(1,Math.round(ms/MIN))} min`;if(ms<DAY)return `in ${Math.round(ms/HOUR)} h`;return `in ${Math.round(ms/DAY)} day${Math.round(ms/DAY)===1?'':'s'}`}
function keyItems(k){return Object.keys(ITEMS).filter(id=>(ITEMS[id].k||'').split(' ').includes(k.id))}
function viewExam(){
  const tab=SUB.exam;
  const tabs=`<div class="seg" style="margin:12px 0 16px">${[['map','Exam map'],['practice','Practice exam'],['settings','Progress']].map(([k,t])=>`<button class="${tab===k?'on':''}" data-sub="exam:${k}">${t}</button>`).join('')}</div>`;
  let body='';
  if(tab==='map'){
    const groups={};C.keys.forEach(k=>{(groups[k.group]=groups[k.group]||[]).push(k)});
    body=`<p class="muted">Every item your professor flagged as testable, in slide order. The bar fills as you prove you know it in review. Tap a row to drill just that item.</p>${Object.keys(groups).map(g=>`<h3 class="h2" style="margin:20px 0 8px;font-size:1.15rem">${esc(g)}</h3><div class="card">${groups[g].map(k=>{const ids=keyItems(k);const seen=ids.filter(id=>S.srs[id]);const m=Math.round(100*mastery(ids));return `<button class="krow" style="width:100%;text-align:left" data-key="${k.id}"><span class="meter"><span class="pct">${seen.length?m+'%':'—'}</span><div class="meterbar"><i style="width:${m}%"></i></div></span><span class="kt">${k.text}<small>${esc(k.slide)}${seen.length?'':' · not studied yet'}</small></span></button>`}).join('')}</div>`).join('')}`;
  }else if(tab==='practice'){
    body=`<p class="muted">Twenty questions drawn from the whole course, including three written answers scored against the professor's key points. Misses go to your Review pile.</p>
    <div class="stack" style="margin-top:14px"><button class="btn primary block" data-practice="20">Start a 20-question practice exam</button><button class="btn block" data-practice="explain">Written answers only</button><button class="btn block" data-go="lab">Draw the 7.2B from memory</button></div>`;
  }else{
    const total=Object.keys(ITEMS).length;const seen=Object.keys(S.srs).filter(id=>ITEMS[id]).length;
    body=`<div class="card" style="padding:16px"><div class="row" style="justify-content:space-between"><b>Lessons completed</b><span class="mono">${LESSONS.filter(l=>S.lessons[l.id]).length}/${LESSONS.length}</span></div><div class="row" style="justify-content:space-between;margin-top:8px"><b>Marked “I already know this”</b><span class="mono">${Object.keys(S.known||{}).length}</span></div><div class="row" style="justify-content:space-between;margin-top:8px"><b>Cards in your deck</b><span class="mono">${seen}/${total}</span></div><div class="row" style="justify-content:space-between;margin-top:8px"><b>Overall mastery</b><span class="mono">${Math.round(100*mastery(Object.keys(ITEMS)))}%</span></div><div class="row" style="justify-content:space-between;margin-top:8px"><b>Saved</b><span class="mono">${remote.ref?'This device + your account':'This device'}</span></div></div>
    <h3 class="h2" style="margin:22px 0 6px;font-size:1.15rem">Back up your progress</h3><p class="muted small">Progress is saved in this browser${remote.ref?' and your account':''}. To keep a copy you control, save a progress code in your Notes app. Paste it back here on any device or browser to restore everything.</p>
    <div class="stack" style="margin-top:10px"><button class="btn primary block" data-act="copycode">Copy my progress code</button><div id="codeout"></div><textarea class="tin" id="restorecode" style="min-height:90px" placeholder="Paste a progress code here to restore it"></textarea><button class="btn block" data-act="restore">Restore from this code</button><div id="restorezone"></div></div>
    <div class="stack" style="margin-top:14px"><button class="btn block" data-act="theme">Theme: ${document.documentElement.dataset.theme||'system'}</button><button class="btn block" data-act="reset">Reset all progress</button></div><div id="resetzone"></div>`;
  }
  return `<span class="eyebrow">Exam III readiness</span><h1 class="h-display" style="margin:6px 0 0">Exam</h1>${tabs}${body}`;
}
function bindMain(m){
  m.onchange=e=>{const t=e.target;if(t&&t.dataset&&t.dataset.coach&&window.COACH){window.COACH.setOn(t.checked);toast(t.checked?'Acronym coach on. New acronyms get taught as they appear.':'Acronym coach off. Lessons won\u2019t stop for acronyms.');render();return}if(t&&t.dataset&&t.dataset.know){setKnown(t.dataset.know,t.checked);toast(t.checked?'Marked known. It won\u2019t be suggested next.':'No longer marked as known.');render()}};
  m.onclick=e=>{if(VIEW==='lab'&&window.CHARTLAB&&window.CHARTLAB.click(e))return;if(VIEW==='acro'&&window.ACRO&&window.ACRO.click(e))return;const b=e.target.closest('button');if(!b)return;
    if(b.dataset.open){openLesson(b.dataset.open);return}
    if(b.dataset.go){VIEW=b.dataset.go;render();window.scrollTo(0,0);return}
    if(b.dataset.sub){const [v,t]=b.dataset.sub.split(':');SUB[v]=t;render();return}
    const markSeen=s2=>{prepState().seen[s2._id]=1};
    if(b.dataset.review==='missed'){startReview(interleave(missedIds()).slice(0,20),'Review: missed cards',{doneTitle:'Review done',summaryHTML:R=>{const ids=Object.keys(R.results);const still=ids.filter(id=>isMissed(S.srs[id])).length;return `<div class="card" style="padding:14px;margin-top:16px;text-align:center"><span class="eyebrow">Missed pile</span><div class="score" style="margin-top:4px">${missedIds().length} left</div><p class="hint">${ids.length-still} card${ids.length-still===1?'':'s'} cleared this session.</p></div>`}});return}
    if(b.dataset.review==='prep'){startReview(prepPick(Object.keys(ITEMS),25,true),'Test prep',{onAnswer:markSeen,doneTitle:'Test prep round done',summaryHTML:R=>summaryList(R)});return}
    if(b.dataset.review==='newpass'){const P=prepState();S.prep={pass:P.pass+1,seen:{}};save();toast('Fresh pass started');render();return}
    if(b.dataset.prepunit){const k=b.dataset.prepunit;const pool=k==='acro'?acroAll():unitAll(+k);startReview(prepPick(pool,25,false),'Test prep: '+(k==='acro'?'Acronyms':C.units[+k].title),{onAnswer:markSeen,doneTitle:'Test prep round done',summaryHTML:R=>summaryList(R)});return}
    if(b.dataset.key){const k=C.keys.find(x=>x.id===b.dataset.key);let ids=keyItems(k);const studied=ids.filter(id=>S.srs[id]);if(!studied.length){const l=LESSONS.find(L=>L._items.some(id=>ids.includes(id)));if(l){toast('Teaching this first: '+l.title);openLesson(l.id)}return}startReview(shuffle(studied),k.text.replace(/<[^>]+>/g,''));return}
    if(b.dataset.practice){const pool=Object.keys(ITEMS).filter(id=>ITEMS[id].t!=='acro');let ids;if(b.dataset.practice==='explain')ids=shuffle(pool.filter(id=>ITEMS[id].t==='explain')).slice(0,5);else{const ex=shuffle(pool.filter(id=>ITEMS[id].t==='explain')).slice(0,3);const rest=shuffle(pool.filter(id=>ITEMS[id].t!=='explain'&&ITEMS[id].t!=='recall')).slice(0,20-ex.length);ids=shuffle(rest).concat(ex)}startReview(ids,'Practice exam',{doneTitle:'Practice exam done',summaryHTML:R=>summaryList(R)});return}
    if(b.dataset.act==='theme'){const order=['system','light','dark'];const cur=document.documentElement.dataset.theme||'system';const nx=order[(order.indexOf(cur)+1)%3];if(nx==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=nx;try{localStorage.setItem('aegis-theme',nx)}catch(e){}render();return}
    if(b.dataset.act==='reset'){$('#resetzone').innerHTML=`<div class="card" style="padding:14px;margin-top:10px"><p class="small">This erases every lesson, card, and chart score on this device${remote.ref?' and in your account':''}. It can't be undone.</p><div class="row" style="margin-top:10px"><button class="btn" data-act="noreset" style="flex:1">Cancel</button><button class="btn bad" data-act="yesreset" style="flex:1">Erase progress</button></div></div>`;return}
    if(b.dataset.act==='noreset'){$('#resetzone').innerHTML='';return}
    if(b.dataset.act==='yesreset'){S=blank();save();toast('Progress erased');render();return}
    if(b.dataset.act==='copycode'){const code=makeCode();const show=()=>{$('#codeout').innerHTML=`<textarea class="tin" id="codebox" readonly style="min-height:90px;font-family:var(--f-mono);font-size:.75rem"></textarea><p class="hint">Select all of it and copy it into your Notes app.</p>`;const t=$('#codebox');t.value=code;t.focus();t.select()};try{navigator.clipboard.writeText(code).then(()=>{toast('Progress code copied. Paste it into your Notes app.');$('#codeout').innerHTML=`<p class="hint">Copied ${Math.round(code.length/1024)} KB of text. Paste it somewhere safe, like a note titled “Aegis Academy progress”.</p>`},show)}catch(e){show()}return}
    if(b.dataset.act==='restore'){const raw=($('#restorecode').value||'').trim();const obj=readCode(raw);if(!obj){$('#restorezone').innerHTML=`<p class="small" style="color:var(--bad)">That doesn’t look like a complete progress code. Copy the whole thing, starting with AEGIS1:</p>`;return}
      $('#restorezone').innerHTML=`<div class="card" style="padding:14px"><p class="small">This replaces your current progress with the saved code: ${Object.keys(obj.lessons||{}).length} lessons done, ${Object.keys(obj.srs||{}).length} cards studied.</p><div class="row" style="margin-top:10px"><button class="btn" data-act="norestore" style="flex:1">Cancel</button><button class="btn primary" data-act="yesrestore" style="flex:1">Restore</button></div></div>`;RESTORE=obj;return}
    if(b.dataset.act==='norestore'){$('#restorezone').innerHTML='';RESTORE=null;return}
    if(b.dataset.act==='yesrestore'&&RESTORE){S=Object.assign(blank(),RESTORE);RESTORE=null;save();toast('Progress restored');render();return}
  };
}
let RESTORE=null;
function makeCode(){const o=JSON.parse(JSON.stringify(S));return 'AEGIS1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function readCode(raw){try{const m=raw.replace(/\s+/g,'').match(/AEGIS1:([A-Za-z0-9+/=]+)/);if(!m)return null;const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o||typeof o!=='object'||!o.srs||!o.lessons)return null;return o}catch(e){return null}}
function interleave(ids){const by={};ids.forEach(id=>{const l=ITEMS[id]._lesson;(by[l]=by[l]||[]).push(id)});const ks=shuffle(Object.keys(by));const out=[];let more=true;while(more){more=false;ks.forEach(k=>{if(by[k].length){out.push(by[k].shift());more=true}})}return out}
function summaryList(R){const ids=Object.keys(R.results);const bad=ids.filter(id=>!R.results[id]);return `<div class="card" style="padding:14px;margin-top:16px;text-align:center"><span class="eyebrow">First-try score</span><div class="score" style="margin-top:4px">${ids.length-bad.length} / ${ids.length}</div></div>`+(bad.length?`<div class="card" style="padding:14px;margin-top:16px"><b>Missed this time</b><ul class="small" style="margin:8px 0 0;padding-left:18px">${bad.map(id=>`<li>${(ITEMS[id].q||ITEMS[id].h||'').replace(/<[^>]+>/g,'').slice(0,140)}</li>`).join('')}</ul><p class="hint">These are now in your Review pile.</p></div>`:'')}

/* ---------------- boot ---------------- */
try{const t=localStorage.getItem('aegis-theme');if(t&&t!=='system')document.documentElement.dataset.theme=t}catch(e){}
render();
initRemote();
window.addEventListener('focus',()=>{if(!RUN)render()});
})();

</script>

</body></html>
