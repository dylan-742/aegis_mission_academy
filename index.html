<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Aegis Exam III Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#17396A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a watch-station card deck. One placard at a time, a fixed action rail at the
   bottom, and the 7.2B chart's own legend trio (red / yellow / blue) as the app's signal flags. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --surface2:#F6F8FA; --ink:#0F1C2B; --muted:#566476; --line:#D3DBE3;
  --primary:#17396A; --on-primary:#FFFFFF; --primary-soft:#E2EAF5;
  --red:#C8323C; --red-soft:#FBE7E8; --yellow:#E9B820; --yellow-soft:#FFF4CF; --blue:#5FAEDB; --blue-soft:#E3F2FB;
  --good:#1B7F52; --good-soft:#E0F3EA; --bad:#B3261E; --bad-soft:#FBE6E4;
  --chart-paper:#FFF7D6; --chart-ink:#2A2A2A; --chart-red:#D3343C; --chart-yellow:#F6E53A; --chart-blue:#8FCBEA; --chart-line:#333;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:10px;
  --shadow:0 1px 2px rgba(15,28,43,.06),0 6px 18px rgba(15,28,43,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121C; --surface:#121E2D; --surface2:#172638; --ink:#E5ECF4; --muted:#93A3B6; --line:#263951;
  --primary:#7FB0F2; --on-primary:#071321; --primary-soft:#18304F;
  --red:#EE6069; --red-soft:#3A1A1F; --yellow:#F2C94C; --yellow-soft:#3A3115; --blue:#7CC6EE; --blue-soft:#14324A;
  --good:#4CC78C; --good-soft:#123527; --bad:#F2766D; --bad-soft:#3B1A18;
  --chart-paper:#1A2534; --chart-ink:#E8EDF3; --chart-red:#C9424A; --chart-yellow:#C9B430; --chart-blue:#4E93BD; --chart-line:#A9B6C6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121C; --surface:#121E2D; --surface2:#172638; --ink:#E5ECF4; --muted:#93A3B6; --line:#263951;
  --primary:#7FB0F2; --on-primary:#071321; --primary-soft:#18304F;
  --red:#EE6069; --red-soft:#3A1A1F; --yellow:#F2C94C; --yellow-soft:#3A3115; --blue:#7CC6EE; --blue-soft:#14324A;
  --good:#4CC78C; --good-soft:#123527; --bad:#F2766D; --bad-soft:#3B1A18;
  --chart-paper:#1A2534; --chart-ink:#E8EDF3; --chart-red:#C9424A; --chart-yellow:#C9B430; --chart-blue:#4E93BD; --chart-line:#A9B6C6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
b,strong{font-weight:700}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.flagmark{display:grid;grid-template-columns:repeat(3,9px);gap:2px;flex:none}
.flagmark i{display:block;height:22px;border-radius:2px}
.flagmark i:nth-child(1){background:var(--red)}.flagmark i:nth-child(2){background:var(--yellow)}.flagmark i:nth-child(3){background:var(--blue)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.18rem;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.02em;line-height:1.2;margin-top:2px}
.stats{display:flex;gap:8px;flex:none}
.stat{font-family:var(--f-mono);font-size:.78rem;padding:5px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;color:var(--muted);margin-right:4px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding-block:6px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:.72rem;font-weight:600;letter-spacing:.02em;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--primary);background:var(--primary-soft)}
.nav .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;font-size:.66rem;font-family:var(--f-mono);border-radius:99px;padding:0 5px;min-width:18px;line-height:16px}

main.view{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}

/* ---------- generic ---------- */
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;color:var(--muted)}
.h-display{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,7vw,2.5rem);line-height:1.02;letter-spacing:.005em;text-transform:uppercase}
.h2{font-family:var(--f-display);font-weight:700;font-size:1.45rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:700;font-size:.98rem;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}
.sq{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.sq.red{background:var(--red)}.sq.yellow{background:var(--yellow)}.sq.blue{background:var(--blue)}.sq.navy{background:var(--primary)}.sq.green{background:var(--good)}

/* ---------- home ---------- */
.hero{padding:20px;display:flex;flex-direction:column;gap:14px}
.hero p{color:var(--muted);font-size:.98rem}
.duebox{display:flex;align-items:center;gap:14px;padding:16px}
.duebox .n{font-family:var(--f-display);font-weight:700;font-size:2.4rem;line-height:1;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.duebox .t{flex:1;min-width:0}
.duebox .t b{display:block}
.duebox .t span{color:var(--muted);font-size:.86rem}
.unit{margin-top:22px}
.unit-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.unit-num{font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.06em;background:var(--ink);color:var(--surface);border-radius:6px;padding:3px 8px;flex:none;margin-top:2px}
.unit-head h3{font-family:var(--f-display);font-weight:700;font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.unit-head p{font-size:.86rem;color:var(--muted);margin-top:3px}
.lessons{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.lrow:hover{border-color:var(--primary)}
.lrow .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;border:2px solid var(--line);color:var(--muted);background:var(--surface2)}
.lrow.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.lrow.next .dot{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.lrow .lt{flex:1;min-width:0}
.lrow .lt b{display:block;font-size:.98rem;line-height:1.3}
.lrow .lt span{font-size:.8rem;color:var(--muted)}
.lrow .go{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:.85rem;letter-spacing:.06em;color:var(--primary);flex:none}
.lrow.next{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

/* ---------- runner ---------- */
.runner{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rtop{background:var(--bg)}
.rtop .wrap{display:flex;align-items:center;gap:12px;min-height:54px}
.xbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.xbtn:hover{background:var(--surface2)}
.pbar{flex:1;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s ease}
.rcount{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.rbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.rbody .wrap{padding-block:8px 28px}
.rfoot{border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .2s}
.rfoot .wrap{padding-block:12px}
.rfoot.ok{background:var(--good-soft);border-top-color:var(--good)}
.rfoot.no{background:var(--bad-soft);border-top-color:var(--bad)}
.fb{display:none;margin-bottom:12px}
.rfoot.ok .fb,.rfoot.no .fb,.rfoot.info .fb{display:block}
.fb h4{margin:0 0 4px;font-family:var(--f-display);font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.rfoot.ok .fb h4{color:var(--good)}.rfoot.no .fb h4{color:var(--bad)}
.fb p{font-size:.93rem;line-height:1.5;max-height:34vh;overflow-y:auto}

.stepkind{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.stepkind span{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.slideref{margin-left:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}
.sh{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,6.4vw,2rem);line-height:1.08;text-transform:uppercase;letter-spacing:.005em;margin-bottom:12px}
.sb{font-size:1.02rem;line-height:1.62}
.sb p+p{margin-top:12px}
.sb ul,.sb ol{margin:10px 0 0;padding-left:20px}
.sb li+li{margin-top:6px}
.sb .term{font-weight:700;background:linear-gradient(transparent 62%,var(--yellow-soft) 62%)}
.q{font-size:1.12rem;font-weight:650;line-height:1.45;margin-bottom:14px}
.fig{margin:16px 0;overflow-x:auto}
.fig svg{display:block;width:100%;height:auto;max-width:100%}

.keycard{border:2px solid var(--red);border-radius:var(--r);background:var(--surface);overflow:hidden}
.keycard .kh{background:var(--red);color:#fff;padding:8px 14px;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.88rem;display:flex;gap:8px;align-items:center}
.keycard .kb{padding:14px}
.prof{margin-top:14px;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.93rem}
.prof b.lab{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;color:var(--muted);margin-bottom:4px}
.memo{border-radius:var(--r);background:var(--blue-soft);border:1px solid var(--blue);padding:16px}
.memo .big{font-family:var(--f-display);font-weight:700;font-size:1.5rem;line-height:1.15;text-transform:uppercase;margin:4px 0 10px;letter-spacing:.02em}
.story{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:16px;box-shadow:var(--shadow)}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-size:.98rem;line-height:1.4;box-shadow:0 2px 0 var(--line)}
.opt .k{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-radius:6px;min-width:24px;height:24px;display:grid;place-items:center;color:var(--muted);flex:none;margin-top:1px}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 2px 0 var(--primary)}
.opt.right{border-color:var(--good);background:var(--good-soft);box-shadow:0 2px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 2px 0 var(--bad)}
.opt:disabled{cursor:default}

/* chips: order / fill / match */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:12px;border:2px dashed var(--line);background:var(--surface2);align-content:flex-start}
.tray.answer{background:var(--surface);border-style:solid}
.tok{padding:9px 12px;border-radius:10px;background:var(--surface);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);font-weight:600;font-size:.93rem;line-height:1.25;text-align:left}
.tok.used{visibility:hidden}
.tok.right{border-color:var(--good);background:var(--good-soft)}
.tok.wrong{border-color:var(--bad);background:var(--bad-soft)}
.olist{display:flex;flex-direction:column;gap:8px}
.olist .tok{display:flex;gap:10px;align-items:center;width:100%}
.olist .tok .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);min-width:18px}
.fillsent{font-size:1.06rem;line-height:2.2}
.blank{display:inline-block;min-width:84px;border-bottom:2px solid var(--muted);padding:0 6px;margin:0 2px;text-align:center;font-weight:700;line-height:1.5;border-radius:4px 4px 0 0}
.blank.filled{background:var(--primary-soft);border-bottom-color:var(--primary);cursor:pointer}
.blank.right{background:var(--good-soft);border-bottom-color:var(--good)}
.blank.wrong{background:var(--bad-soft);border-bottom-color:var(--bad)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .tok{width:100%;min-height:52px}
.match .tok.sel{border-color:var(--primary);background:var(--primary-soft)}
.match .tok.done{border-color:var(--good);background:var(--good-soft);color:var(--good);opacity:.75}
.match .tok.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* sort */
.sortcard{padding:18px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.02rem;font-weight:600;min-height:86px;display:flex;align-items:center}
.sortcard.right{border-color:var(--good);background:var(--good-soft)}
.sortcard.wrong{border-color:var(--bad);background:var(--bad-soft)}
.bins{display:grid;gap:8px;margin-top:12px}
.bins.n2{grid-template-columns:1fr 1fr}.bins.n3{grid-template-columns:1fr 1fr 1fr}.bins.n4{grid-template-columns:1fr 1fr}
.bin{padding:12px 8px;border-radius:12px;border:2px solid var(--primary);color:var(--primary);background:var(--surface);font-weight:700;font-size:.9rem;line-height:1.2;min-height:52px}
.sortlog{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.sortlog div{font-size:.84rem;display:flex;gap:8px;align-items:flex-start}
.sortlog .mk{font-family:var(--f-mono);font-weight:700;flex:none}
.sortlog .ok .mk{color:var(--good)}.sortlog .no .mk{color:var(--bad)}

/* explore */
.spots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.spot{padding:9px 13px;border-radius:99px;border:2px solid var(--primary);color:var(--primary);background:var(--surface);font-weight:700;font-size:.9rem}
.spot.seen{background:var(--primary);color:var(--on-primary)}
.spotcard{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);min-height:70px}
.spotcard b{display:block;margin-bottom:4px}

/* type + explain */
.tin{width:100%;font-size:1.08rem;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface)}
.tin:focus{border-color:var(--primary);outline:none}
textarea.tin{min-height:150px;resize:vertical;line-height:1.5}
.rubric{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rub{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.92rem;text-align:left;width:100%}
.rub .bx{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:.8rem;margin-top:1px}
.rub.on .bx{background:var(--good);border-color:var(--good);color:#fff}
.rub.hit{border-color:var(--good);background:var(--good-soft)}
.rub.miss{border-color:var(--bad);background:var(--bad-soft)}
.model{margin-top:12px;padding:14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:.93rem}
.grading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.93rem;margin-top:12px}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.score{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1}

/* recall */
.flash{padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.flash .ans{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);font-size:1rem;line-height:1.55}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* lesson done */
.done-hero{text-align:center;padding:30px 10px 10px}
.done-hero .h-display{margin:10px 0}
.donestats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.donestats div{text-align:center;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.donestats b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.donestats span{font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* exam map */
.krow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
.krow .meter{width:44px;flex:none}
.meterbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.meterbar i{display:block;height:100%;background:var(--good)}
.krow .kt{flex:1;min-width:0;font-size:.93rem}
.krow .kt small{display:block;color:var(--muted);font-size:.76rem;margin-top:2px}
.pct{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* tabs */
.seg{display:flex;gap:6px;flex-wrap:wrap}

<script>
/* ===================== teaching figures ===================== */
(function(){
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=(x,y,lines,o={})=>{const ls=Array.isArray(lines)?lines:[lines];const lh=o.lh||13;const y0=y-(ls.length-1)*lh/2;return `<text x="${x}" y="${y0}" text-anchor="${o.a||'middle'}" class="${o.c||'f-t'}" style="font-size:${o.s||11}px${o.w?';font-weight:'+o.w:''}">${ls.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}">${esc(l)}</tspan>`).join('')}</text>`};
const box=(x,y,w,h,cls='f-box',r=8)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${cls}"/>`;
const arrow=(x1,y1,x2,y2,cls='f-arr')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" marker-end="url(#ah)"/>`;
const defs=`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ahead"/></marker></defs>`;
const svg=(w,h,inner,label)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label||'diagram')}">${defs}${inner}</svg>`;

const F={};
/* generic vertical chain: arg = [[title, sub], ...] */
F.chain=arg=>`<div class="fchain">${arg.map((s,i)=>`${i?'<div class="fch-arr" aria-hidden="true">↓</div>':''}<div class="fch-box ${s[2]||''}"><b>${s[0]}</b>${s[1]?`<span>${s[1]}</span>`:''}</div>`).join('')}</div>`;
F.problemchain=()=>F.chain([['Threat','What the adversary can do to us'],['Operational problem','What that prevents us from achieving (no solution named)','hl'],['Capability need','What we must be able to do, how well, under what conditions'],['Requirements','Measurable, testable, traceable statements'],['Solution','Materiel and non-materiel (DOTmLPF-P)'],['Test & field','Evidence it actually solves the problem']]);

F.vee=()=>{let s='';
  s+=`<polygon points="2,24 358,24 238,282 122,282" class="f-vbg"/>`;
  const L=[['Operational','requirements'],['System','requirements'],['Element','requirements'],['Program & equip.','requirements']];
  const R=[['Operational','tests'],['System demo &','qualification test'],['Multi-element','integration & test'],['Engineering','test & evaluation']];
  L.forEach((t,i)=>{const x=6+i*18,y=32+i*44;s+=box(x,y,102,34,'f-box2',6)+T(x+51,y+17,t,{s:10,w:600,lh:12});s+=`<line x1="${x+102}" y1="${y+17}" x2="${252-i*18}" y2="${y+17}" class="f-dash"/>`});
  R.forEach((t,i)=>{const x=252-i*18,y=32+i*44;s+=box(x,y,102,34,'f-box2',6)+T(x+51,y+17,t,{s:10,w:600,lh:12})});
  s+=box(100,212,160,28,'f-box3',6)+T(180,226,'Functional → detailed design',{s:9.8,w:600});
  s+=box(116,248,128,28,'f-box3',6)+T(180,262,'Code, build, assemble',{s:9.8,w:600});
  s+=T(14,14,'Left side: define',{s:10,a:'start',c:'f-mut',w:700})+T(346,14,'Right side: prove',{s:10,a:'end',c:'f-mut',w:700});
  s+=T(52,302,'REQUIREMENTS',{s:10,w:700,c:'f-red'})+T(180,302,'DESIGN & PRODUCTION',{s:10,w:700,c:'f-red'})+T(308,302,'TESTING',{s:10,w:700,c:'f-red'});

F.reform=()=>`<ol class="ftl">${[['Dec 2023','FY24 NDAA §811','Congress orders a requirements-process review. Report’s #1 recommendation: reorient the JROC.'],['9 Apr 2025','Executive Order 14265 §7','President directs a comprehensive JCIDS review within 180 days.'],['May 2025','JRWG 49-day sprint','Joint Requirements Working Group, led by a DW senior advisor, weighs 3 COAs; finishes 90 days early to shape the FY26 NDAA.'],['20 Aug 2025','Hegseth / Feinberg memo','“Reforming the Joint Requirements Process…”: 6 key actions: JCIDS sunset, RRAB, MEIA, JAR, CPM update, Service reform.'],['Nov 2025','Acquisition Transformation','Defense Acquisition System renamed the Warfighting Acquisition System (WAS).'],['18 Dec 2025','FY26 NDAA signed','SPEED (House) and FoRGED (Senate) ideas enacted in Title XVIII; §1811 rewrites the JROC statute (10 U.S.C. §181) around joint operational problems.'],['15 Jan 2026','JFRP Charter + Manual','CJCSI 5123.01J and CJCSM 5123.01 replace the JCIDS documents.'],['5 Aug 2026','Manual 5123.01A + Charter CH 1','Current versions. JICR replaces JUON/JEON.']].map(r=>`<li><span class="ftd">${r[0]}</span><b>${r[1]}</b><span>${r[2]}</span></li>`).join('')}</ol>`;

<div class="fjt"><span class="eyebrow">Principal members · the uniformed #2s</span><div class="fjg">${['Vice Chief of Staff, Army','Vice Chief of Naval Operations','Vice Chief of Staff, Air Force','Asst. Commandant, Marine Corps','Vice Chief of Space Operations','Vice Chief, National Guard Bureau <em>(new)</em>'].map(x=>`<span>${x}</span>`).join('')}</div></div>

F.mechanics=()=>`<div class="fmech"><div class="fm-top"><b>JROC</b><span>identifies and ranks</span><b class="fm-jop">Joint Operational Problems</b></div><div class="fch-arr" aria-hidden="true">↓ through the lens of JOPs</div>
<div class="fm4">${[['1','JFD','Joint Force Design','new'],['2','JCI','Joint Capability Integration','new'],['3','CCMD','Combatant Command reqs','refined'],['4','CPM','Capability Portfolio Mgmt','refined']].map(x=>`<div class="fm-b"><span class="fgn">${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span><em>${x[3]}</em></div>`).join('')}</div>
<div class="fm-row"><div class="fm-b alt"><b>MEIA</b><span>Mission engineering, experiments, industry → recommendations</span></div><div class="fch-arr" aria-hidden="true">→</div><div class="fm-b hot"><b>RRAB</b><span>Programming guidance + JAR allocation</span></div></div>
<div class="fch-arr" aria-hidden="true">↓</div><div class="fm-b wide"><b>Services</b><span>No JROC validation or gatekeeping · move at speed · JAR incentive to help solve JOPs</span></div></div>`;

F.cpmparts=()=>`<div class="fgrid4">${[['CPMR','Capability Portfolio Management Review','Joint Staff · requirements view'],['IAPR','Integrated Acquisition Portfolio Review','USW(A&S) · program health'],['TMTR','Technology Modernization Transition Review','USW(R&E) · technology & S&T'],['PBR','Program & Budget Review','CAPE · the money (input)']].map(p=>`<div class="fg"><b>${p[0]}</b><span class="fgl">${p[1]}</span><span>${p[2]}</span></div>`).join('')}</div>`;

F.idshift=()=>`<div class="fcols"><div class="fcol old"><span class="eyebrow">Requirements-first (legacy JCIDS)</span><p class="fq">“I need a system that does X, Y, and Z.”</p><ul><li>Starts with a technical solution</li><li>Attributes locked before the problem is validated</li><li>Threat evolves before fielding</li><li>Industry bids the spec, not the problem</li><li>Success = compliant document</li></ul></div><div class="fcol new"><span class="eyebrow">Problem-first (JFRP / WAS)</span><p class="fq">“Blue Force cannot target Red naval assets beyond the Second Island Chain in a contested EMS environment.”</p><ul><li>Starts with an operational condition</li><li>Solution space left open on purpose</li><li>MEIA tests feasibility before requirements are fixed</li><li>Industry answers the problem</li><li>Success = capability reaches the warfighter</li></ul></div></div>`;

F.flaws=()=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Flaw</th><th>Bureaucratic symptom</th><th>Operational consequence</th></tr></thead><tbody><tr><td><b>Timeline mismatch</b></td><td>Nominal 40–100 days per document; actual average ≈300 days</td><td>Too slow to keep up with the threat</td></tr><tr><td><b>Perfect solution fallacy</b></td><td>Waiting for a complete, flawless capability before approval</td><td>Threat evolves past the solution; building for yesterday’s problem</td></tr><tr><td><b>Compliance trap</b></td><td>Paperwork polished for document survival</td><td>The paperwork is perfect; the warfighter stays unequipped</td></tr></tbody></table></div>`;

F.userstory=()=>`<div class="fus"><div><span>As a</span><b>[who]</b></div><div><span>I want</span><b>[what]</b></div><div><span>so that</span><b>[why]</b></div></div>`;

F.docs=()=>F.chain([['ICD · Initial Capabilities Document','Describes the gap and the capability needed. Supported the materiel development decision and Milestone A.'],['CDD · Capability Development Document','Sets the measurable performance attributes (thresholds/objectives). Supported Milestone B: start engineering & manufacturing development.'],['CPD · Capability Production Document','Refined attributes for production. Supported Milestone C.'],['DCR · DOTmLPF-P Change Recommendation','For non-materiel fixes: change doctrine, training, organization… instead of buying something.']]);

F.threeq=()=>`<div class="fgrid3">${[['What do we need?','JFRP','f-s1'],['How do we pay for it?','PPBE','f-s2'],['How do we build and buy it?','WAS','f-s3']].map(x=>`<div class="fg ${x[2]}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`;

F.ndaa=()=>`<div class="fcols"><div class="fcol"><span class="eyebrow">Authorization · NDAA</span><p class="fq">Permission</p><ul><li>Creates and changes programs, authorities, policy</li><li>Sets procurement quantities</li><li>Directs testing, reporting, oversight (e.g., DOT&amp;E)</li><li>Authorizes appropriations (10 U.S.C. §114)</li></ul></div><div class="fcol new"><span class="eyebrow">Appropriation · Appropriations Act</span><p class="fq">Money</p><ul><li>Budget authority to obligate and pay</li><li>Split into accounts by purpose ("colors")</li><li>Each with a time limit to obligate</li><li>No appropriation, no contract</li></ul></div></div>`;

function seqStep(typeMode){return{
  render:(s,ctx)=>{ctx.order=ctx.order||(s.keepOrder?s.ids.slice():window.APP.shuffle(s.ids));ctx.k=ctx.k||0;ctx.miss=ctx.miss||0;ctx.got=ctx.got||[];return `${KH(s)}<p class="q">${s.q||(typeMode?'Name the flashing element.':'Which element goes in the flashing slot?')}</p><div id="seqchart"></div><div id="seqctl" style="margin-top:12px"></div>`},
  mount(s,ctx,el){const base=s.o||{};const visible=base.show||ALL;
    const paint=()=>{const id=ctx.order[ctx.k];const done=ctx.got;const blanks=ctx.order.filter(x=>!done.includes(x));
      $('#seqchart',el).innerHTML=chartBox(Object.assign({lines:false,detail:false},base,{show:visible.filter(x=>!blanks.includes(x)),blank:blanks,hl:id,q:{[id]:'?'}}),'seq');
      setTimeout(()=>scrollToEl($('#cw',el),id),20);
      if(id==null){$('#seqctl',el).innerHTML='';return}
      const prog=`<div class="small muted" style="margin-bottom:8px">${ctx.k+1} of ${ctx.order.length}${ctx.miss?` · ${ctx.miss} missed`:''}</div>`;
      if(typeMode){$('#seqctl',el).innerHTML=`${prog}<div class="row" style="flex-wrap:nowrap"><input class="tin" id="ctin" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Type the name"><button class="btn primary" id="cgo">Check</button></div><p class="hint">Short forms work: SPY, C&D network, ALIS, CEC, VLS…</p><div id="cfb"></div>`;
        const inp=$('#ctin',el);const go=()=>{if(ctx.busy||!inp.value.trim())return;const ok=window.APP.fuzzy(inp.value,[BY[id].name].concat(BY[id].aka));answer(id,ok)};$('#cgo',el).onclick=go;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};if(!('ontouchstart' in window))setTimeout(()=>inp.focus(),30)}
      else{const pool=(s.pool||ctx.order).filter(x=>!done.includes(x));let opts=[id];const others=window.APP.shuffle(pool.filter(x=>x!==id));const same=window.APP.shuffle(ALL.filter(x=>x!==id&&BY[x].zone===BY[id].zone&&!opts.includes(x)));while(opts.length<4&&(others.length||same.length)){const n=others.shift()||same.shift();if(n&&!opts.includes(n))opts.push(n)}opts=window.APP.shuffle(opts);
        $('#seqctl',el).innerHTML=`${prog}<div class="opts">${opts.map(x=>`<button class="opt" data-x="${x}"><span>${esc(BY[x].name)}</span></button>`).join('')}</div><div id="cfb"></div>`;
        $$('#seqctl .opt',el).forEach(b=>b.onclick=()=>{if(ctx.busy)return;const ok=b.dataset.x===id;b.classList.add(ok?'right':'wrong');if(!ok)$$('#seqctl .opt',el).forEach(x=>{if(x.dataset.x===id)x.classList.add('right')});answer(id,ok)})}
    };
    const answer=(id,ok)=>{ctx.busy=true;if(!ok)ctx.miss++;(ctx.res=ctx.res||{})[id]=ok;$('#cfb',el).innerHTML=`<p class="small" style="margin-top:8px;color:${ok?'var(--good)':'var(--bad)'}"><b>${ok?'✓':'✗'} ${esc(BY[id].name)}</b> — ${esc(BY[id].fn)}</p>`;
      setTimeout(()=>{ctx.busy=false;ctx.got.push(id);ctx.k++;if(ctx.k>=ctx.order.length){paint();ctx.result={ok:ctx.miss===0,q:ctx.miss===0?2:ctx.miss<=Math.ceil(ctx.order.length/4)?1:0,msg:ctx.miss?`${ctx.miss} of ${ctx.order.length} missed. They’ll come back in review.`:'Every slot correct.'};
        if(s.perEl){Object.keys(ctx.res).forEach(x=>{const it=elItem(x);if(it)window.APPSRS.grade(it,ctx.res[x]?2:0)})}
        ctx.autoCheck()}else paint()},ok?(typeMode?900:650):2200)};

  auto:true,check(s,ctx){return ctx.result}

const units=[
/* ============================== UNIT 1 ============================== */
{id:`U1`,title:`The problem comes first`,sub:`Operational problems, the systems engineering V, and the “problem-first” shift`,lessons:[
{id:`L11`,title:`Problem vs. solution`,sub:`Okinawa, Soviet bombers, and the birth of Aegis`,mins:7,slides:`Slides 4, 7`,steps:[
 {t:`story`,h:`Okinawa, spring 1945`,slide:`Slide 7`,b:`<p>Off Okinawa, wave after wave of kamikaze aircraft dove on the fleet. The destroyers on the radar picket line took the worst of it. By the end of the campaign roughly 4,900 U.S. sailors were dead and more than 30 ships had been sunk, most of it from the air.</p><p>The gunners did their jobs. The trouble was simpler and harder: too many attackers, arriving too fast, for guns to stop in time.</p>`},
 {t:`predict`,q:`If you were the Navy in 1945, which is the best way to state the problem?`,o:[`We need more 40mm guns on every destroyer.`,`Ships cannot defend themselves against air attacks that arrive faster and in greater numbers than they can engage.`,`We need a radar that sees farther.`],a:1,why:`The first and third options jump straight to a fix. The second describes what is going wrong and leaves every kind of answer open: guns, missiles, radar, fighters, tactics. That difference between a problem and a solution is the idea this whole course is built on.`},
 {t:`teach`,h:`Problem vs. solution`,fig:`problemchain`,b:`<p>An <span class="term">operational problem</span> says what is preventing the force from achieving its objective. It names the condition, the threat and the stakes. It does <b>not</b> name the purchase.</p><p>A solution comes later, after someone asks what combination of equipment, tactics, training and organization could fix it. Write the solution into the problem statement and you have quietly ruled out every other answer.</p>`},
 {t:`mc`,k:`k_opprob`,q:`Which statement is written as an operational problem rather than a solution?`,o:[`Install a longer-range radar on every DDG.`,`The strike group cannot keep high-value units protected against coordinated low-altitude missile raids in a jammed environment.`,`Buy 200 more SM-6 missiles.`,`Replace the 5-inch gun with a laser.`],a:1,why:`Only the strike-group statement describes a condition that blocks the mission. The rest are purchases. Notice it says how hard the problem is (coordinated, low-altitude, jammed) without saying what to buy.`},
 {t:`story`,h:`The problem didn’t go away. It evolved.`,fig:`radar`,b:`<p>In 1967 the Israeli destroyer <i>Eilat</i> was sunk by Soviet-built Styx missiles fired from small boats: the first warship ever sunk by an anti-ship missile.</p><p>By the 1970s Soviet Naval Aviation had regiments of Badger and Backfire bombers, scouted and supported by long-range Bears, built to launch massed missile raids at carrier groups from far outside gun range. Same operational problem as Okinawa, with faster, deadlier attackers.</p>`},
 {t:`teach`,h:`Meyer’s answer: Aegis`,slide:`Slide 7`,b:`<p>Rear Admiral Wayne E. Meyer, the “Father of Aegis,” ran the weapon system from 1970. He framed it around three functional cornerstones: <b>Detect, Control, Engage</b>. Those are the three columns of the 7.2B chart you will learn to draw.</p><p>His motto was <b>“Build a little, test a little, learn a lot.”</b> A test version of the system went to sea on USS <i>Norton Sound</i> in 1973, a decade before the first Aegis ship, USS <i>Ticonderoga</i>, was commissioned in 1983.</p><p>Your professor’s point: a clear operational problem, fleet air defense against air and missile raids, drove the whole design.</p>`},
 {t:`tf`,q:`Aegis started from a specific operational problem (defending the fleet against massed air and missile attack), not from a desire for a particular radar.`,a:true,why:`Right. The problem (raids too fast and too numerous for existing defenses) came first. The SPY radar, Command and Decision, and the Standard Missile were the answer to it.`},
 {t:`fill`,k:`k_opprob k_72frame`,q:`Meyer organized Aegis around three cornerstones: ___, ___, and ___.`,blanks:[`Detect`,`Control`,`Engage`],bank:[`Detect`,`Control`,`Engage`,`Procure`,`Design`,`Validate`],why:`Detect → Control → Engage. Keep that order. It is also the left-to-right layout of the 7.2B chart.`},
 {t:`key`,h:`Operational problem: achieving air superiority (Slide 7)`,slide:`Slides 4, 7`,k:`k_opprob`,b:`<ul><li>An operational problem states what blocks the mission, not what to buy.</li><li>The slide’s example: fleet air defense. Kamikazes at Okinawa, then Soviet bombers firing long-range anti-ship missiles.</li><li>That problem drove Meyer’s approach and produced Aegis: Detect, Control, Engage.</li><li>Today’s formal version of this idea is the <b>Joint Operational Problem (JOP)</b>, in Unit 6.</li></ul>`,prof:`Slide 4’s SECNAV video pitches a new age of requirements. The professor calls it aspirational, like the French idea of élan: fighting spirit doesn’t replace the tedious, exhausting engineering work. Real change will lean on proven industry practice and radically changed regulations, perhaps laws.`}
],review:[
 {t:`recall`,k:`k_opprob`,q:`What is the difference between an operational problem and a requirement or solution?`,a:`An operational problem describes the condition that keeps the force from achieving its objective (threat, conditions, stakes) without naming a solution. Requirements and solutions come afterward, once alternatives have been weighed.`},
 {t:`mc`,k:`k_opprob`,sid:`r1b`,q:`Kamikazes at Okinawa, then Soviet bombers firing long-range anti-ship missiles. What did that operational problem drive the Navy to build?`,o:[`A faster-firing gun for every destroyer`,`Aegis: a system to detect, control and engage raids too fast and too numerous for existing defenses`,`More carriers, to keep the fleet out of missile range`,`A longer-range radar, since detection was the only gap`],a:1,why:`The problem came first: raids arriving faster and in greater numbers than ships could engage. Aegis was the answer, built around Detect, Control, Engage. That is the point of the example: the problem drives the capability, not the other way around.`},
 {t:`mc`,k:`k_opprob`,sid:`r2b`,q:`Meyer’s motto was “Build a little, test a little, learn a lot.” What does it mean for how you develop a system?`,o:[`Deliver in small increments, test each one, and let what you learn shape the next`,`Buy a few ships first so the program costs less`,`Hold all testing until the complete system is built`,`Let industry design it and have the Navy test it`],a:0,why:`A test version of Aegis went to sea on USS Norton Sound in 1973, a decade before USS Ticonderoga. Learning early beat waiting for a perfect design. In Unit 4 you’ll see JCIDS fall into the opposite trap: the perfect solution fallacy.`}
]},
{id:`L12`,title:`The systems engineering V`,sub:`How Aegis turns a requirement into a working ship`,mins:7,slides:`Slide 8`,steps:[
 {t:`teach`,h:`From a problem to a ship that works`,slide:`Slide 8`,b:`<p>Knowing the problem is step one. Turning it into hardware and software that works at sea takes a disciplined method. PEO IWS draws the Aegis method as a V, and your professor calls it a fundamental part of combat system engineering.</p>`},
 {t:`explore`,h:`Three parts of the V`,fig:`vee`,spots:[[`Left side: requirements`,`Top to bottom, requirements get more detailed: operational requirements → system requirements → element requirements → computer program and equipment requirements. Each level breaks the one above into pieces engineers can build.`],[`Bottom: design & production`,`Functional design, detailed design, then code, build and assemble. This is where the thing actually gets made, one component at a time.`],[`Right side: testing`,`Bottom to top, testing proves each level: unit tests, element integration, engineering test and evaluation, multi-element integration and test (MEIT), system demonstration and qualification, and finally operational tests.`],[`The dashed links`,`Each test level on the right checks the requirement level at the same height on the left. Operational tests check operational requirements; element tests check element requirements.`],[`The diamonds: reviews`,`SDR, PDR and CDR (System Design, Preliminary Design and Critical Design Reviews) are gates on the left where the design is examined before money and metal are committed.`]]},
 {t:`order`,k:`k_vee`,q:`Put the left side of the V in order, from the top (least detailed) down.`,items:[`Operational requirements`,`System requirements`,`Element requirements`,`Computer program & equipment requirements`],why:`Requirements decompose: what the fleet needs → what the whole system must do → what each element (radar, C&D, launcher) must do → what each program and box must do.`},
 {t:`predict`,q:`The radar and the weapon control software each pass their own tests. On the integrated ship, engagements still happen too late. Where in the V should this have been caught?`,o:[`Unit testing`,`Integration and system-level testing on the right side`,`It can’t be caught before deployment`],a:1,why:`Elements can pass alone and still fail together, for example when an interface drops a time stamp. Integration testing exists to catch exactly this, checked against the system requirements on the left. Someone also has to ask at the reviews how the pieces fit.`},
 {t:`teach`,h:`Verify vs. validate`,b:`<p><b>Verification:</b> did we build it right? Does it meet the written specification?</p><p><b>Validation:</b> did we build the right thing? Does it solve the operational problem in realistic conditions?</p><p>A system can pass every verification test and still fail validation if the requirements were wrong. That is why the warfighter’s voice matters on the left side, and why operational tests sit at the top right.</p>`},
 {t:`mc`,k:`k_vee`,q:`Operational tests at the top right of the V check the system against…`,o:[`The computer program requirements`,`The operational requirements at the top left`,`The budget`,`The contract price`],a:1,why:`Levels mirror across the V. Top-right operational tests validate against top-left operational requirements: does it work for the fleet?`},
 {t:`key`,h:`Aegis System Engineering Process (Slide 8)`,slide:`Slide 8`,k:`k_vee`,b:`<ul><li><b>Left: requirements</b>, decomposed operational → system → element → program & equipment.</li><li><b>Bottom middle: design and production.</b></li><li><b>Right: testing</b>, integrating upward from unit tests to operational tests.</li><li>Design reviews (SDR, PDR, CDR) are where warfighting involvement happens.</li></ul>`,prof:`“It’s imperative that you go to the reviews. They are where warfighting involvement happens. The invitation has always been there, you just have to go!”`},
 {t:`explain`,k:`k_vee`,q:`In a few sentences, explain the systems engineering V and why a warfighter should attend the design reviews.`,points:[`Left side decomposes requirements from operational down to detailed program and equipment requirements`,`The bottom is design and production (building it)`,`The right side integrates and tests upward, each level checking the matching requirement level`,`Reviews (SDR/PDR/CDR) are where warfighters can catch wrong assumptions before the design is locked in`],model:`The V starts on the left by decomposing the operational requirement into system, element, and detailed computer program and equipment requirements. The bottom is design and production. The right side integrates and tests upward, with each test level verifying the matching requirement level, up through operational test. The design reviews on the left are where warfighters can catch a wrong assumption before money and hardware lock it in, which is why the professor says to go to them.`}
],review:[
 {t:`tf`,k:`k_vee`,q:`In the systems engineering V, testing happens on the left side.`,a:false,why:`Left = requirements. Bottom = design and production. Right = testing.`},
 {t:`recall`,k:`k_vee`,q:`Name the three regions of the systems engineering V and what happens in each.`,a:`Left: requirements decomposition (operational → system → element → program/equipment). Bottom: design and production. Right: testing and integration, each level checking the matching requirement level.`},
 {t:`mc`,k:`k_vee`,q:`Why does the professor insist you attend design reviews?`,o:[`They count toward certification hours`,`They are where warfighting involvement happens, before the design is locked`,`They are where contracts are signed`,`They replace operational testing`],a:1,why:`Reviews are the warfighter’s chance to shape the system.`}
]},
{id:`L13`,title:`Has your professional identity changed?`,sub:`Requirements-first vs. problem-first, and the professor’s caveat`,mins:6,slides:`Slides 5, 6, 16`,steps:[
 {t:`teach`,h:`Why you’re learning this at all`,slide:`Slide 5`,b:`<p>By congressional mandate, everyone who identifies warfighter capabilities and generates requirements for major defense acquisition programs (MDAPs) must be certified in requirements management: military, civilian and contractor.</p><p>Your professor’s note: most of you won’t get this training anywhere else, and after your next tactical tours you’ll deal with this material more and more.</p>`},
 {t:`teach`,h:`The pitch: problem-first`,fig:`idshift`,slide:`Slide 16`,b:`<p>The reform’s headline is a shift from <b>requirements-first</b> to <b>problem-first</b>. Read the two quotes in the figure. One describes a box to build. The other describes a condition the Joint Force can’t overcome.</p>`},
 {t:`sort`,k:`k_problemfirst`,q:`Legacy requirements-first, or reformed problem-first?`,bins:[`Requirements-first`,`Problem-first`],items:[[`Starts with a technical solution`,0],[`Solution space is deliberately left open`,1],[`Performance attributes locked before the problem is validated`,0],[`MEIA validates feasibility before requirements are fixed`,1],[`Industry writes proposals for the spec`,0],[`Industry responds to problems`,1],[`Success = compliance with the document`,0],[`Success = capability reaching the warfighter`,1]],why:`The right-hand column is the target culture of the JFRP and the Warfighting Acquisition System.`},
 {t:`teach`,h:`Slide 6: the question mark`,slide:`Slide 6`,b:`<p>The slide originally said: <i>“Your professional identity has changed. You are no longer managing paperwork. You are accountable for operational outcomes.”</i></p><p>Your professor turned it into a question. That framing implies earlier generations weren’t accountable for outcomes. They were. Every generation owns the paperwork, the process <b>and</b> the outcomes. Read the new manual (CJCSM 5123.01A) and you’ll find plenty of paperwork still there. The more things change, the more they stay the same.</p>`},
 {t:`predict`,q:`Your professor calls the problem-first shift “in some respects a fallacy.” Why?`,o:[`Because JCIDS never looked at threats`,`Because JCIDS always included threat-informed gap analysis; the real failure was the process becoming an end in itself`,`Because problems can’t be written down`],a:1,why:`The SE V starts with requirements, and JCIDS included gap analyses. It did not ignore threats, problems or warfighter input. The process itself became the goal. Industry can’t let that happen, because it has to make a profit or go out of business. Government doesn’t face that pressure.`},
 {t:`key`,h:`The core conceptual shift (Slides 6, 16)`,k:`k_problemfirst`,b:`<ul><li>Requirements-first: “I need a system that does X, Y, Z.” Problem-first: “Blue Force cannot ___ under ___ conditions.”</li><li>Success = capability reaching the warfighter, not a compliant document.</li><li>Critical thinker’s caveat: JCIDS didn’t ignore threats or gaps. Its process became an end unto itself. Industry can’t afford that; government can.</li></ul>`,prof:`Previous and current generations both carry responsibility for paperwork, process and outcomes.`},
 {t:`explain`,k:`k_problemfirst`,q:`A division officer says: “The new system is problem-first, so the old one ignored the threat.” Correct them in a few sentences.`,points:[`JCIDS did include threat-informed gap analysis; it did not ignore threats or warfighter input`,`Its real failure was that the process became an end in itself (compliance over outcomes)`,`Industry avoids this because it must deliver to make a profit; government lacks that forcing function`,`Problem-first means stating the operational condition, leaving the solution open, and judging success by capability fielded`],model:`Not quite. JCIDS started from capability gaps and threat-informed analysis; it never ignored the threat or the warfighter. What went wrong is that the process became an end in itself, so success meant a compliant document instead of a fielded capability. Industry can’t let that happen because it has to deliver or go out of business. The reform’s problem-first idea is to state the operational condition, leave the solution space open, and measure success by capability delivered.`}
],review:[
 {t:`recall`,k:`k_rmct`,q:`Who must be certified in requirements management, by congressional mandate?`,a:`All DoW military, civilian and contractor personnel responsible for identifying warfighter capabilities and generating requirements for MDAPs.`},
 {t:`mc`,k:`k_problemfirst`,q:`Why did the professor turn Slide 6’s statement into a question?`,o:[`The statement was classified`,`It implied earlier generations weren’t accountable for outcomes; every generation owns paperwork, process and outcomes`,`The new manual eliminated paperwork`,`Requirements officers no longer exist`],a:1,why:`“The more things change, the more they stay the same.”`}
]}
]},
/* ============================== UNIT 2 ============================== */
{id:`U2`,title:`Big “A” acquisition`,sub:`Three decision support systems, the strategy cascade, and the alphabet soup`,lessons:[
{id:`L21`,title:`Three questions, three systems`,sub:`JFRP, PPBE, WAS: need, calendar, event`,mins:8,slides:`Slide 9`,steps:[
 {t:`teach`,h:`Three questions every capability must answer`,fig:`threeq`,slide:`Slide 9`,b:`<p>Say the fleet needs a better defense against hypersonic missiles. Before a sailor ever gets it, three different questions need answers:</p><ol><li><b>What do we need?</b> How big is the gap, and how well must the fix perform?</li><li><b>How will we pay for it?</b> Which money, how much, in which year?</li><li><b>How do we build and buy it?</b> Contracts, engineering, testing, production.</li></ol><p>The Department runs a separate system for each question. Together they are its three <span class="term">decision support systems</span>.</p>`},
 {t:`match`,k:`k_three`,q:`Match each question to its system.`,pairs:[[`What do we need?`,`JFRP (requirements)`],[`How will we pay for it?`,`PPBE (resources)`],[`How do we build and buy it?`,`WAS (acquisition)`]],why:`JFRP replaced JCIDS. WAS is the Warfighting Acquisition System, the November 2025 name for the Defense Acquisition System (DAS).`},
 {t:`teach`,h:`Each system runs on a different clock`,fig:`venn`,b:`<p>This is the part students blur. Each system is <b>driven</b> by something different:</p><ul><li><b>JFRP is need-driven.</b> It moves when a gap or operational problem appears.</li><li><b>PPBE is calendar-driven.</b> The budget runs on fiscal years whether you’re ready or not.</li><li><b>WAS is event-driven.</b> Programs advance at milestones and decision points when evidence (tests, reviews) says they’re ready.</li></ul>`},
 {t:`memo`,h:`Hook`,big:`Need. Calendar. Event.`,b:`Read it as a story: a <b>need</b> appears (JFRP), you wait for the budget <b>calendar</b> (PPBE), then the program moves <b>event</b> by event (WAS). Same order as the slide: requirements on top, resourcing and acquisition below.`},
 {t:`sort`,k:`k_driven k_oversight`,q:`Which system does each description belong to?`,bins:[`JFRP`,`PPBE`,`WAS`],items:[[`Need-driven`,0],[`Calendar-driven`,1],[`Event-driven`,2],[`CJCS oversight`,0],[`USW(Comptroller) and Director, CAPE oversight`,1],[`USW(A&S) and USW(R&E) oversight`,2],[`Capability and gap analysis`,0],[`Budgeting to support development, procurement and sustainment`,1],[`Traceable requirements decomposition; thorough systems engineering and testing`,2],[`Governed by CJCSI 5123.01J and the JFRP Manual`,0],[`Governed by DoDD 7045.14`,1,`Slide 9 prints “7054.14”; the PPBE directive is DoDD 7045.14`],[`Governed by DoW 5000.01/02`,2],[`Concept-based, threat-informed, joint interoperable`,0],[`Delivers capability to the warfighter`,2]],why:`These are the bullets on Slide 9. Learn them as three columns.`},
 {t:`teach`,h:`Big “A” vs. little “a”`,fig:`venn`,slide:`Slide 9`,b:`<p><b>Big “A” Acquisition</b> = JFRP + PPBE + WAS: all three systems working together.</p><p><b>Little “a” acquisition</b> = only the acquisition system (the DAS, now WAS): contracting, engineering, testing, production.</p><p>When someone says “acquisition is broken,” ask which one they mean. A program can be well run in little-a terms and still fail Big-A because the requirement was stale or the money arrived a year late.</p>`},
 {t:`predict`,q:`A requirement is approved, but the money for it won’t arrive for two years. What happens?`,o:[`The program starts immediately anyway`,`The program waits, and the requirement may be stale by the time money arrives`,`Congress automatically appropriates emergency money`],a:1,why:`That’s why Slide 9 says proper synchronization delivers timely, relevant capability. Need-driven, calendar-driven and event-driven processes don’t naturally line up. When they drift apart, capability arrives late or not at all.`},
 {t:`mc`,k:`k_bigA`,q:`Little “a” acquisition refers to…`,o:[`All three decision support systems`,`Only the acquisition system (DAS/WAS)`,`Only PPBE`,`Only requirements`],a:1,why:`Big A = JFRP + PPBE + WAS. Little a = the acquisition system alone.`},
 {t:`key`,h:`DoW’s three decision support systems (Slide 9)`,k:`k_three k_driven k_oversight k_bigA`,b:`<div class="tblwrap"><table class="tbl"><tr><th></th><th>JFRP</th><th>PPBE</th><th>WAS</th></tr><tr><td>Driven by</td><td>Need</td><td>Calendar</td><td>Events</td></tr><tr><td>Oversight</td><td>CJCS</td><td>USW(C), Dir CAPE</td><td>USW(A&S), USW(R&E)</td></tr><tr><td>Governing docs</td><td>CJCSI 5123.01J / JFRP Manual</td><td>DoDD 7045.14</td><td>DoW 5000.01/02</td></tr><tr><td>Does</td><td>Capability & gap analysis; major documents</td><td>Budgets development, procurement, sustainment</td><td>Requirements decomposition, SE & test; delivers capability</td></tr></table></div><p style="margin-top:10px">Big A = all three. Little a = WAS only. Proper synchronization delivers timely, relevant capability.</p>`,prof:`You must know these three systems, what they’re about, how they’re driven, the difference between Big A and little a, and the acronyms.`}
],review:[
 {t:`recall`,k:`k_three k_driven`,q:`Name DoW’s three decision support systems and what drives each.`,a:`JFRP (requirements): need-driven. PPBE (resourcing): calendar-driven. WAS (acquisition, formerly DAS): event-driven.`},
 {t:`mc`,k:`k_oversight`,q:`Who provides oversight of PPBE?`,o:[`CJCS`,`USW(Comptroller) and Director, CAPE`,`USW(A&S) and USW(R&E)`,`The JROC`],a:1,why:`Comptroller and CAPE own the money process.`},
 {t:`mc`,k:`k_oversight`,q:`Who provides oversight of the acquisition system (WAS)?`,o:[`USW(A&S) and USW(R&E)`,`CJCS`,`Director, CAPE`,`The Service Chiefs only`],a:0,why:`The acquisition and engineering under secretaries.`},
 {t:`type`,k:`k_bigA`,q:`Big “A” Acquisition = JFRP + PPBE + ___`,accept:[`WAS`,`Warfighting Acquisition System`,`DAS`,`Defense Acquisition System`],why:`WAS, formerly the DAS.`},
 {t:`tf`,k:`k_driven`,q:`JFRP is calendar-driven.`,a:false,why:`JFRP is need-driven. PPBE is calendar-driven. WAS is event-driven.`},
 {t:`mc`,k:`k_oversight`,q:`Which document governs the acquisition system (WAS)?`,o:[`DoW 5000.01/02`,`DoDD 7045.14`,`CJCSI 5123.01J`,`DoDD 7045.20`],a:0,why:`5000-series for acquisition; 7045.14 for PPBE; 5123.01J for JFRP; 7045.20 for portfolio management.`}
]},
{id:`L22`,title:`Where the demand signal starts`,sub:`NSS → NDS → NMS, and how CCDR gaps reach the JROC`,mins:5,slides:`Slide 26`,steps:[
 {t:`teach`,h:`Requirements don’t start in a vacuum`,fig:`cascade`,slide:`Slide 26`,b:`<p>Your professor sketched this on the board (Slide 26). It shows how strategy flows downhill until it becomes something a requirements officer can act on.</p>`},
 {t:`explore`,h:`Tap through the cascade`,spots:[[`NSS · President`,`The National Security Strategy: the President’s statement of national interests and how every instrument of national power will protect them.`],[`NDS · Secretary of War`,`The National Defense Strategy turns the NSS into defense priorities, including the Key Operational Problems the force has to solve.`],[`NMS · CJCS`,`The National Military Strategy is the Chairman’s military translation of the NDS.`],[`Service Chiefs`,`They organize, train and equip forces. Their requirements turn into budgets (PPBE) and programs (WAS).`],[`CCDRs`,`Combatant commanders get their missions through the Unified Command Plan (UCP) and write OPLANs to fight. They report their gaps in an Integrated Priority List (IPL).`],[`JROC / JFRP`,`At the joint level, it takes strategy plus CCDR gaps and turns them into prioritized joint operational problems.`]]},
 {t:`order`,k:`k_cascade`,q:`Put the strategy documents in order from the top.`,items:[`National Security Strategy (President)`,`National Defense Strategy (Secretary of War)`,`National Military Strategy (CJCS)`],why:`NSS → NDS → NMS. Each one narrows the one above.`},
 {t:`mc`,k:`k_cascade k_cga`,q:`How does a combatant commander formally tell the Department which capability gaps matter most?`,o:[`A CDD`,`An Integrated Priority List (IPL)`,`A POM`,`A JROCM`],a:1,why:`Each CCDR submits an IPL. IPLs feed the Capability Gap Assessment (Unit 7).`},
 {t:`key`,h:`The strategy cascade (Slide 26)`,k:`k_cascade`,b:`<ul><li>NSS (President) → NDS (SecWar) → NMS (CJCS).</li><li>The UCP assigns CCDRs their missions; CCDRs produce OPLANs and IPLs (their gaps).</li><li>Service Chiefs organize, train and equip through PPBE and WAS.</li><li>The JROC/JFRP sits between strategy and the Services, fed by CCDR gaps.</li></ul>`}
],review:[
 {t:`recall`,k:`k_cascade`,q:`Trace the strategy cascade from the President to the requirements process.`,a:`NSS (President) → NDS (Secretary of War) → NMS (CJCS) → JROC/JFRP. CCDRs (missions via the UCP) write OPLANs and IPLs that feed the JROC; Service Chiefs execute through PPBE and WAS.`}
]},
{id:`L23`,title:`Decoding the alphabet soup`,sub:`ICD, CDD, CPD, DCR, DOTmLPF-P and Slide 9’s acronyms`,mins:6,slides:`Slide 9`,steps:[
 {t:`teach`,h:`The legacy documents`,fig:`docs`,b:`<p>Under JCIDS a requirement moved through a family of documents. They still matter: the programs you’ll work on were built on them, and Slide 9 lists them.</p>`},
 {t:`match`,k:`k_acronyms`,q:`Match each document to what it does.`,pairs:[[`ICD`,`States the capability gap and need`],[`CDD`,`Sets measurable performance attributes for development`],[`CPD`,`Refines attributes for production`],[`DCR`,`Recommends a non-materiel (DOTmLPF-P) fix`]],why:`ICD → CDD → CPD tracked Milestones A, B and C. A DCR changes doctrine, training or organization instead of buying something.`},
 {t:`teach`,h:`DOTmLPF-P: the non-materiel checklist`,fig:`dotmlpf`,b:`<p>Before buying anything new, analysts ask whether the gap can be closed by changing Doctrine, Organization, Training, materiel (little m: existing or off-the-shelf items), Leadership and education, Personnel, Facilities or Policy. The JFRP guiding principles still require addressing every element of DOTmLPF-P.</p>`},
 {t:`fill`,q:`In DOTmLPF-P, the lowercase m stands for ___ (existing or off-the-shelf items), and the final P stands for ___.`,blanks:[`materiel`,`Policy`],bank:[`materiel`,`Policy`,`money`,`Personnel`,`Planning`,`manpower`],why:`Little m = materiel you can get without a new development program. The trailing P = Policy.`},
 {t:`match`,k:`k_acronyms`,q:`Match each acronym to its meaning.`,pairs:[[`USD(C)`,`Under Secretary (Comptroller)`],[`Dir CAPE`,`Cost Assessment & Program Evaluation`],[`USD(A&S)`,`Acquisition & Sustainment`],[`USD(R&E)`,`Research & Engineering`],[`PPBE`,`Planning, Programming, Budgeting & Execution`],[`JCIDS`,`Joint Capabilities Integration & Development System`]],why:`Slide 9’s acronym box. Since the September 2025 executive order, “USD” titles also appear as “USW” (Under Secretary of War).`},
 {t:`type`,k:`k_acronyms`,q:`DAS stands for Defense Acquisition ___. (Its new name is the Warfighting Acquisition ___.)`,accept:[`System`],why:`Defense Acquisition System → Warfighting Acquisition System (November 2025).`},
 {t:`key`,h:`Slide 9 acronyms`,k:`k_acronyms`,b:`<p><b>DCR</b> DOTmLPF-P Change Recommendation · <b>ICD</b> Initial Capabilities Document · <b>CDD</b> Capability Development Document · <b>USD(C)</b> Under Secretary (Comptroller) · <b>Dir CAPE</b> Cost Assessment & Program Evaluation · <b>DAS</b> Defense Acquisition System (now WAS) · <b>JCIDS</b> Joint Capabilities Integration & Development System · <b>PPBE</b> Planning, Programming, Budgeting & Execution · <b>USD(A&S)</b> Acquisition & Sustainment · <b>USD(R&E)</b> Research & Engineering.</p>`}
],review:[
 {t:`recall`,k:`k_acronyms`,q:`Expand: ICD, CDD, DCR.`,a:`Initial Capabilities Document; Capability Development Document; DOTmLPF-P Change Recommendation.`},
 {t:`recall`,k:`k_acronyms`,q:`Expand: CAPE, PPBE, JCIDS.`,a:`Cost Assessment and Program Evaluation; Planning, Programming, Budgeting and Execution; Joint Capabilities Integration and Development System.`},
 {t:`recall`,q:`What does each letter of DOTmLPF-P stand for?`,a:`Doctrine, Organization, Training, materiel, Leadership & education, Personnel, Facilities, Policy.`}
]}
]},
/* ============================== UNIT 3 ============================== */
{id:`U3`,title:`Money`,sub:`Authorization vs. appropriation, the colors of money, and PPBE`,lessons:[
{id:`L31`,title:`Permission vs. money`,sub:`What the NDAA does, and what only an appropriation can do`,mins:6,slides:`Slides 9, 15`,steps:[
 {t:`story`,h:`The permission slip and the check`,b:`<p>Your program office gets good news: the new NDAA authorizes 12 more missiles. The program manager wants to sign the contract tomorrow. The comptroller says no.</p><p>Who’s right?</p>`},
 {t:`teach`,h:`Congress uses two different kinds of laws`,fig:`ndaa`,slide:`Slide 15`,b:`<p>The Constitution gives Congress the power of the purse, and it uses two separate kinds of bills:</p><p><b>Authorization</b> (the National Defense Authorization Act, NDAA) gives <i>permission</i>. It creates and changes programs, sets policy, authorizes quantities and directs oversight. By itself it provides no money.</p><p><b>Appropriation</b> (the defense appropriations act) provides the <i>money</i>: legal budget authority to sign contracts and pay bills.</p>`},
 {t:`memo`,h:`Hook`,big:`NDAA = the permission slip. Appropriation = the check.`,b:`A permission slip without a check buys nothing. Back to the story: the comptroller is right. Until the appropriation is enacted, there is no money to obligate.`},
 {t:`sort`,k:`k_authapp k_ndaaaegis`,q:`Which law does each one?`,bins:[`NDAA (authorization)`,`Appropriations act`],items:[[`Authorizes procurement quantities`,0],[`Provides budget authority to sign contracts`,1],[`Directs testing requirements and DOT&E oversight`,0],[`Splits money into accounts like SCN and WPN`,1],[`Creates or modifies acquisition pathways`,0],[`Sets how long money stays available to obligate`,1],[`Imposes reporting requirements on a program`,0],[`Establishes acquisition authorities`,0]],why:`Slide 15’s list is all NDAA: authorities, testing, reporting, quantities, pathways, DOT&E oversight. The appropriations act is about money: how much, for what purpose, for how long.`},
 {t:`teach`,h:`Why the NDAA matters so much right now`,slide:`Slides 14, 15`,b:`<p>Congress has passed an NDAA every year for more than six decades, and it’s where Congress rewrites the rules. The whole reform in this course came through NDAA language: FY24 NDAA §811 ordered the review, and the FY26 NDAA (signed December 18, 2025) carried the House SPEED Act and Senate FoRGED Act reforms.</p><p>For a program like Aegis, the NDAA can direct tests, require reports to Congress, set how many ships or missiles are authorized, and put DOT&E in the oversight loop.</p>`},
 {t:`mc`,k:`k_authapp`,q:`The NDAA authorizes 12 more missiles, but the appropriation hasn’t been enacted. What can the program do?`,o:[`Sign the contract; authorization is enough`,`Wait. Authorization is permission, not money`,`Use O&M money instead`,`Ask the JROC to fund it`],a:1,why:`Without an appropriation there is no budget authority. Using the wrong money (like O&M for missiles) would break the purpose rule in the next lesson.`},
 {t:`key`,h:`Authorization vs. appropriation (Slides 9, 15)`,k:`k_authapp k_ndaaaegis`,b:`<ul><li><b>NDAA = permission.</b> Authorities, policy, quantities, testing, reporting, pathways, DOT&E oversight.</li><li><b>Appropriations act = money.</b> Budget authority, split by purpose, with time limits.</li></ul>`,prof:`You must know the difference between appropriations and authorizations, and the appropriations SCN, O&M,N, WPN and MPN.`}
],review:[
 {t:`recall`,k:`k_authapp`,q:`What is the difference between an authorization and an appropriation?`,a:`An authorization (NDAA) gives permission: it creates or changes programs, authorities, quantities, and testing and reporting requirements. An appropriation provides the money: budget authority to obligate and spend, for a specific purpose and period.`},
 {t:`recall`,k:`k_ndaaaegis`,q:`Name four things the NDAA often does for a Navy program like Aegis (Slide 15).`,a:`Any four: establishes acquisition authorities; directs testing requirements; imposes reporting requirements; authorizes procurement quantities; creates or modifies acquisition pathways; directs oversight by organizations such as DOT&E.`},
 {t:`tf`,k:`k_authapp`,q:`The NDAA, by itself, gives a program money it can put on contract.`,a:false,why:`NDAA = permission. Appropriations act = money.`}
]},
{id:`L32`,title:`The colors of money`,sub:`MPN, O&M,N, RDT&E, WPN, OPN, APN, SCN and their clocks`,mins:9,slides:`Slide 10`,steps:[
 {t:`teach`,h:`Why money has colors`,slide:`Slide 10`,b:`<p>Congress doesn’t hand the Navy one big pot. It appropriates separate accounts, each for a specific <b>purpose</b>: paying people, operating the fleet, research, buying weapons, building ships. These are the <span class="term">colors of money</span>.</p><p>Three rules govern every color:</p><ul><li><b>Purpose:</b> spend it only on what it was appropriated for.</li><li><b>Time:</b> obligate it only during its period of availability.</li><li><b>Amount:</b> never obligate more than you have (the Antideficiency Act).</li></ul>`},
 {t:`predict`,q:`Which stays available longer: money to pay sailors, or money to build a destroyer?`,o:[`Sailor pay`,`Ship construction`,`They’re the same`],a:1,why:`Building a ship takes years of design, contracting and long-lead material, so ship money (SCN) is available to obligate for 5 years. Sailors are paid every two weeks, so personnel money (MPN) lasts 1 year. The period roughly matches how long it takes to put that kind of thing on contract.`},
 {t:`teach`,h:`The seven Navy colors on Slide 10`,fig:`money`,b:`<p>Each bar is the number of fiscal years that appropriation is available for <b>new obligations</b>.</p>`},
 {t:`memo`,h:`Hook`,big:`1, 1, 2, 3, 5`,b:`<p>Those are the first numbers of the Fibonacci sequence. Walk the life of a capability:</p><ul><li><b>Pay</b> the people: MPN, 1</li><li><b>Operate</b> the fleet: O&M,N, 1</li><li><b>Research</b> the new thing: RDT&E,N, 2</li><li><b>Procure</b> the gear: WPN, OPN, APN, 3</li><li><b>Ships</b> take longest: SCN, 5</li></ul>`},
 {t:`match`,k:`k_colors`,q:`Match each appropriation to its years available.`,pairs:[[`MPN`,`1 year`],[`RDT&E,N`,`2 years`],[`WPN`,`3 years`],[`SCN`,`5 years`]],why:`O&M,N is also 1 year. OPN and APN are 3, like WPN.`},
 {t:`sort`,k:`k_colors`,q:`Which color pays for it?`,bins:[`MPN`,`O&M,N`,`RDT&E,N`,`WPN`,`SCN`,`OPN / APN`],items:[[`Sailors’ base pay`,0],[`Fuel and spare parts for a deployment`,1],[`Pier-side ship maintenance`,1],[`Developing a new Aegis software baseline`,2],[`Testing a prototype radar`,2],[`Buying SM-6 missiles`,3],[`Buying Tomahawks`,3],[`Building a new DDG`,4],[`Buying shipboard communications equipment`,5,`Equipment not bought elsewhere is Other Procurement (OPN)`],[`Buying MH-60R helicopters`,5,`Aircraft are Aircraft Procurement (APN)`]],why:`Purpose follows the thing being bought: people, operations, development, weapons, ships, or other equipment and aircraft.`},
 {t:`teach`,h:`What happens when the clock runs out`,fig:`lifecycle`,b:`<p>When the period of availability ends, the money <b>expires</b>. For five more years it can only adjust and pay obligations made in time; it can’t start anything new. After that it is <b>cancelled</b> and gone for every purpose.</p><p>The fiscal year ends September 30. That’s why commands rush to obligate one-year O&M money in September.</p>`},
 {t:`mc`,k:`k_colors`,q:`It’s October 15, 2026 (FY2027). Your command still has FY2026 O&M,N. Can it sign a new contract with it?`,o:[`Yes, O&M is good for 2 years`,`No. It was 1-year money and expired September 30, 2026`,`Only for ships`],a:1,why:`FY2026 O&M,N was available October 1, 2025 to September 30, 2026. Now it’s expired: no new obligations.`},
 {t:`mc`,k:`k_colors`,q:`FY2026 WPN. Last day to put it on a new contract?`,o:[`Sep 30, 2026`,`Sep 30, 2027`,`Sep 30, 2028`,`Sep 30, 2030`],a:2,fixed:true,why:`WPN is 3-year money: FY2026, FY2027, FY2028. It expires after September 30, 2028.`},
 {t:`tf`,q:`A program with leftover RDT&E money can use it to buy production missiles.`,a:false,why:`That breaks the purpose rule. Production quantities are procurement (WPN). Moving money between colors generally needs congressional reprogramming approval.`},
 {t:`key`,h:`Common Navy colors of money (Slide 10)`,k:`k_colors`,b:`<div class="tblwrap"><table class="tbl"><tr><th>Appropriation</th><th>Years</th></tr><tr><td>Military Personnel, Navy (MPN)</td><td><b>1</b></td></tr><tr><td>Operation & Maintenance, Navy (O&M,N)</td><td><b>1</b></td></tr><tr><td>RDT&E, Navy</td><td><b>2</b></td></tr><tr><td>Weapons Procurement, Navy (WPN)</td><td><b>3</b></td></tr><tr><td>Other Procurement, Navy (OPN)</td><td><b>3</b></td></tr><tr><td>Aircraft Procurement, Navy (APN)</td><td><b>3</b></td></tr><tr><td>Shipbuilding & Conversion, Navy (SCN)</td><td><b>5</b></td></tr></table></div>`,prof:`Know how long SCN, MPN, O&M,N and WPN are good for: 5, 1, 1 and 3 years.`}
],review:[
 {t:`type`,k:`k_colors`,q:`How many years is SCN available for obligation?`,accept:[`5`,`five`,`5 years`,`five years`]},
 {t:`type`,k:`k_colors`,q:`How many years is WPN available for obligation?`,accept:[`3`,`three`,`3 years`,`three years`]},
 {t:`type`,k:`k_colors`,q:`How many years is MPN available for obligation?`,accept:[`1`,`one`,`1 year`,`one year`]},
 {t:`type`,k:`k_colors`,q:`How many years is O&M,N available for obligation?`,accept:[`1`,`one`,`1 year`,`one year`]},
 {t:`type`,k:`k_colors`,q:`How many years is RDT&E,N available for obligation?`,accept:[`2`,`two`,`2 years`,`two years`]},
 {t:`mc`,k:`k_colors`,q:`Which appropriation builds new ships?`,o:[`OPN`,`SCN`,`WPN`,`O&M,N`],a:1,why:`Shipbuilding and Conversion, Navy: 5 years.`},
 {t:`recall`,q:`What three rules govern every appropriation?`,a:`Purpose (use it only for what it was appropriated for), Time (obligate it only within its period of availability), Amount (never obligate more than is available: the Antideficiency Act).`}
]},
{id:`L33`,title:`PPBE, the calendar machine`,sub:`Four phases, who leads them, and the PBR you’ll need later`,mins:5,slides:`Slide 9`,steps:[
 {t:`teach`,h:`Why PPBE is “calendar-driven”`,fig:`ppbe`,b:`<p>Secretary McNamara created the Planning, Programming and Budgeting System in 1961 to tie strategy to budgets. It became PPBE in 2003. Because Congress appropriates by fiscal year, the Department builds a budget on a fixed annual schedule, and since a new cycle starts every year, several budget years are in motion at once.</p>`},
 {t:`match`,k:`k_oversight`,q:`Match each phase to who leads it.`,pairs:[[`Planning`,`USW(Policy)`],[`Programming`,`Director, CAPE`],[`Budgeting`,`USW(Comptroller)`],[`Execution`,`The Components`]],why:`That’s why Slide 9 lists USW(C) and Director CAPE as PPBE oversight: they own programming and budgeting.`},
 {t:`teach`,h:`Three words you’ll need later`,b:`<ul><li><b>POM</b> (Program Objective Memorandum): each Service’s 5-year funding plan.</li><li><b>FYDP</b> (Future Years Defense Program): the Department’s 5-year plan of record.</li><li><b>PBR</b> (Program and Budget Review): the fall review where OSD adjusts the Services’ POMs and budget estimates. Remember this one: the new RRAB decides in sync with the PBR, and the JAR money is allocated there.</li></ul>`},
 {t:`mc`,k:`k_cpm k_rrab`,q:`The new Requirements and Resourcing Alignment Board (RRAB) picks 1–2 joint problems each cycle. Which PPBE event is it synchronized with?`,o:[`Planning`,`The Program and Budget Review (PBR)`,`Execution`,`The NDAA markup`],a:1,why:`The RRAB pushes requirements decisions straight into the budget build, so it works in sync with the PBR.`},
 {t:`key`,h:`PPBE in one card`,k:`k_oversight`,b:`<p>Calendar-driven. Planning (Policy) → Programming (CAPE: POMs, FYDP, PBR) → Budgeting (Comptroller → President’s Budget, usually in February) → Execution (Components). Slide 9 oversight: USW(C) and Director CAPE. Directive: DoDD 7045.14.</p>`}
],review:[
 {t:`recall`,k:`k_oversight`,q:`Name the four phases of PPBE, and say who leads Programming and who leads Budgeting.`,a:`Planning, Programming, Budgeting, Execution. Programming is led by the Director of CAPE; Budgeting by USW(Comptroller).`},
 {t:`mc`,q:`What is the POM?`,o:[`A Service’s 5-year funding plan`,`The President’s Budget`,`A requirements document`,`A test report`],a:0,why:`Program Objective Memorandum.`}
]}
]},

{id:`U4`,title:`Why JCIDS died`,sub:`What it was, its fatal flaws, who ordered the fix, and the new rulebook`,lessons:[
{id:`L41`,title:`What JCIDS was meant to fix`,sub:`From Service wish lists to joint capabilities, 2003`,mins:5,slides:`Slides 9, 21`,steps:[
 {t:`teach`,h:`Before JCIDS: every Service for itself`,b:`<p>Before 2003 each Service generated its own requirements. The result: redundant systems, equipment that couldn’t talk to the other Services’ equipment, and joint needs that nobody owned.</p><p>In 2002–2003 Secretary Rumsfeld’s Pentagon replaced that Requirements Generation System with <b>JCIDS</b>, the Joint Capabilities Integration and Development System. It was capabilities-based: start from the gaps combatant commanders face, look at them jointly, and consider non-materiel fixes before buying anything.</p>`},
 {t:`teach`,h:`How JCIDS worked`,fig:`docs`,b:`<p>A sponsor wrote an ICD describing a gap, then a CDD with performance attributes, then a CPD for production. A Joint Staff J-8 gatekeeper routed documents to Functional Capabilities Boards, then the Joint Capabilities Board and the <b>JROC</b>, which validated them. Validated documents fed acquisition Milestones A, B and C.</p>`},
 {t:`predict`,q:`JCIDS had good intentions: jointness, no duplication, non-materiel first. What do you predict went wrong?`,o:[`It was too fast and skipped analysis`,`Documents piled up in review, and the process became the product`,`Combatant commanders had too much power`],a:1,why:`Each document passed through layers of review and comment adjudication. Over two decades the process itself became the measure of success. The next lesson names the three fatal flaws.`},
 {t:`tf`,q:`JCIDS replaced a Service-centric system and was designed to improve jointness and interoperability.`,a:true,why:`That’s why its name says “Joint” and “Integration.” The 2025 reforms react to how it performed, not to its goals.`}
],review:[
 {t:`recall`,q:`What did JCIDS replace in 2003, and what was it meant to fix?`,a:`The Service-centric Requirements Generation System. JCIDS was meant to make requirements joint and capabilities-based: reduce redundancy, improve interoperability, prioritize joint needs and consider non-materiel solutions.`}
]},
{id:`L42`,title:`The three fatal flaws`,sub:`Timeline mismatch, perfect solution fallacy, compliance trap`,mins:9,slides:`Slides 11–13`,steps:[
 {t:`teach`,h:`The official autopsy`,slide:`Slide 11`,b:`<p>In January 2026 the Joint Staff J-8 briefed why JCIDS was replaced, citing “numerous well-documented failures.” Your professor says to reproduce these with precision, not paraphrase them loosely, and to quote the source if challenged: it’s the official Joint Staff diagnosis, not editorial.</p>`},
 {t:`teach`,h:`Flaw 1: Timeline mismatch`,b:`<p>A JCIDS document was supposed to take <b>40–100 days</b>. On average it took about <b>300 days</b>, nearly a year, before a program could even begin acquisition. Major capability acquisitions averaged <b>12+ years</b> to deliver.</p><p>Ask what happens to threat data in a year, or to a technology landscape. The system optimized for completeness, not relevance.</p>`},
 {t:`type`,k:`k_numbers`,q:`JCIDS documents were nominally 40–100 days. What was the actual average, in days?`,accept:[`300`,`300 days`,`about 300`,`approximately 300`,`~300`],why:`About 300 days, nearly a full year per document.`},
 {t:`teach`,h:`Flaw 2: The perfect solution fallacy`,b:`<p>JCIDS waited for a complete, flawless capability definition before approval. But it was a snapshot-based system in a dynamic threat environment. By the time a compliant CDD was approved, the threat it described had moved on.</p><p>The perfect solution on paper arrived too late to be the perfect solution in the field: building for yesterday’s problem.</p>`},
 {t:`teach`,h:`Flaw 3: The compliance trap`,b:`<p>The most cultural of the three. Success was measured by whether documents were formatted correctly and certifications obtained, not by whether the warfighter got a capable system. “Was the format correct?” replaced “Does it work?”</p><p>Whole staffs became experts in compliance theater. The paperwork was perfect; the warfighter stayed unequipped.</p>`},
 {t:`match`,k:`k_flaws`,q:`Match each flaw to its bureaucratic symptom.`,pairs:[[`Timeline mismatch`,`40–100 days nominal, ≈300 actual`],[`Perfect solution fallacy`,`Waiting for a complete, flawless capability before approval`],[`Compliance trap`,`Paperwork polished solely for document survival`]],why:`Slide 12’s table, first two columns.`},
