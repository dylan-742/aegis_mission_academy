 {t:`match`,k:`k_flaws`,q:`Now match each flaw to its operational consequence.`,pairs:[[`Timeline mismatch`,`Too slow to keep up with the threat`],[`Perfect solution fallacy`,`Threat evolves past the solution`],[`Compliance trap`,`Perfect paperwork, unequipped warfighter`]],why:`Slide 12’s right-hand column.`},
 {t:`memo`,h:`Hook`,big:`Slow. Stale. Shiny.`,b:`<b>Slow</b>: timeline mismatch. <b>Stale</b>: the “perfect” solution is out of date on arrival. <b>Shiny</b>: polished paperwork with nothing behind it, the compliance trap.`},
 {t:`teach`,h:`The other fatal flaws (Slide 13)`,slide:`Slide 13`,b:`<ul><li><b>Not threat-informed:</b> a bottom-up checklist validating individual Service documents, not anchored to real, current and evolving adversary threats.</li><li><b>Not concept-based:</b> a document-production machine (ICD, CDD, CPD) not tied to a coherent concept of how the future Joint Force would fight.</li><li><b>Not resource-aware:</b> perhaps the most damaging. Requirements could be validated with no binding connection to whether they could be funded or built in time.</li></ul>`},
 {t:`teach`,h:`The counterexample: FFG-7`,b:`<p>The <i>Oliver Hazard Perry</i>-class frigate was <b>designed to cost</b>. The Navy set hard limits on size and unit cost up front so it could buy enough ships, and accepted trade-offs (a single shaft, thin growth margins) to stay inside them. Your professor notes the last ship was delivered millions under budget and at least a year ahead of schedule.</p><p>That’s what resource-aware looks like. The slide names the tension: <b>“Perfect is the enemy of good enough”</b> vs. <b>“Haste makes waste.”</b></p>`},
 {t:`mc`,k:`k_other`,q:`Which of JCIDS’s “other” flaws was perhaps the most damaging, and which ship class shows what the fix looks like?`,o:[`Not threat-informed; DDG-51`,`Not resource-aware; FFG-7 (designed to cost)`,`Not concept-based; LCS`,`Compliance trap; CG-47`],a:1,why:`Requirements were validated with no binding link to the budget. FFG-7 did the opposite: cost was a design requirement.`},
 {t:`predict`,q:`Your professor says the new JFRP and WAS should be tested against the same flaw criteria. What’s his point?`,o:[`The new system is already proven`,`Renaming a process doesn’t cure these flaws; any process can become slow, stale and compliance-driven`,`JCIDS should come back`],a:1,why:`His note on Slide 12: “Note how these flaws are the same as the previous slide… What’s that tell you?!” These are recurring failure modes of bureaucracy, not features unique to JCIDS. Judge the new system by the same standard.`},
 {t:`key`,h:`Why JCIDS was replaced (Slides 11–13)`,k:`k_flaws k_numbers k_other`,b:`<ol><li><b>Timeline mismatch:</b> 40–100 days nominal vs ≈300 actual per document; 12+ years average major capability delivery → too slow for the threat.</li><li><b>Perfect solution fallacy:</b> waiting for a flawless solution → the threat evolves past it.</li><li><b>Compliance trap:</b> format over function → perfect paperwork, unequipped warfighter.</li></ol><p>Other flaws: not threat-informed, not concept-based, not resource-aware (most damaging). FFG-7 = designed to cost.</p>`,prof:`Not all programs suffered these flaws. Great programs like Aegis and Missile Defense stay on top of the threat. Remember: on defense it’s impossible to get ahead of the threat; on offense it’s possible.`},
 {t:`explain`,k:`k_flaws`,slide:`Slide 12`,q:`Explain in plain language why JCIDS was replaced, naming all three fatal flaws and their operational consequences.`,points:[`Timeline mismatch: documents took about 300 days vs 40–100 nominal (12+ years to deliver), too slow to keep pace with the threat`,`Perfect solution fallacy: waiting for a complete, flawless solution meant the threat evolved past it (building for yesterday’s problem)`,`Compliance trap: success measured by format and certifications, so the paperwork was perfect but the warfighter stayed unequipped`,`Bottom line: the process became an end in itself and could not deliver capability with the speed and urgency required`],model:`JCIDS was replaced because it couldn’t deliver capability at the speed the threat demands. First, timeline mismatch: documents meant to take 40–100 days averaged about 300, and major capabilities took 12+ years, so the process couldn’t keep up with the threat. Second, the perfect solution fallacy: it waited for a complete, flawless solution, so by approval the threat had evolved and we were building for yesterday’s problem. Third, the compliance trap: success meant correctly formatted documents and certifications, so the paperwork was perfect while the warfighter stayed unequipped.`}
],review:[
 {t:`recall`,k:`k_flaws`,q:`Name JCIDS’s three fatal flaws.`,a:`Timeline mismatch; perfect solution fallacy; compliance trap.`},
 {t:`recall`,k:`k_other`,sid:`r1b`,q:`Name JCIDS’s three “other” fatal flaws, and explain why not being resource-aware did the most damage.`,a:`Not threat-informed: a bottom-up checklist of Service documents, not anchored to real, evolving threats. Not concept-based: a document machine (ICD, CDD, CPD) not tied to how the future Joint Force would fight. Not resource-aware, perhaps the most damaging: requirements were validated with no binding link to whether they could be funded or built in time, which fed massive cost overruns and poor cost estimates. FFG-7, designed to cost, is the counterexample.`},
 {t:`type`,k:`k_numbers`,q:`Average time to deliver a major capability acquisition: ___+ years`,accept:[`12`,`twelve`,`12+`],why:`12+ years. Picture the threat by then: that is the timeline mismatch.`},
 {t:`mc`,k:`k_flaws`,q:`“Paperwork polished solely for document survival” is the symptom of which flaw?`,o:[`Timeline mismatch`,`Perfect solution fallacy`,`Compliance trap`,`Not resource-aware`],a:2,why:`Compliance trap: perfect paperwork, unequipped warfighter.`},
 {t:`tf`,k:`k_other`,q:`According to the professor, every program under JCIDS suffered these fatal flaws.`,a:false,why:`Not all. Aegis and Missile Defense stayed on top of the threat.`}
]},
{id:`L43`,title:`Congress and the President step in`,sub:`§811, the EO, the JRWG sprint, the 6 key actions, FoRGED and SPEED`,mins:9,slides:`Slide 14`,steps:[
 {t:`teach`,h:`Step one to fixing a broken process`,fig:`reform`,slide:`Slide 14`,b:`<p>Your professor’s takeaway on Slide 14: if JCIDS was this flawed, step one was high-level direction. The executive branch (DoW) drove change together with Congress. Here’s the chain of events.</p>`},
 {t:`order`,k:`k_congress`,q:`Put the reform milestones in order. Each one set up the next.`,items:[`FY24 NDAA §811 orders a requirements review`,`Executive Order 14265 orders a JCIDS review in 180 days`,`JRWG runs a 49-day sprint`,`20 Aug 2025 memo directs 6 key actions`,`FY26 NDAA is signed`,`JFRP Charter and Manual are published`],why:`Congress ordered a review (§811, 2023) → the President set a 180-day deadline (EO 14265, April 2025) → the JRWG did the work in a 49-day sprint (May 2025) → the result was the 20 Aug 2025 memo’s six actions → Congress legislated reform in the FY26 NDAA (December 2025) → the Joint Staff published the new Charter and Manual (January 2026). Your professor’s takeaway: fixing JCIDS took direction from the very top.`},
 {t:`teach`,h:`The Joint Requirements Working Group`,b:`<ul><li>Led by a DW Senior Advisor</li><li>A <b>49-day sprint</b> beginning in May 2025</li><li>Considered <b>3 courses of action</b></li><li>Accelerated its submission by 90 days to influence FY26 NDAA efforts to revise 10 U.S.C. §181 (the JROC’s authorities)</li></ul><p>It organized the reform into <b>four lines of effort</b>.</p>`},
 {t:`memo`,h:`Four lines of effort`,big:`Design · Prioritize · Fund · Integrate`,b:`<ol><li><b>Joint Force Design</b></li><li><b>Integrate Priorities & Resources</b></li><li><b>Fund Proven Solutions</b></li><li><b>Integrate Joint Solutions</b></li></ol><p>It reads like a plan: design the future force, line up priorities with money, pay for what works, make it work together.</p>`},
 {t:`match`,k:`k_loe`,sid:`loe2`,q:`Match each line of effort to what it’s about.`,pairs:[[`Joint Force Design`,`Blueprint the future force around the top joint problems`],[`Integrate Priorities & Resources`,`Tie what the JROC ranks highest to the budget`],[`Fund Proven Solutions`,`Pay for answers that have shown they deliver`],[`Integrate Joint Solutions`,`Make each Service’s answers interoperate across the force`]],why:`Design the future force, line up priorities with money, pay for what works, make it work together.`},
 {t:`teach`,h:`The 20 Aug 2025 memo: six key actions`,b:`<ol><li><b>Reorient the JROC, sunset JCIDS, and cease validating Component-level requirements documents</b></li><li><b>Establish the RRAB</b> (Requirements and Resourcing Alignment Board)</li><li><b>Establish MEIA</b> (Mission Engineering and Integration Activity)</li><li><b>Establish the JAR</b> (Joint Acceleration Reserve)</li><li><b>Update the CPM DoDD and publish a new DoDI</b> (Capability Portfolio Management)</li><li><b>Drive Service requirements reform</b></li></ol>`},
 {t:`memo`,h:`Hook for the six actions`,big:`Joint Requirements Must Justify Combat Spending`,b:`<b>J</b>ROC reoriented (JCIDS sunset) · <b>R</b>RAB · <b>M</b>EIA · <b>J</b>AR · <b>C</b>PM directive · <b>S</b>ervice reform. The sentence is also the point of the reform: tie requirements to money.`},
 {t:`match`,k:`k_6actions`,sid:`act2`,q:`Match each key action to what it does.`,pairs:[[`Reorient JROC, sunset JCIDS`,`Ends JROC document gatekeeping; the JROC works joint problems instead`],[`Establish the RRAB`,`A senior board that ties money to the top joint problems each budget cycle`],[`Establish MEIA`,`Mission engineering, experiments and industry work to find what works`],[`Establish the JAR`,`A reserve of money held back to speed solutions to joint problems`],[`Update CPM DoDD, new DoDI`,`Manage capabilities as portfolios, not program by program`],[`Drive Service reform`,`Services fix their own processes, since they now approve their own requirements`]],why:`Joint Requirements Must Justify Combat Spending (J-R-M-J-C-S). Every action pushes the same way: tie requirements to real problems and real money.`},
 {t:`mc`,k:`k_6actions k_other`,sid:`act3`,ins:true,q:`Why does the memo create the RRAB and the JAR in the same breath as reorienting the JROC?`,o:[`To give the JROC command authority over the Services`,`JCIDS wasn’t resource-aware; the RRAB and JAR tie the JROC’s top problems to actual money`,`To replace PPBE with a new budget system`,`Because Congress eliminated the Comptroller’s role`],a:1,why:`A ranked list of joint problems means nothing if no money follows it. The RRAB decides resourcing for the top JOPs at the Program and Budget Review, and the JAR is the money it allocates.`},
 {t:`teach`,h:`Congress’s two bills`,b:`<p><b>FoRGED Act</b> (Senate Armed Services): five principles: cut red tape, unleash American innovation, create competitive pressure, enable decisive action, modernize defense budgeting. It proposed overhauling the JROC into a Joint Requirements and Programming Board (JRPB).</p><p><b>SPEED Act</b> (House Armed Services): five pillars: align acquisition to warfighting priorities and outcomes, accelerate the requirements process, balance regulation and efficiency, strengthen the defense industrial base, develop a mission-oriented acquisition workforce. It proposed a Joint Requirements Council (JRC) and a Requirements, Acquisition, and Programming Directorate (RAPID).</p><p>Both significantly revised 10 U.S.C. §181, and their ideas fed the FY26 NDAA, signed December 18, 2025.</p>`},
 {t:`match`,k:`k_congress`,q:`Match each source of direction to what it did.`,pairs:[[`FoRGED Act`,`Senate (SASC) · JRPB · 5 principles`],[`SPEED Act`,`House (HASC) · JRC and RAPID · 5 pillars`],[`FY24 NDAA §811`,`Ordered the review; reorient the JROC`],[`EO 14265 §7`,`President: review JCIDS within 180 days`]]},
 {t:`key`,h:`Why requirements reform? Congress & POTUS direction (Slide 14)`,k:`k_congress k_loe k_6actions`,b:`<ul><li>FY24 NDAA §811 → reorient the JROC on JFD, JCI, CCMD requirements, CPM.</li><li>EO 14265 §7 → comprehensive JCIDS review within 180 days.</li><li>JRWG: DW senior advisor · 49-day sprint (May ’25) · 3 COAs · accelerated 90 days.</li><li><b>4 lines of effort:</b> Joint Force Design · Integrate Priorities & Resources · Fund Proven Solutions · Integrate Joint Solutions.</li><li><b>20 Aug 2025 memo, 6 key actions:</b> reorient JROC / sunset JCIDS / stop Component validation · RRAB · MEIA · JAR · update CPM DoDD + new DoDI · Service requirements reform.</li><li>FoRGED (SASC, JRPB) and SPEED (HASC, JRC + RAPID) → FY26 NDAA.</li></ul>`,prof:`Know the 4 lines of effort and the 6 key actions on the right-hand side of the slide. Remember NDAA = National Defense Authorization Act.`}
],review:[
 {t:`recall`,k:`k_loe`,sid:`r0b`,q:`List the JRWG’s four lines of effort, and say what each one is about.`,a:`Joint Force Design: blueprint the future force around the top joint problems. Integrate Priorities & Resources: tie the JROC’s top priorities to the budget. Fund Proven Solutions: pay for answers that have shown they deliver. Integrate Joint Solutions: make the Services’ answers work together.`},
 {t:`recall`,k:`k_6actions`,sid:`r1b`,q:`List the six key actions of the 20 Aug 2025 memo, and say what each one does.`,a:`1) Reorient the JROC, sunset JCIDS and stop validating Component-level documents: the JROC stops gatekeeping and works joint problems. 2) Establish the RRAB: a senior board (VCJCS and Deputy Secretary of War) that ties resourcing to the top JOPs. 3) Establish MEIA: mission engineering, experimentation and industry engagement to find solutions. 4) Establish the JAR: withheld money that accelerates solutions to JOPs. 5) Update the CPM DoDD and publish a new DoDI: manage capabilities as portfolios. 6) Drive Service requirements reform: the Services fix their own processes.`},
 {t:`mc`,k:`k_congress`,sid:`r2b`,q:`Your professor’s takeaway on the reform: if JCIDS was so flawed, what was step one to fixing it?`,o:[`Let each Service write its own replacement process`,`High-level direction: Congress and the executive branch (DoW) directing change together`,`Wait for the next National Defense Strategy`,`Rename JCIDS and keep the same process`],a:1,why:`An entrenched process doesn’t fix itself. FY24 NDAA §811 ordered the review, the President’s EO set a deadline, and DoW drove the change together with Congress.`},
 {t:`mc`,k:`k_congress`,sid:`r3b`,q:`What did the Senate’s FoRGED Act and the House’s SPEED Act have in common?`,o:[`Both moved requirements to the Comptroller`,`Both proposed significantly revising 10 U.S.C. §181, the JROC’s authorities`,`Both created the JAR`,`Both cancelled PPBE`],a:1,why:`FoRGED would restructure the JROC into a JRPB; SPEED would create a JRC and RAPID. Both built on the reorient-the-JROC foundation, and their ideas fed the FY26 NDAA.`},
 {t:`tf`,k:`k_6actions`,q:`Ceasing JROC validation of Component-level requirements documents is one of the 6 key actions.`,a:true,why:`It’s part of action 1, with reorienting the JROC and sunsetting JCIDS.`}
]},
{id:`L44`,title:`The new rulebook`,sub:`Charter vs. Manual, the enclosures, guiding principles, what survives`,mins:8,slides:`Slides 17–22`,steps:[
 {t:`teach`,h:`Two documents replace JCIDS`,slide:`Slide 17`,b:`<p><b>CJCSI 5123.01J, the Charter</b> (15 Jan 2026; Change 1 on 5 Aug 2026): the high-level description of the organization and process, roles and responsibilities. Short.</p><p><b>CJCSM 5123.01A, the Manual</b> (5 Aug 2026; the first version was 15 Jan 2026): how the bureaucracy of joint force requirements actually works. All the details.</p>`},
 {t:`memo`,h:`Hook`,big:`I = Instruction = charter. M = Manual = mechanics.`,b:`CJCS<b>I</b> is the short charter that sets up the organization. CJCS<b>M</b> is the manual with the step-by-step mechanics.`},
 {t:`mc`,k:`k_chartman`,q:`Where would you look for the detailed staffing steps of a JCI review?`,o:[`CJCSI 5123.01J (Charter)`,`CJCSM 5123.01A (Manual)`,`DoDD 7045.14`,`10 U.S.C. §114`],a:1,why:`Details live in the Manual. The Charter is high-level.`},
 {t:`teach`,h:`Why so much paperwork remains`,b:`<p>Your professor’s note: look at the Manual’s details and you’ll still find lots of paperwork and administration. Why? Because thousands of Pentagon billets are essentially paperwork administrators, not the people who can actually accelerate acquisition: contracting officers, budget analysts, intelligence officers and systems engineers.</p>`},
 {t:`explore`,h:`What’s inside the Manual`,fig:`enclosures`,slide:`Slide 18`,spots:[[`Enclosure A`,`The process itself: intent and guiding principles, JOPs, Joint Force Design, Joint Capability Integration, Combatant Command requirements, Capability Portfolio Management.`],[`Enclosure B`,`Governance and staffing.`],[`Enclosure C`,`Joint requirements documents.`],[`Enclosure D`,`Joint Capability Areas, metrics, digital tools, data governance, training.`],[`Enclosure E`,`Integration: Service/Component requirements, the Intelligence Community, MEIA, resourcing, allies and partners.`]]},
 {t:`mc`,k:`k_encl k_chartman`,sid:`pg2`,q:`The new Charter and Manual cut about 520 pages to about 150. Your professor still expects plenty of paperwork. Why?`,o:[`The page cut applied only to the Charter, so the Manual keeps the old detail`,`Pentagon billets are built around paperwork, not the contracting, budget, intelligence and engineering experts who speed acquisition`,`Congress requires every requirement to be documented in full before funding`,`The JROC still validates every Service document under the new rules`],a:1,why:`Shorter rules don’t change who is doing the work. Acceleration comes from the people who buy, budget, assess threats and engineer.`},
 {t:`teach`,h:`Nine guiding principles (Slide 19)`,slide:`Slide 19`,b:`<p>The JROC Chair set first principles for the reform:</p><ol><li>Deliver capability to warfighters at speed / cut red tape</li><li>Preserve the independent warfighter voice</li><li>Align strategy to budget with analytic due diligence</li><li>Drive Joint Force design, development and integration in four dimensions</li><li>Integrate globally across the combatant commands</li><li>Balance near-term and future (beyond FYDP) needs</li><li>Support the breadth of innovative technologies and MDAPs</li><li>Address all elements of DOTmLPF-P</li><li>Align authorities to responsibilities and ensure accountability</li></ol>`},
 {t:`predict`,q:`Your professor calls “preserve the independent warfighter voice” somewhat of a fallacy. Why?`,o:[`Warfighters have never had a say`,`In the Navy, warfighters have had a say for decades; the real problem was requirements outrunning resources and a system that couldn’t deliver at speed and volume`,`The JROC has no warfighters on it`],a:1,why:`Warfighter requirements often exceeded resources (an ends-ways-means disconnect), and the system couldn’t deliver at the speed and volume needed for current threats. He also warns that driving joint solutions will get harder as the JROC loses its oversight, coordination and integration role.`},
 {t:`teach`,h:`JCIDS isn’t totally dead (Slide 20)`,slide:`Slide 20`,b:`<ul><li>Manual effective upon release (5 Aug 2026); revision planned one year after publication.</li><li>The 2021 JCIDS Manual is cancelled.</li><li><b>Previously validated JROC requirements remain validated</b>, and previously signed JROC Memorandums (JROCMs) remain in effect.</li><li>Sponsors may request relief from JROCM tasks and comebacks through J-8’s Deputy Director for Requirements and Capability Development (DDRCD).</li></ul>`},
 {t:`tf`,k:`k_notdead`,q:`When JCIDS was cancelled, every previously validated requirement had to be re-validated under the JFRP.`,a:false,why:`Previously validated JROC requirements remain validated and signed JROCMs remain in effect. Relief is requested through J-8/DDRCD.`},
 {t:`key`,h:`Charter, Manual, and what survives (Slides 17–22)`,k:`k_chartman k_encl k_notdead k_principles`,b:`<ul><li><b>Charter = CJCSI 5123.01J:</b> high-level organization, process and roles (formerly JCIDS).</li><li><b>Manual = CJCSM 5123.01A:</b> how the bureaucracy works. Enclosures A (process) · B (governance/staffing) · C (documents) · D (JCAs, metrics, tools, data, training) · E (integration).</li><li>520 pages → about 150.</li><li>JCIDS not totally dead: prior validations and JROCMs stand; relief via J-8/DDRCD.</li><li>Introduced by the Warfighting Acquisition University (formerly DAU) and the Joint Staff J-8.</li></ul>`,prof:`The January 2026 webinar was an early brief, but many of its concepts are still valid. Keep the POCs on Slide 22: the people will change, but the phone numbers and offices probably won’t.`}
],review:[
 {t:`recall`,k:`k_chartman`,q:`What is the difference between the JFRP Charter and the JFRP Manual? Give their document numbers.`,a:`Charter = CJCSI 5123.01J: high-level description of the organization, process, roles and responsibilities. Manual = CJCSM 5123.01A: the detailed mechanics of how the joint requirements bureaucracy works.`},
 {t:`recall`,k:`k_principles`,q:`Name at least five of the nine JROC/JFRP guiding principles.`,a:`Deliver capability at speed / cut red tape; preserve the independent warfighter voice; align strategy to budget with analytic due diligence; drive Joint Force design, development and integration in four dimensions; integrate globally across CCMDs; balance near-term and future (beyond FYDP) needs; support innovative technologies and MDAPs; address all of DOTmLPF-P; align authorities to responsibilities and ensure accountability.`},
 {t:`mc`,k:`k_encl`,sid:`r2b`,q:`The legacy JCIDS Charter and Manual ran about 520 pages; the new ones are about 150. What was the cut aimed at?`,o:[`The compliance trap: fewer format rules, only the essential information`,`Removing combatant commanders from the process`,`Ending Joint Operational Problems`,`Handing requirements writing to industry`],a:0,why:`JCIDS measured success by format and certifications. The new documents keep only essential information, and JCI accepts Service formats. Your professor’s caution: the paperwork culture remains, because Pentagon billets are built around it.`}
]}
]},
/* ============================== UNIT 5 ============================== */
{id:`U5`,title:`The JROC`,sub:`Who sits on it, what the law says it does, and how it was reoriented`,lessons:[
{id:`L51`,title:`Who sits on the JROC`,sub:`Chair, principal members, permanent advisors`,mins:8,slides:`Slide 23`,steps:[
 {t:`teach`,h:`A council set up by law`,slide:`Slide 23`,b:`<p>The Joint Requirements Oversight Council is established in statute, <b>10 U.S.C. §181</b>. It’s a statutory council to the Chairman of the Joint Chiefs, and it’s the mechanism by which the CJCS executes joint requirements.</p><p>A fact students miss: <b>the JROC has no direct authority of its own.</b> It carries the authority of its members.</p>`},
 {t:`predict`,q:`Who do you think chairs the JROC?`,o:[`The Chairman of the Joint Chiefs`,`The Vice Chairman of the Joint Chiefs (VCJCS)`,`The Secretary of War`,`USW(A&S)`],a:1,why:`The VCJCS chairs the JROC and advises the CJCS.`},
 {t:`teach`,h:`The pattern behind the membership`,fig:`jroc`,b:`<p>Don’t memorize a list. Learn the pattern.</p><p><b>Members are each Service’s uniformed #2</b>, the officer who runs the Service day to day: Vice Chief of Staff of the Army, Vice Chief of Naval Operations, Vice Chief of Staff of the Air Force, Assistant Commandant of the Marine Corps, Vice Chief of Space Operations, and now the Vice Chief of the National Guard Bureau.</p><p><b>Advisors are the people who own what the JROC doesn’t:</b> the users (Combatant Commands), the money (Comptroller, CAPE), the buying and building (A&S, R&E), the testing (DOT&E), plus Policy, Intelligence & Security, and the CIO.</p>`},
 {t:`memo`,h:`Hook`,big:`Members = the #2s. Advisors = users, money, buying, testing.`,b:`The Marine Corps exception: its #2 is the <b>Assistant Commandant</b>, not a “vice.” The newest member is the <b>Vice Chief, National Guard Bureau</b>.`},
 {t:`sort`,k:`k_jrocmem k_jrocadv k_jrocchair`,q:`Chair, principal member, or permanent principal advisor?`,bins:[`Chair`,`Member`,`Advisor`],items:[[`VCJCS`,0],[`Vice Chief of Naval Operations`,1],[`Assistant Commandant of the Marine Corps`,1],[`Vice Chief, National Guard Bureau`,1],[`Vice Chief of Space Operations`,1],[`Combatant Commands`,2],[`USW (Comptroller)`,2],[`Director, CAPE`,2],[`Director, Operational Test & Evaluation`,2],[`USW (Acquisition & Sustainment)`,2],[`DoW Chief Information Officer`,2],[`Vice Chief of Staff, Air Force`,1]],why:`Members are the uniformed #2s. Advisors are the officials who own money, buying, testing, policy, intel and IT, plus the CCMDs.`},
 {t:`teach`,h:`What changed in the 2026 Charter`,b:`<ul><li><b>Vice Chief, NGB added</b> as a principal member.</li><li><b>Stronger CCDR role:</b> “The JROC will seek and strongly consider input from Combatant Commanders in carrying out its mission. The Chair of the JROC may invite Combatant Commanders to serve as ad hoc JROC Members for topics with direct impact to their Combatant Command(s).”</li><li>Supported by the <b>Joint Capabilities Board (JCB)</b> and <b>Functional Capability Boards (FCBs)</b>.</li><li>Not intended to stand alone: it synchronizes with the JFRP Manual.</li><li>Reform will require strategic focus, active involvement in Joint Force Development and Design (JFDD), identification and prioritization of JOPs, and guidance driving CPM.</li></ul>`},
 {t:`mc`,k:`k_charter`,q:`How much independent authority does the JROC have?`,o:[`Full budget authority`,`Authority to cancel any program`,`None directly; it carries the authority of its members`,`Command authority over CCDRs`],a:2,why:`A key line on Slide 23.`},
 {t:`type`,k:`k_charter k_jrocdoes`,q:`The JROC is established in Title 10 U.S. Code, section ___.`,accept:[`181`,`§181`,`section 181`,`10 usc 181`]},
 {t:`key`,h:`JROC membership (Slide 23)`,k:`k_jrocchair k_jrocmem k_jrocadv k_charter`,b:`<p><b>Chair:</b> VCJCS (advises the CJCS).</p><p><b>Principal members (statute):</b> Vice Chief of Staff, Army · Vice CNO · Vice Chief of Staff, Air Force · Assistant Commandant, Marine Corps · Vice Chief of Space Operations · Vice Chief, NGB (new).</p><p><b>Permanent principal advisors:</b> CCMDs · USW(A&S) · USW(R&E) · USW(C) · USW(P) · USW(I&S) · Dir CAPE · DOT&E · DoW CIO. Ad hoc advisors are defined in the Charter.</p><p><b>Charter (CJCSI 5123.01J):</b> statutory council to the CJCS, synchronized with the Manual. Changes: VCNGB added; stronger CCDR voice (may join ad hoc). No direct authority. Supported by the JCB and FCBs.</p>`,prof:`You must know who chairs the JROC, who the principal members are, who the permanent advisors are, and the details at the arrows on the right of the slide.`}
],review:[
 {t:`type`,k:`k_jrocchair`,q:`Who chairs the JROC? (An abbreviation is fine.)`,accept:[`VCJCS`,`Vice Chairman of the Joint Chiefs of Staff`,`Vice Chairman`,`Vice Chairman Joint Chiefs`,`Vice Chairman of the Joint Chiefs`]},
 {t:`recall`,k:`k_jrocmem`,q:`List the six JROC principal members.`,a:`Vice Chief of Staff of the Army; Vice Chief of Naval Operations; Vice Chief of Staff of the Air Force; Assistant Commandant of the Marine Corps; Vice Chief of Space Operations; Vice Chief of the National Guard Bureau.`},
 {t:`recall`,k:`k_jrocadv`,q:`List the nine JROC permanent principal advisors.`,a:`Combatant Commands; USW(A&S); USW(R&E); USW(Comptroller); USW(Policy); USW(Intelligence & Security); Director, CAPE; Director, Operational Test & Evaluation; DoW Chief Information Officer.`},
 {t:`mc`,k:`k_charter`,q:`Which member was newly added as a JROC principal member?`,o:[`Vice Chief of Space Operations`,`Vice Chief, National Guard Bureau`,`Director, CAPE`,`Commander, USINDOPACOM`],a:1,why:`The Vice Chief of the NGB.`},
 {t:`mc`,k:`k_charter`,q:`Which boards support the JROC?`,o:[`RRAB and MEIA`,`JCB and FCBs`,`PBR and POM`,`DAB and OIPT`],a:1,why:`Joint Capabilities Board and Functional Capability Boards.`}
]},
{id:`L52`,title:`What the JROC does, and doesn’t`,sub:`10 U.S.C. §181, the professor’s five-line summary, required inputs`,mins:8,slides:`Slide 24`,steps:[
 {t:`teach`,h:`Read the mission like a job description`,slide:`Slide 24`,b:`<p>10 U.S.C. §181 lists what the JROC assists the CJCS with. It’s long, so your professor boiled it down to five things the JROC has to do.</p>`},
 {t:`memo`,h:`The professor’s five-line summary`,big:`Know the world. Work with CCDRs. Know the gaps. Know the tech. Design the force.`,b:`<ol><li>Know the big picture of the strategic and operational environments</li><li>Work with the combatant commanders</li><li>Know current capabilities and the capability and capacity gaps</li><li>Know technologies and where they’re going</li><li>Design the joint force to deliver capabilities that close the gaps</li></ol>`},
 {t:`explore`,h:`The statute behind it`,spots:[[`(1) Trends & threats`,`Evaluate global trends, emerging threats and adversary capabilities to understand joint operational problems and shape joint force design.`],[`(2) JOPs with CCDRs`,`Coordinate with combatant commanders to compile, refine and prioritize joint operational problems.`],[`(3)–(4) Gaps`,`Continuously review joint military capabilities; identify and prioritize gaps and opportunities, recommending changes to close capability and capacity gaps.`],[`(5) Technology`,`Identify advances in technology, innovative commercial solutions and concepts of operation that could improve the military advantage of the joint force.`],[`(6) Requirements`,`Recommend joint capability requirements that describe the JOP for context, propose nonprescriptive solutions, and ensure interoperability where appropriate.`],[`(7)–(9) Design & repository`,`Design the joint force to address JOPs, evaluating Service force designs; keep a repository of JOPs and the capabilities that address them; evaluate requirements for 10 U.S.C. §4376(a).`]]},
 {t:`mc`,k:`k_jrocdoes`,q:`When the JROC recommends a joint capability requirement, the statute says it should propose solutions that are…`,o:[`Prescriptive, naming a specific system`,`Nonprescriptive`,`Service-specific`,`Commercial only`],a:1,why:`Nonprescriptive: describe the problem, leave room for many solutions, and ensure interoperability where appropriate.`},
 {t:`teach`,h:`Who the JROC must listen to: §181(d)`,b:`<ul><li><b>Combatant Commands:</b> “shall seek and strongly consider” their input.</li><li><b>Service Chiefs:</b> as end users of what the acquisition system delivers.</li><li><b>Vice Chief, NGB:</b> on non-federalized National Guard capabilities for homeland defense and civil support.</li><li><b>Industry:</b> views on commercially available technology for JOPs and gaps.</li></ul><p>And §181(e): <b>the Chief of Staff of each armed force is responsible for all performance requirements for that force.</b> That’s the legal footing for ending JROC validation of Service documents.</p>`},
 {t:`sort`,k:`k_jrocdoes k_jrocinputs`,q:`Does the reoriented JROC do this?`,bins:[`JROC does`,`JROC does NOT`],items:[[`Identify and prioritize joint operational problems`,0],[`Validate every Service requirements document`,1,`It ceased Service validation and document gatekeeping`],[`Seek and strongly consider CCDR input`,0],[`Appropriate money for programs`,1,`Only Congress appropriates; resourcing decisions run through the RRAB and PPBE`],[`Maintain a repository of JOPs`,0],[`Own each Service’s performance requirements`,1,`Each Service Chief owns those under §181(e)`],[`Seek industry views on commercial technology`,0],[`Design the joint force`,0]]},
 {t:`teach`,h:`Three definitions in the statute`,b:`<p><b>Joint operational problem:</b> a challenge across the joint force faced by a combatant command in achieving an assigned military objective; may include limitations in capabilities, resources, or the ability to coordinate across the joint force, with another CCMD, or among joint capabilities.</p><p><b>Joint capability requirement:</b> a capability critical or essential to address a joint operational problem.</p><p><b>Joint military capabilities:</b> the collective capabilities across the joint force, joint and force-specific, available to conduct military operations.</p>`},
 {t:`key`,h:`JROC mission & statutory responsibilities (Slide 24)`,k:`k_jrocdoes k_jrocinputs`,b:`<p>Assists the CJCS by evaluating trends and threats · prioritizing JOPs with CCDRs · reviewing capabilities and gaps · identifying technology and commercial solutions · recommending nonprescriptive, interoperable joint requirements · designing the joint force · keeping a JOP repository.</p><p>Inputs: CCMDs (strongly consider) · Service Chiefs · VCNGB · industry. Each Service Chief owns that Service’s performance requirements.</p>`,prof:`You have to know what the JROC does and doesn’t do: know the strategic and operational environments, work with CCDRs, know capabilities and gaps, know technologies, design the joint force to close the gaps.`}
],review:[
 {t:`recall`,k:`k_jrocdoes`,q:`Summarize what the JROC does in the professor’s five points.`,a:`Know the big picture of the strategic and operational environments; work with the CCDRs; know current capabilities and capability/capacity gaps; know technologies and where they’re going; design the joint force to close the gaps.`},
 {t:`recall`,k:`k_jrocinputs`,q:`Whose input must the JROC seek under 10 U.S.C. §181(d)?`,a:`Combatant Commands (seek and strongly consider), Service Chiefs (as end users), the Vice Chief of the National Guard Bureau (non-federalized NG for homeland defense and civil support), and industry (commercially available technology).`},
 {t:`mc`,k:`k_jrocinputs`,q:`Under §181(e), who is responsible for all performance requirements for an armed force?`,o:[`The JROC`,`The Chief of Staff of that armed force`,`USW(A&S)`,`The CCDR`],a:1,why:`The Service Chief.`}
]},
{id:`L53`,title:`The reoriented JROC`,sub:`JFD, JCI, CCMD requirements, CPM, and the reform mechanics`,mins:8,slides:`Slides 25, 27`,steps:[
 {t:`teach`,h:`From gatekeeper to strategist`,slide:`Slide 25`,b:`<p>Reorienting the JROC was the highest-priority recommendation in the FY24 NDAA §811 report to Congress, and it forms the foundation for every other reform effort.</p><p>Instead of validating Service paperwork, the JROC now focuses on four activities, all seen through the lens of Joint Operational Problems and powered by Capability Portfolio Management as the analytic engine.</p>`},
 {t:`explore`,h:`The four focus areas`,spots:[[`1 · Joint Force Design (JFD)`,`New. A long-term strategic outlook to shape the future Joint Force: missions, capabilities and concepts, force structure. Tests force packages and concepts against adversary scenarios.`],[`2 · Joint Capability Integration (JCI)`,`New. Continuously review capabilities for integration and interoperability, recommend changes to close gaps, and ensure the force is properly armed, globally integrated and ready.`],[`3 · CCMD Requirements`,`Revised. Review, assess and prioritize combatant command requirements: the Capability Gap Assessment, plus urgent and emergent needs.`],[`4 · Capability Portfolio Management (CPM)`,`Revised. The analytic engine: a common mission thread, common analytic scope and independent analysis, producing options and trade space for decision-makers.`]]},
 {t:`memo`,h:`Hook`,big:`Design the future. Integrate the present. Listen to the fight. Invest by portfolio.`,b:`JFD (the future, 7–25 years) · JCI (today’s programs) · CCMD requirements (the commanders’ gaps, including urgent ones) · CPM (analysis and money across portfolios). New: JFD and JCI. Revised: CCMD and CPM.`},
 {t:`sort`,k:`k_reoriented`,sid:`nr2`,q:`Brand-new activity, or a revised version of something the JROC already did?`,bins:[`New`,`Revised`],items:[[`Joint Force Design (JFD)`,0,`New. The JROC now drives the long-term blueprint of the future force.`],[`Joint Capability Integration (JCI)`,0,`New. It replaces JCIDS validation with a review after Service approval.`],[`CCMD Requirements`,1,`Revised. The JROC already reviewed combatant command gaps; now they feed JOPs and CPM.`],[`Capability Portfolio Management (CPM)`,1,`Revised. Portfolio management already existed; now it is the analytic engine.`]],why:`New: JFD and JCI. Revised: CCMD Requirements and CPM.`},
 {t:`sort`,k:`k_reoriented`,sid:`use2`,ins:true,q:`Which focus area handles it?`,bins:[`JFD`,`JCI`,`CCMD`,`CPM`],items:[[`Deciding the mix of manned and unmanned forces the Joint Force needs in 2045`,0,`Long-term design, 7–25 years out, is JFD.`],[`A Service has approved a new radar program. Will it work with the other Services’ systems?`,1,`Integration and interoperability of today’s programs is JCI.`],[`A combatant commander’s annual list of top capability gaps`,2,`That’s the IPL feeding the Capability Gap Assessment.`],[`Comparing every air and missile defense program to lay out risks, options and trade-offs`,3,`Portfolio-wide analysis is CPM, the analytic engine.`],[`Testing new force packages and concepts against adversary scenarios for the 2040s`,0,`JFD assesses force packages and concepts against adversary scenarios.`],[`A Service lowers a sensor threshold that other Services depend on`,1,`A change with joint impact triggers a JCI review by exception.`],[`A deployed force faces a new drone threat that is killing troops now`,2,`Urgent needs are CCMD requirements (today, a JICR).`],[`Building the integrated analysis the RRAB uses to decide where money goes`,3,`CPM analysis goes to the RRAB.`]],why:`Design the future. Integrate the present. Listen to the fight. Invest by portfolio.`},
 {t:`teach`,h:`Features of the reoriented JROC`,b:`<ul><li>More strategically focused</li><li>Identifies and prioritizes JOPs</li><li>Drives Joint Force Design activities</li><li>Prioritizes Joint Force capability gaps</li><li>Focuses on Joint Force requirements identification</li><li>Assesses Joint Force integration and interoperability</li><li>Balances near-term warfighting needs with long-term design investments</li><li><b>Ceases Service requirements validation and document gatekeeping</b></li></ul>`},
 {t:`teach`,h:`The mechanics on one page (Slide 27)`,fig:`mechanics`,slide:`Slide 27`,b:`<p>Follow the arrows: the JROC identifies and ranks JOPs → the four activities work those problems → <b>MEIA</b> does mission engineering, experimentation and industry engagement and sends initial and final recommendations → the <b>RRAB</b> issues programming guidance and allocates the <b>JAR</b> → the Services move at speed with no JROC validation or gatekeeping, and the JAR gives them an incentive to help resolve JOPs.</p>`},
 {t:`mc`,k:`k_mechanics k_rrab`,q:`In the reform mechanics, which body turns JROC priorities into programming guidance and JAR allocations?`,o:[`MEIA`,`RRAB`,`JCB`,`FCB`],a:1,why:`MEIA engineers and experiments; the RRAB decides resourcing.`},
 {t:`tf`,k:`k_mechanics`,q:`Under the reform, the Services still need JROC validation before moving forward on their own requirements.`,a:false,why:`“No impediment to Services moving at speed. No JROC validation or gatekeeping.”`},
 {t:`key`,h:`Reoriented JROC (Slides 25, 27)`,k:`k_reoriented k_mechanics`,b:`<ul><li>Highest-priority recommendation of the FY24 NDAA §811 report; the foundation for all other reforms.</li><li>Focus: <b>JFD</b> (new) · <b>JCI</b> (new) · <b>CCMD Requirements</b> (revised) · <b>CPM</b> (revised; the analytic engine), through the lens of <b>JOPs</b>.</li><li>Ceases Service validation and gatekeeping.</li><li>Mechanics: JROC → JOPs → 4 activities → MEIA (initial/final recs) → RRAB (programming guidance, JAR allocation) → Services (no gatekeeping; JAR incentive).</li></ul>`,prof:`Be able to summarize what the JROC does. Slide 27 is a summary: know the actions and activities.`}
],review:[
 {t:`recall`,k:`k_reoriented`,q:`Name the four focus areas of the reoriented JROC, and say which are new.`,a:`Joint Force Design (new), Joint Capability Integration (new), CCMD Requirements (revised), Capability Portfolio Management (revised), all through the lens of JOPs.`},
 {t:`mc`,k:`k_reoriented`,q:`What did the FY24 NDAA §811 report call its highest-priority recommendation?`,o:[`Create the JAR`,`Reorient the JROC`,`Abolish PPBE`,`Rename DAU`],a:1,why:`Reorient the JROC.`},
 {t:`recall`,k:`k_mechanics`,q:`Trace the reform mechanics from the JROC to the Services.`,a:`The JROC identifies and ranks JOPs → JFD, JCI, CCMD requirements and CPM work them → MEIA does mission engineering, experimentation and industry engagement and recommends solutions → the RRAB issues programming guidance and allocates JAR money → the Services move at speed without JROC gatekeeping, with a JAR incentive to help resolve JOPs.`},
 {t:`mc`,k:`k_reoriented`,q:`A Service approves its own new missile program with no JROC validation. Which reoriented-JROC activity then checks it for joint integration and interoperability?`,o:[`Joint Force Design`,`Joint Capability Integration`,`CCMD Requirements`,`Capability Portfolio Management`],a:1,why:`JCI reviews after Service approval and recommends; it doesn’t validate. Your professor’s follow-up in Unit 7: will that actually produce interoperability?`},
 {t:`mc`,k:`k_reoriented k_mechanics`,q:`Why did the reoriented JROC stop validating Service requirements documents?`,o:[`To move at speed: document gatekeeping was where JCIDS stalled, so the JROC shifts to strategy and joint problems`,`Because the Services asked to be left alone`,`Because Congress abolished the JROC`,`Because Service requirements no longer matter`],a:0,why:`Gatekeeping drove JCIDS’s 300-day reality and the compliance trap. The trade-off your professor flags: the JROC gives up part of its oversight, coordination and integration role, so driving joint solutions gets harder.`}
]}
]},
/* ============================== UNIT 6 ============================== */
{id:`U6`,title:`JOPs and Joint Force Design`,sub:`The problem statements that drive everything, and the blueprint built to solve them`,lessons:[
{id:`L61`,title:`Joint Operational Problems`,sub:`Definition, sources, KOPs vs. JOPs, examples`,mins:9,slides:`Slides 28–31`,steps:[
 {t:`teach`,h:`Back to where we started`,slide:`Slide 28`,b:`<p>Remember Okinawa and “problem vs. solution” from Lesson 1.1? The <b>Joint Operational Problem (JOP)</b> is the formal, joint version of that idea, and it’s now the central organizing principle of the whole requirements process.</p>`},
 {t:`teach`,h:`The definition, in two parts`,slide:`Slide 30`,b:`<p>Per 10 U.S.C. §181, the term joint operational problem:</p><p><b>(A)</b> means a challenge across the Joint Force in achieving an assigned military objective, based on current doctrine, emerging threats or future concepts; and</p><p><b>(B)</b> may include limitations in capabilities, capacity, resources, or the ability to effectively and efficiently coordinate across the Joint Force, with another combatant command, or among joint military capabilities.</p>`},
 {t:`teach`,h:`What the Manual adds`,b:`<ul><li>JOPs are the <b>most pressing challenges</b> to the current and future Joint Force, which create significant risk if left unaddressed.</li><li>They describe a <b>condition or situation</b> that resists, obstructs or prevents the Joint Force’s ability to achieve an assigned objective or task.</li><li>They articulate problems from an <b>integrated joint perspective</b>.</li><li><b>JOPs do not specify solutions.</b></li></ul>`},
 {t:`predict`,q:`Why would the Joint Staff insist that JOPs never name a solution?`,o:[`To keep documents short`,`Because every Service will answer with its own platform; an open solution space lets mission engineering, industry and cross-Service trades find the best answer`,`Because solutions are classified`],a:1,why:`Your professor: “All the Services will say, ‘We can solve that with… a destroyer, a plane, a satellite, a tank, a Marine.’” Naming a solution in the problem pre-decides the winner.`},
 {t:`sort`,k:`k_jopdef`,q:`Is this a well-formed JOP?`,bins:[`Good JOP`,`Not a JOP`],items:[[`The Joint Force cannot defend dispersed forces against simultaneous ballistic missiles, cruise missiles, UAS and aircraft.`,0],[`The Navy needs 20 more Aegis destroyers.`,1,`Names a solution and a single Service`],[`Sensors, shooters and command nodes are separated geographically and organizationally, so no common fire-control picture exists across COCOM boundaries.`,0],[`Field a space-based interceptor by 2030.`,1,`That’s a solution, not a condition`],[`Blue Force cannot target Red naval assets beyond the Second Island Chain in a contested EMS environment.`,0],[`Upgrade every DDG’s radar to SPY-6.`,1,`Specifies the fix`]]},
 {t:`teach`,h:`Where JOPs come from, and who owns them`,slide:`Slide 29`,b:`<p>The JROC identifies and prioritizes the top JOPs based on strategic guidance:</p><ul><li>National Defense Strategy (NDS) KOPs</li><li>Joint Warfighting Concept (JWC) KOPs</li><li>CCMD Integrated Priority Lists (IPLs)</li><li>Threat analysis and ongoing Joint Force Design activities</li></ul><p><b>Offices of primary responsibility:</b> the Joint Staff <b>J-7</b> (Joint Force Development: Joint Experimentation and Concept Implementation / Force Development and Design Execution Division) and the Joint Staff <b>J-8</b> Joint Capabilities Division (Force Structure, Resources, and Assessment), assisted by the CCMDs, Services and OSW.</p>`},
 {t:`mc`,k:`k_jopsrc`,q:`Which two Joint Staff directorates are the offices of primary responsibility for identifying and prioritizing JOPs?`,o:[`J-2 and J-3`,`J-7 and J-8`,`J-4 and J-6`,`J-1 and J-5`],a:1,why:`J-7 Joint Force Development and J-8 Force Structure, Resources and Assessment (its Joint Capabilities Division).`},
 {t:`teach`,h:`KOPs vs. JOPs`,slide:`Slide 30`,b:`<p>You’ll see <b>Key Operational Problems (KOPs)</b> in authoritative sources. The NDS’s KOPs are fairly broad, with subordinate problems described. The JWC’s KOPs vary from broad to quite specific. (The August 2025 memo itself spoke of KOPs.)</p><p>The JFRP uses <b>JOPs</b> to give the CJCS and JROC maneuver space to describe the most pressing warfighting challenges at a scope that works for JROC, CPM and MEIA analysis, while staying aligned and traceable to strategic guidance.</p>`},
 {t:`teach`,h:`Example JOPs: integrated air and missile defense`,slide:`Slide 31`,b:`<ul><li><b>IAMD of joint forces:</b> defend dispersed forces against simultaneous ballistic and cruise missiles, UAS and aircraft. Joint because no single Service owns the full sensor-shooter-C2 kill chain.</li><li><b>Global sensor-to-shooter integration:</b> space, maritime, land and air sensors must feed a common operational picture, e.g., space sensors cueing naval or land interceptors across COCOM boundaries.</li><li><b>Massed, complex air and missile attacks:</b> saturation raids mixing hypersonics, decoys, UAS swarms and cyber effects; requires layered defenses, cross-domain coordination and shared battle management.</li></ul>`},
 {t:`predict`,q:`Your professor looks at the last example and asks one question. Which?`,o:[`Who pays for it?`,`Who will do the integration of this system of systems to achieve layered defense?`,`Is it classified?`],a:1,why:`A JOP can name the integration challenge, but someone has to own the engineering. Hold that thought for JCI in Unit 7.`},
 {t:`key`,h:`Joint Operational Problems (Slides 28–31)`,k:`k_jopdef k_jopsrc k_kops k_jopex`,b:`<ul><li><b>Statute:</b> a challenge across the Joint Force in achieving an assigned military objective, based on current doctrine, emerging threats or future concepts; may include limits in capabilities, capacity, resources or coordination.</li><li><b>Manual:</b> most pressing challenges · a condition that resists, obstructs or prevents · integrated joint perspective · <b>do not specify solutions</b>.</li><li><b>Sources:</b> NDS KOPs, JWC KOPs, CCMD IPLs, threat analysis, JFD. <b>OPRs:</b> J-7 and J-8 JCD.</li><li><b>KOPs vs. JOPs:</b> JOPs give the JROC maneuver space while staying traceable to the NDS and JWC.</li></ul>`,prof:`Be able to say what a JOP is. Note it does not specify a solution: every Service will claim it can solve it with its own platform.`},
 {t:`explain`,k:`k_jopdef`,q:`Explain what a Joint Operational Problem is and why it must not specify a solution. Use an example.`,points:[`A JOP is a challenge across the Joint Force in achieving an assigned military objective (a condition that resists, obstructs or prevents it)`,`It can stem from doctrine, emerging threats or future concepts and may include capability, capacity, resource or coordination limits`,`The JROC prioritizes JOPs from NDS/JWC KOPs, CCMD IPLs and threat analysis`,`It must not specify a solution, so the solution space stays open (otherwise each Service pushes its own platform and mission engineering can’t find the best answer)`,`Gives a concrete example stated as a condition (e.g., IAMD of dispersed joint forces)`],model:`A JOP is a challenge across the Joint Force in achieving an assigned military objective: a condition, rooted in current doctrine, emerging threats or future concepts, that resists or prevents the force from accomplishing a task. It can include shortfalls in capability, capacity, resources or coordination. The JROC prioritizes JOPs drawn from NDS and JWC KOPs, CCMD IPLs and threat analysis. A JOP must not name a solution, because every Service will propose its own platform; keeping the solution space open lets mission engineering, experimentation and industry find the best joint answer. Example: the Joint Force cannot defend dispersed forces against simultaneous ballistic missiles, cruise missiles, UAS and aircraft.`}
],review:[
 {t:`recall`,k:`k_jopdef`,q:`Give the statutory definition of a Joint Operational Problem.`,a:`A challenge across the Joint Force in achieving an assigned military objective based on current doctrine, emerging threats or future concepts; it may include limitations in capabilities, capacity, resources, or the ability to effectively coordinate across the Joint Force, with another CCMD, or among joint military capabilities.`},
 {t:`tf`,k:`k_jopdef`,q:`A JOP should specify the preferred materiel solution so analysts can cost it.`,a:false,why:`JOPs do not specify solutions.`},
 {t:`recall`,k:`k_jopsrc`,q:`What strategic inputs does the JROC use to identify and prioritize JOPs?`,a:`NDS KOPs, Joint Warfighting Concept KOPs, CCMD Integrated Priority Lists, threat analysis, and ongoing Joint Force Design activities.`},
 {t:`mc`,k:`k_kops`,q:`Why does the JFRP use “JOPs” rather than just the NDS’s KOPs?`,o:[`KOPs are classified`,`JOPs give the CJCS and JROC maneuver space to scope problems for JROC, CPM and MEIA analysis, while staying traceable to strategic guidance`,`KOPs were cancelled by Congress`,`JOPs are Service-specific`],a:1,why:`Maneuver space, with traceability.`},
 {t:`mc`,k:`k_jopex`,q:`Why is integrated air and missile defense a joint problem?`,o:[`It is too expensive for one Service`,`No single Service owns the full sensor-shooter-C2 kill chain`,`Congress requires it`,`It only involves allies`],a:1,why:`Army, Navy, Air Force and allied systems must share tracks and engage in real time.`}
]},
{id:`L62`,title:`Joint Force Design`,sub:`Time horizons, the blueprint, and who does what`,mins:8,slides:`Slides 32–33`,steps:[
 {t:`teach`,h:`Designing a force you won’t command`,slide:`Slide 32`,b:`<p>Every force faces the same tension: money spent keeping today’s force ready can’t also be spent building tomorrow’s. Joint Force Design exists to make that trade deliberately.</p><p>JFD must establish a long-term <b>aimpoint</b> for the Joint Force and a common description of the future force, so the risk of imbalance can be measured precisely.</p>`},
 {t:`teach`,h:`Three time horizons`,fig:`horizons`,b:`<ul><li><b>Force Employment, 0–2 years:</b> fight with the force you have.</li><li><b>Force Development, 2–7 years:</b> shape what’s already coming (roughly inside the FYDP).</li><li><b>Force Design, 7–25 years:</b> blueprint the future force.</li></ul>`},
 {t:`memo`,h:`Hook`,big:`2 · 7 · 25`,b:`<b>Employ</b> what you have (0–2), <b>Develop</b> what’s coming (2–7), <b>Design</b> what you’ll need (7–25). E-D-D, with the boundaries at 2, 7 and 25 years.`},
 {t:`sort`,k:`k_horizons`,q:`Which horizon is each activity in?`,bins:[`Employment 0–2`,`Development 2–7`,`Design 7–25`],items:[[`Deploying a DDG to the Red Sea next month`,0],[`Fielding the next Aegis baseline already funded in the FYDP`,1],[`Deciding the mix of manned and unmanned ships the fleet needs in 2045`,2],[`Adjusting force packages for this year’s exercise`,0],[`Choosing between two programs inside the 5-year budget`,1],[`Testing new operating concepts against adversary scenarios for the 2040s`,2]]},
 {t:`teach`,h:`What JFD actually changes`,b:`<p>JFD includes activities that alter:</p><ul><li>the <b>operational missions</b> the force is meant to achieve,</li><li>the <b>capabilities and concepts</b> the force employs, and</li><li>the <b>structure</b> of the force: manpower, materiel and organization at Service and Departmental levels.</li></ul><p>It works from JROC-prioritized JOPs, translates strategic direction (NSS, NDS, DPG) into design guidance, iterates with the Services and CCMDs, and assesses force packages and concepts against an array of adversary scenarios.</p>`},
 {t:`teach`,h:`The blueprint`,b:`<p>The product is a <b>Joint Force Design: a blueprint that expresses</b></p><ul><li>the <b>size</b> of the force in manpower and equipment,</li><li>the <b>concepts and capabilities</b> it uses to conduct its missions, and</li><li>the <b>training, posture and other activities</b> needed to achieve national objectives.</li></ul>`},
 {t:`mc`,k:`k_jfd1`,q:`Your division officer asks, “What’s Joint Force Design?” Best one-sentence answer:`,o:[`It’s the new name for the budget.`,`It’s the long-term blueprint for the future Joint Force (its size, concepts and capabilities, training and posture), built to solve the JROC’s prioritized joint operational problems 7–25 years out.`,`It’s how a Service validates its CDDs.`,`It’s the process for urgent combatant command needs.`],a:1,why:`Size + concepts and capabilities + training and posture, aimed at prioritized JOPs, long term.`},
 {t:`teach`,h:`Who does what (Slide 33)`,fig:`jfdwho`,slide:`Slide 33`,b:`<p>The <b>Joint Staff</b> maintains the Joint Warfighting Concept, frames concise, threat-specific JOPs, and packages strategic guidance, threat evolution and CCMD inputs into JOPs and Concept Required Capabilities (CRCs) with supporting analysis.</p><p>The <b>JROC</b> prioritizes JOPs annually. Top problems get supporting analysis from Capability Portfolio Managers, with stakeholders task-organized across DoW. The goal: a clear, consistent joint demand signal that persists across budget cycles, for DoW and the industrial base.</p>`},
 {t:`mc`,k:`k_jfdwho`,q:`How often does the JROC prioritize JOPs?`,o:[`Every 4 years, with the NDS`,`Annually`,`Only when a JICR arrives`,`1–2 at a time, every PBR cycle`],a:1,why:`Annually. Don’t confuse this with the RRAB, which selects 1–2 JOPs per PBR cycle for resourcing.`},
 {t:`key`,h:`Joint Force Design (Slides 32–33)`,k:`k_jfd1 k_horizons k_jfdwho`,b:`<ul><li><b>One sentence:</b> the long-term blueprint of the future Joint Force (size in manpower and equipment; concepts and capabilities; training, posture and activities) built to solve the JROC’s prioritized JOPs.</li><li>Alters missions, capabilities and concepts, and structure (manpower, materiel, organization).</li><li><b>Horizons:</b> Employment 0–2 · Development 2–7 · Design 7–25 years.</li><li>Inherent tension: resourcing today’s force vs. investing early in the future force.</li><li>Joint Staff frames JOPs and CRCs; JROC prioritizes annually; CPMs analyze; goal: a persistent joint demand signal.</li></ul>`,prof:`Be able to tell your division officers, simply and in one sentence, what Joint Force Design is.`}
],review:[
 {t:`recall`,k:`k_horizons`,q:`What are the three JFD time horizons and their year ranges?`,a:`Force Employment 0–2 years; Force Development 2–7 years; Force Design 7–25 years.`},
 {t:`recall`,k:`k_jfd1`,q:`Explain Joint Force Design in one sentence.`,a:`Joint Force Design is the long-term blueprint for the future Joint Force (its size, concepts and capabilities, training and posture) built to solve the JROC’s prioritized joint operational problems 7–25 years out.`},
 {t:`type`,k:`k_horizons`,q:`Force Development covers ___ to 7 years.`,accept:[`2`,`two`]},
 {t:`mc`,k:`k_jfdwho`,q:`What does the Joint Staff package strategic guidance, threat evolution and CCMD inputs into?`,o:[`POMs and budget estimates`,`JOPs and Concept Required Capabilities (CRCs)`,`ICDs and CDDs`,`JICRs`],a:1,why:`JOPs and CRCs, with supporting analysis.`}
]},
{id:`L63`,title:`User stories and the backlog`,sub:`Why the JROC’s ranked JOP list works like an Agile backlog`,mins:6,slides:`Slides 33–34`,steps:[
 {t:`teach`,h:`Borrowing from software`,slide:`Slide 33`,b:`<p>Slide 33 makes a surprising comparison: the JROC’s ranked list of JOPs acts like a <b>user story backlog</b> in Agile software development. You need two definitions to get it.</p>`},
 {t:`teach`,h:`A user story`,fig:`userstory`,b:`<p>A user story describes a need from the user’s point of view in one sentence: <b>As a</b> [who], <b>I want</b> [what], <b>so that</b> [why]. It names the user, the need and the reason, but not how to build it.</p><p>Sound familiar? That’s exactly the property a JOP has.</p>`},
 {t:`order`,k:`k_backlog`,q:`Build a user story for a tactical action officer.`,lab:`Tap the three parts in template order.`,items:[`As a tactical action officer on a DDG,`,`I want fire-control-quality tracks from other ships’ radars,`,`so that I can engage missiles beyond my own radar horizon.`],why:`Who · what · why. It doesn’t say “buy CEC.” It states the need and leaves the solution to the engineers.`},
 {t:`teach`,h:`The backlog`,b:`<p>Your professor says to know this definition well:</p><div class="prof" style="margin-top:8px">A user story backlog is an <b>ordered, living list</b> of all desired product features, bug fixes and tasks written from the user’s perspective. It acts as the <b>single source of truth</b> for a project, where <b>high-priority items sit at the top</b>, ready for upcoming development.</div>`},
 {t:`fill`,k:`k_backlog`,q:`A backlog is an ___, living list written from the ___ perspective. It is the single source of ___, with high-priority items at the ___.`,blanks:[`ordered`,`user’s`,`truth`,`top`],bank:[`ordered`,`user’s`,`truth`,`top`,`random`,`contractor’s`,`funding`,`bottom`]},
 {t:`teach`,h:`Why this matters for your career`,slide:`Slide 34`,b:`<p>Map it across: JOPs are the user stories (from the warfighter’s perspective, no solutions). The JROC’s annually ranked list is the backlog. The problems at the top get the analysis and the money.</p><p>Slide 34 pairs this with the Joint Planning Process and the Apollo 13 scene (“We’re talking about time!”): real constraints set real priorities. Your professor’s note: because the backlog is permanent and living, the Pentagon and Joint Staff billets that manage it will be enduring.</p>`},
 {t:`key`,h:`User stories and the backlog (Slides 33–34)`,k:`k_backlog k_jfdwho`,b:`<ul><li><b>User story:</b> As a [who], I want [what], so that [why].</li><li><b>Backlog:</b> an ordered, living list of all desired features, bug fixes and tasks written from the user’s perspective; the single source of truth; high-priority items at the top, ready for development.</li><li>The JROC’s ranked JOP list = the Joint Force’s user story backlog.</li></ul>`,prof:`Make sure you know what a user story backlog is. This is why billet assignments in the Pentagon and Joint Staff will be enduring.`}
],review:[
 {t:`recall`,k:`k_backlog`,q:`Define a user story backlog.`,a:`An ordered, living list of all desired product features, bug fixes and tasks written from the user’s perspective. It is the single source of truth for a project, with high-priority items at the top, ready for upcoming development.`},
 {t:`recall`,k:`k_backlog`,q:`What is the user story template?`,a:`As a [who], I want [what], so that [why].`},
 {t:`mc`,k:`k_backlog k_jfdwho`,q:`In the JFRP, what plays the role of the user story backlog?`,o:[`The FYDP`,`The JROC’s ranked list of JOPs`,`One CCDR’s IPL`,`The 7.2B chart`],a:1,why:`The JROC’s annually prioritized JOPs.`}
]}
]},
/* ============================== UNIT 7 ============================== */
{id:`U7`,title:`JCI, CCMD requirements, CPM`,sub:`The review that replaced validation, the commanders’ voice, and following the money`,lessons:[
{id:`L71`,title:`Joint Capability Integration`,sub:`Initial and by-exception reviews, 55 days, and the interoperability question`,mins:9,slides:`Slides 35–36`,steps:[
 {t:`teach`,h:`What JCI is for`,slide:`Slide 35`,b:`<p>Joint Capability Integration replaces the JROC’s old gatekeeping role. Its three jobs:</p><ul><li><b>Review and assess</b> the military capabilities of the Services and components</li><li><b>Identify and prioritize gaps and opportunities</b> in joint military capabilities: capability and capacity gaps</li><li><b>Recommend</b> joint capability requirements that ensure system interoperability</li></ul>`},
 {t:`predict`,q:`Look at the verbs: review, identify, recommend. What doesn’t JCI do?`,o:[`It doesn’t look at Service programs`,`It doesn’t fix anything; it only recommends`,`It doesn’t involve the JROC`],a:1,why:`Your professor: “All it does is recommend. It does not do anything to fix the problem.” Remember that for the interoperability question at the end of this lesson.`},
 {t:`teach`,h:`How a JCI review works`,fig:`jci`,slide:`Slide 36`,b:`<p>Everything happens <b>after the Service or Component has approved</b> its own requirement. There are two kinds of review.</p><p><b>Initial review (push):</b> joint/capstone, Service/Component, or CCMD-derived requirements, in the Service’s own document format, as long as it includes operational context, threat/intelligence, the requirement, and integration/interoperability.</p><p><b>By-exception review (pull):</b> the JROC assesses Service or Component decisions, or changes to capability development, that impact the Joint Force.</p>`},
 {t:`memo`,h:`By-exception categories`,big:`A-I-C-R: Any Issue Can Ripple`,b:`<b>A</b>cquisition (cost, schedule, performance impacts) · <b>I</b>ntelligence (CIP breach, cyber incident damage assessment, classified information compromise assessment) · <b>C</b>apacity (quantity changes) · <b>R</b>eadiness. A Service decision in any of these can ripple across the Joint Force.`},
 {t:`sort`,k:`k_jcirev`,q:`Which by-exception category?`,bins:[`Acquisition`,`Intelligence`,`Capacity`,`Readiness`],items:[[`A Service program slips two years and its cost rises 30%`,0],[`A cyber incident compromises a program’s classified design data`,1],[`The Navy cuts its planned buy of a missile in half`,2],[`A maintenance backlog leaves fewer ships ready for CCDR taskings`,3],[`A critical program information (CIP) breach`,1],[`A Service lowers a sensor performance threshold that other Services depend on`,0]]},
 {t:`teach`,h:`The rules of the review`,b:`<ul><li><b>Single round of staffing</b> to stakeholders, <b>no adjudication</b>. Stakeholders identify issues, concerns and barriers and rate the impact positive, negative or neutral.</li><li><b>Outcomes:</b> endorse or reject as a Joint Force requirement; make recommendations, give direction or guidance, or direct further analysis on joint impacts and mitigation; establish <b>tripwires/comebacks</b>.</li><li><b>Maximum of 55 business days</b> to execute JCI.</li><li>Preserves the JROC’s statutory responsibility, the CCMD view and voice in requirements development, and awareness and visibility for JFDD.</li></ul>`},
 {t:`type`,k:`k_jcirev`,q:`Maximum time to execute a JCI review, in business days?`,accept:[`55`,`55 business days`,`fifty five`,`fifty-five`]},
 {t:`mc`,k:`k_jcirev`,q:`When does a JCI review happen relative to Service approval?`,o:[`Before the Service may approve`,`After Service/Component approval`,`Only at Milestone B`,`Only for JICRs`],a:1,why:`All JCI actions are post-Service/Component approval: the opposite of JCIDS, where the JROC validated first.`},
 {t:`teach`,h:`The professor’s prediction`,slide:`Slides 35–36`,b:`<p>“This will not solve integration, certainly not in the form of any sensor, any weapon, any time, anywhere. Specifications are indispensable, and none of this mandates the engineering required.”</p><p>Integration in a technical system-of-systems sense requires:</p><ol><li><b>Unambiguous technical requirements and specifications</b></li><li>A <b>technical staff</b> to implement them and maintain <b>configuration control</b></li><li><b>Continuous oversight</b> and coordination of the specifications and compliance with them</li><li><b>Testing</b> of system performance</li><li><b>Correction</b> of identified deficiencies</li></ol><p>Aegis does this with engineering sites like CSEDS, its land-based combat system test site. A recommendation process doesn’t.</p>`},
 {t:`key`,h:`Joint Capability Integration (Slides 35–36)`,k:`k_jci k_jcirev k_interop`,b:`<ul><li>Reviews and assesses capabilities, identifies and prioritizes gaps, <b>recommends</b> joint requirements for interoperability. It only recommends.</li><li><b>Initial review</b> (joint/capstone, Service, CCMD-derived; Service format with operational context, threat, requirement, integration/interoperability) and <b>by-exception review</b> (Acquisition, Intelligence, Capacity, Readiness).</li><li>Single staffing round, no adjudication. Outcomes: endorse/reject, recommend/direct/analyze, tripwires/comebacks.</li><li>All post-Service approval; <b>maximum 55 business days</b>. Preserves JROC statute, CCMD voice, JFDD awareness.</li></ul>`,prof:`If asked whether this will produce interoperability, your answer must include: 1) NO, 2) BECAUSE…`},
 {t:`explain`,k:`k_interop`,q:`Exam question: “Will Joint Capability Integration produce interoperability?” Answer it the way your professor expects.`,points:[`Answers no`,`JCI only reviews and recommends; it doesn’t mandate or perform the engineering`,`Integration requires unambiguous technical requirements and specifications`,`It requires a technical staff with configuration control, plus continuous oversight of compliance with the specifications`,`It requires testing of system performance and correction of identified deficiencies (e.g., Aegis/CSEDS-style engineering)`],model:`No. JCI is a review-and-recommend process: it assesses Service capabilities after the Service approves them and makes recommendations within 55 business days, but it doesn’t mandate or perform any engineering. Real system-of-systems interoperability requires unambiguous technical requirements and specifications, a technical staff to implement them under configuration control, continuous oversight of compliance with those specifications, testing of integrated performance, and correction of deficiencies, the way Aegis uses land-based engineering sites like CSEDS. None of that is in JCI.`}
],review:[
 {t:`mc`,k:`k_jci`,q:`Which set of verbs describes what Joint Capability Integration does?`,o:[`Review and assess, identify and prioritize gaps, recommend`,`Validate, certify, fund`,`Design, build, test`,`Appropriate, obligate, expend`],a:0,why:`JCI reviews and assesses capabilities, identifies and prioritizes gaps and opportunities, and recommends joint capability requirements for interoperability. It only recommends.`},
 {t:`recall`,k:`k_interop`,q:`Will JCI produce interoperability? Give the professor’s answer.`,a:`No, because JCI only recommends. Integration requires unambiguous technical requirements and specifications, a technical staff with configuration control, continuous oversight and compliance, testing of system performance, and correction of deficiencies. None of that is mandated.`},
 {t:`recall`,k:`k_jcirev`,q:`Name the four by-exception review categories in JCI.`,a:`Acquisition (cost, schedule, performance), Intelligence (CIP breach, cyber incident damage assessment, classified information compromise assessment), Capacity (quantity changes), Readiness.`},
 {t:`recall`,k:`k_jcirev`,q:`What are the possible outcomes of a JCI review?`,a:`Endorse or reject as a Joint Force requirement; make recommendations, provide direction or guidance, or direct further analysis on joint impacts and mitigation; establish tripwires/comebacks.`},
 {t:`tf`,k:`k_jcirev`,q:`JCI staffing includes full adjudication of every stakeholder comment.`,a:false,why:`Single round of staffing, no adjudication.`}
]},
{id:`L72`,title:`JCIDS vs. JCI`,sub:`Six differences, and the professor’s critique of each`,mins:8,slides:`Slide 39`,steps:[
 {t:`teach`,h:`The comparison the exam loves`,fig:`jcidsjci`,slide:`Slide 39`,b:`<p>Slide 39 lines up the old and new processes on six dimensions. Learn the rows: Validation, Documentation, Comment adjudication, Certifications/endorsements, Delegation, Timeline.</p>`},
 {t:`memo`,h:`Hook for the six rows`,big:`Very Detailed Comments Can Delay Time`,b:`<b>V</b>alidation · <b>D</b>ocumentation · <b>C</b>omment adjudication · <b>C</b>ertifications · <b>D</b>elegation · <b>T</b>imeline. Which is exactly what JCIDS did.`},
 {t:`sort`,k:`k_jcidsjci`,q:`JCIDS or JCI?`,bins:[`JCIDS (old)`,`JCI (new)`],items:[[`JROC validates Service/Component requirements`,0],[`JROC reviews documents only after Service approval`,1],[`Prescribed standardized formats; rejected for format`,0],[`Uses Service formats; minimum info; content over format`,1],[`Full adjudication of critical and substantive comments; consensus incentivized`,0],[`Information-only comments; productively adversarial debate`,1],[`Mandated J6/J8 certifications and endorsements`,0],[`Defers certifications to the Services, with 1–2 exceptions`,1],[`JROC and JCB validate all requirements`,0],[`Review and approval delegated as low as the FCB level`,1],[`40–100 days nominal, ≈300 actual`,0],[`55 business days nominal; actual TBD`,1]]},
 {t:`teach`,h:`The professor’s critique, row by row`,b:`<p>“Sounds good, but…”</p><ul><li><b>Validation:</b> what if a Service reviews the documentation, then disapproves? Then what?</li><li><b>Documentation:</b> no joint standardization, but integration requires details. Consider Aegis and CSEDS.</li><li><b>Comment adjudication:</b> engineering takes time and empirical data. The debate won’t happen unless the Joint Staff/JROC fosters it.</li><li><b>Certifications:</b> easier for the Services, but what about joint? Why isn’t the common tactical picture high-fidelity? Lack of tight integration.</li><li><b>Delegation:</b> JCI enables stovepiping through low levels of awareness.</li><li><b>Timelines:</b> haste makes waste.</li></ul>`},
 {t:`match`,k:`k_jcidsjci`,q:`Match each change to the professor’s critique.`,pairs:[[`Validation`,`What if a Service disapproves? Then what?`],[`Documentation`,`No joint standard, but integration needs details`],[`Comment adjudication`,`Engineering needs time and data; debate needs a sponsor`],[`Certifications`,`Easier for Services; joint picture still not high-fidelity`],[`Delegation`,`Enables stovepiping`],[`Timeline`,`Haste makes waste`]]},
 {t:`key`,h:`JCIDS vs. JCI (Slide 39)`,k:`k_jcidsjci`,b:`<p>Six areas changed: Validation · Documentation · Comment adjudication · Certifications/endorsements · Delegation · Timeline.</p><p>JCI: no JROC validation (review after Service approval) · Service formats, minimum info · information-only comments, adversarial debate · certifications deferred to Services · delegation to the lowest level (FCB) · 55 business days.</p>`,prof:`Sounds good, but: what if a Service disapproves? No joint standard for the details integration needs. Debate must be fostered. The joint picture lacks tight integration. Stovepiping. Haste makes waste.`},
 {t:`explain`,k:`k_jcidsjci`,q:`Pick two areas where JCI changed JCIDS. For each, state what changed and the professor’s critique.`,points:[`Correctly states what JCIDS did for the first area`,`Correctly states what JCI does for the first area`,`Gives the professor’s critique for the first area`,`Correctly states the JCIDS-to-JCI change for the second area`,`Gives the professor’s critique for the second area`],model:`Documentation: JCIDS prescribed standardized formats and rejected documents for format; JCI accepts Service formats and asks only for minimum information, content over format. The professor’s critique: without joint standardization you lose the detail integration needs, which Aegis and CSEDS show lives in detailed specifications. Delegation: JCIDS had the JROC and JCB validate everything; JCI delegates review and approval to the lowest possible level, down to FCBs. The critique: low-level approval means low awareness, which enables stovepiping.`}
],review:[
 {t:`recall`,k:`k_jcidsjci`,sid:`r0b`,q:`Name three ways JCI changed the old JCIDS process, and give your professor’s critique of each.`,a:`Any three: Validation: the JROC no longer validates Service documents; it reviews after Service approval (critique: what if a Service disapproves? Then what?). Documentation: Service formats and minimum information instead of standardized joint formats (critique: no joint standard, but integration needs details, as Aegis and CSEDS show). Comment adjudication: information-only comments and adversarial debate instead of adjudicating to consensus (critique: engineering takes time and data, and the debate won’t happen unless the Joint Staff and JROC foster it). Certifications: deferred to the Services (critique: easier for Services, but the joint picture still isn’t high-fidelity). Delegation: approval at the lowest level, down to FCBs (critique: enables stovepiping). Timeline: 55 business days max (critique: haste makes waste).`},
 {t:`mc`,k:`k_jcidsjci`,q:`Under JCI, how are stakeholder comments handled?`,o:[`Fully adjudicated to consensus`,`Information-only, encouraging productively adversarial debate`,`Ignored`,`Forwarded to Congress`],a:1,why:`Information-only commenting cuts sponsor adjudication time.`},
 {t:`mc`,k:`k_jcidsjci`,q:`The professor’s critique of delegating JCI approval to the lowest level:`,o:[`It’s too slow`,`It enables stovepiping through low levels of awareness`,`It costs more`,`It violates the NDAA`],a:1,why:`Stovepiping.`}
]},
{id:`L73`,title:`Combatant command requirements`,sub:`IPLs, the Capability Gap Assessment, and the JICR`,mins:8,slides:`Slide 37`,steps:[
 {t:`teach`,h:`The people who actually fight`,slide:`Slide 37`,b:`<p>Services organize, train and equip. Combatant commanders <b>fight</b>. When a CCDR finds a gap, the system needs a reliable way to hear it, prioritize it, and, when lives are at stake, act fast.</p>`},
 {t:`teach`,h:`The annual channel: IPL → CGA`,b:`<p>Each CCDR submits an <b>Integrated Priority List (IPL)</b>: its prioritized capability gaps.</p><p>The <b>Capability Gap Assessment (CGA)</b> is the process that reviews, assesses and prioritizes those CCMD requirements. It remains the <b>primary method</b> supporting the CJCS in meeting <b>10 U.S.C. §153</b> responsibilities: the Annual Report on Combatant Command Requirements.</p><p>CGA reform began in July 2025 with DJ8 interim guidance on foundational inputs (gap description and scope); work on the analytic framework and outcomes runs in parallel. CGA results and IPLs now feed JOP development and prioritization, CPM analysis and JFDD.</p>`},
 {t:`memo`,h:`Your professor’s instruction`,big:`Capability Gap Assessment. IPL.`,b:`His note says to say “Capability Gap Assessment” ten times out loud, and “IPL” ten times. That’s how critical he considers them. Go ahead; nobody’s listening.`},
 {t:`mc`,k:`k_cga`,q:`What is the primary method supporting the CJCS’s annual report on combatant command requirements (10 U.S.C. §153)?`,o:[`The JICR`,`The Capability Gap Assessment (CGA)`,`The PBR`,`The CDD`],a:1,why:`The CGA, fed by each CCDR’s IPL.`},
 {t:`teach`,h:`The fast lane: JICR`,b:`<p>Some gaps can’t wait for an annual cycle. They used to be handled as <b>JUONs</b> (Joint Urgent Operational Needs, for ongoing operations) and <b>JEONs</b> (Joint Emergent Operational Needs, for anticipated or imminent operations).</p><p>As of <b>5 August 2026</b>, both are replaced by the <b>JICR</b>: the Joint Immediate Combatant Command Requirement.</p>`},
 {t:`key`,h:`JICR (Slide 37 notes)`,k:`k_jicr`,b:`<p>A JICR is <b>an immediate Joint CCMD capability requirement that, if left unfulfilled, will result in certain death and/or pose unacceptable risks to a primary objective of ongoing or imminent operations.</b></p><p>As of 5 August 2026 it replaces both the JUON and the JEON. It is reserved exclusively for CCMD capability gaps that carry immediate, severe consequences.</p>`,prof:`Make sure you know the JICR definition.`},
 {t:`fill`,k:`k_jicr`,q:`A JICR is an immediate Joint CCMD capability requirement that, if unfulfilled, will result in certain ___ and/or pose unacceptable risks to a ___ objective of ongoing or ___ operations.`,blanks:[`death`,`primary`,`imminent`],bank:[`death`,`primary`,`imminent`,`delay`,`secondary`,`future`,`cost`,`planned`]},
 {t:`teach`,h:`Help for urgent technical needs`,b:`<ul><li>Support for urgent technical needs comes through <b>DASW(AI2)</b> (Acquisition Integration and Interoperability) and the <b>JRAC</b> (Joint Rapid Acquisition Cell).</li><li>Potential pathways run through <b>MEIA</b>: prototyping and experimentation, operational integration and interoperability, and transition.</li><li>A <b>CCMD Derived Requirement</b> lets a combatant command state tasks, conditions and standards without a Service sponsor when an unmitigated gap is an unacceptable risk.</li><li>Slide 37 admits urgent and emergent requirements weren’t right yet; a reform sprint reported to the March 2026 JROC offsite. The August 2026 manual then replaced both with the JICR.</li></ul>`},
 {t:`sort`,k:`k_jicr k_cga`,q:`Which channel fits each gap?`,fig:`urgent`,bins:[`Service process`,`IPL / CGA`,`JICR`],items:[[`A deployed JTF faces a new drone threat that is killing troops now`,2],[`INDOPACOM’s top long-term gap in contested logistics`,1],[`The Navy wants a better shipboard laundry system`,0],[`A CCDR faces unacceptable risk to the primary objective of an imminent operation`,2],[`A CCDR’s annual list of prioritized capability gaps`,1],[`An Army-only training simulator upgrade`,0]]},
 {t:`key`,h:`Combatant Command Requirements (Slide 37)`,k:`k_cga k_jicr`,b:`<ul><li>The JROC reviews, assesses and prioritizes CCMD requirements through the <b>Capability Gap Assessment</b>, the primary method supporting the CJCS’s annual §153 report. CGA reform began July 2025.</li><li><b>IPLs</b> and the CGA feed JOP development, CPM analysis and JFDD.</li><li>Urgent and emergent needs: JUON/JEON → <b>JICR</b> (as of 5 Aug 2026). Support via DASW(AI2), JRAC and MEIA pathways.</li></ul>`,prof:`Say “Capability Gap Assessment” 10 times out loud. Say “IPL” 10 times out loud.`}
],review:[
 {t:`recall`,k:`k_jicr`,q:`Define a JICR.`,a:`Joint Immediate Combatant Command Requirement: an immediate Joint CCMD capability requirement that, if left unfulfilled, will result in certain death and/or pose unacceptable risks to a primary objective of ongoing or imminent operations. It replaced the JUON and JEON on 5 August 2026.`},
